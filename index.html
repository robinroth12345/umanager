<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lehrerpult">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<title>Lehrerpult</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23e3051a'/%3E%3Cpath d='M20 46V18h7v22h17v6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f3f3;--panel:#fff;--panel2:#f7f7f7;--ink:#1a1a1a;--muted:#6f6f6f;--line:#dcdcdc;
  --accent:#e3051a;--accent-ink:#fff;--accent-soft:#fde7e9;
  --sel:#212121;--sel-ink:#fff;--good:#577760;--good-soft:#e7efe9;
  --side:#fff;--side-ink:#1a1a1a;--side-muted:#777;--side-active:#e3051a;
  --danger:#c8101f;--danger-soft:#fbe3e5;--warn:#8f5410;--warn-soft:#fbefd9;--ok:#577760;
  --zebra:rgba(0,0,0,.045);--hover:rgba(227,5,26,.07);
  --shadow:none;--r:2px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131313;--panel:#1d1d1d;--panel2:#242424;--ink:#ededed;--muted:#a0a0a0;--line:#353535;
  --accent:#ff3b4b;--accent-ink:#fff;--accent-soft:#3a1a1d;
  --sel:#ededed;--sel-ink:#141414;--good:#8fb79a;--good-soft:#1f2c23;
  --side:#1d1d1d;--side-ink:#ededed;--side-muted:#999;--side-active:#ff3b4b;
  --danger:#ff6b76;--danger-soft:#3b2023;--warn:#e3ad60;--warn-soft:#3a2e1c;--ok:#8fb79a;
  --zebra:rgba(255,255,255,.05);--hover:rgba(255,59,75,.10);
  --shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131313;--panel:#1d1d1d;--panel2:#242424;--ink:#ededed;--muted:#a0a0a0;--line:#353535;
  --accent:#ff3b4b;--accent-ink:#fff;--accent-soft:#3a1a1d;
  --sel:#ededed;--sel-ink:#141414;--good:#8fb79a;--good-soft:#1f2c23;
  --side:#1d1d1d;--side-ink:#ededed;--side-muted:#999;--side-active:#ff3b4b;
  --danger:#ff6b76;--danger-soft:#3b2023;--warn:#e3ad60;--warn-soft:#3a2e1c;--ok:#8fb79a;
  --zebra:rgba(255,255,255,.05);--hover:rgba(255,59,75,.10);
  --shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 "Source Sans 3","Source Sans Pro","Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}
h1{font-size:1.9rem;font-weight:300}h2{font-size:1.45rem;font-weight:300}h3{font-size:1.12rem;font-weight:600}h4{font-size:1rem;font-weight:600}
p{margin:.3em 0 .8em}
.muted{color:var(--muted)}.center{text-align:center;justify-content:center}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
#app{display:flex;flex-direction:column;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:18px;padding:0 24px;padding-top:env(safe-area-inset-top);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:300;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;padding:10px 0;white-space:nowrap}
.brand .logo{width:34px;height:34px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.1rem;letter-spacing:0}
#navlist{display:flex;align-items:stretch;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
#navlist::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit}
.nav{display:flex;align-items:center;gap:8px;border:0;background:none;color:rgba(0,0,0,.75);padding:0 11px;cursor:pointer;font-size:.95rem;white-space:nowrap;border-bottom:3px solid transparent;border-top:3px solid transparent;min-height:56px}
:root[data-theme="dark"] .nav{color:rgba(255,255,255,.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav{color:rgba(255,255,255,.8)}}
.nav svg{display:none}
.nav:hover{color:var(--accent)}
.nav.active{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.sidefoot{display:none}
main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:1.25rem;font-weight:300;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menubtn{display:none}
#stat{font:inherit;font-size:.78rem;color:var(--muted);white-space:nowrap;border:0;background:none;padding:4px 6px;border-radius:var(--rs);cursor:pointer}
#stat:hover{background:var(--panel2)}
#stat.bad{color:var(--danger);font-weight:600}
#stat.nudge{animation:icnudge 1.2s ease-in-out 4;background:var(--danger-soft)}@keyframes icnudge{50%{transform:scale(1.08)}}
#mini{display:none;font-variant-numeric:tabular-nums;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:5px 10px;border-radius:var(--rs);border:0;cursor:pointer}
#view{padding:22px 24px 60px;max-width:1400px;width:100%}
.sel,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;min-height:38px}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:var(--rs);cursor:pointer;min-height:38px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:var(--danger-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.88rem}
.btn.lg{padding:12px 22px;font-size:1.05rem;min-height:48px}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:none;cursor:pointer;padding:6px 8px;border-radius:var(--rs);color:var(--muted);min-width:34px;min-height:34px}
.icon:hover{background:var(--panel2);color:var(--ink)}
.icon.danger:hover{color:var(--danger);background:var(--danger-soft)}
.icon.sm{min-width:28px;min-height:28px;padding:3px 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cardhead h2,.cardhead h3{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid2 .card{margin:0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.cols2 .card{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty h3{color:var(--ink)}
.hero{margin:4px 0 18px}
.hero h1{margin-bottom:2px}
.dhero{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}.dhero>div{flex:1;min-width:200px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);margin-bottom:16px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner b{color:inherit}
.banner .btn{margin-left:auto}
.form{display:flex;flex-direction:column;gap:12px}
.form label,label.blk{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);font-weight:500}
.form label input,.form label select,.form label textarea{color:var(--ink);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
fieldset{border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px 4px;margin:0}
legend{font-size:.85rem;color:var(--muted);padding:0 4px}
.hint{font-size:.82rem;color:var(--muted);margin:2px 0 0}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:.92rem}
.chk input{min-height:auto;width:18px;height:18px;accent-color:var(--accent)}
.chk input.num{width:84px;height:auto;min-height:38px}
.chk input[type=date],.chk select{width:auto;height:auto;min-height:36px}
.form label.chk{flex-direction:row;align-items:center;color:var(--ink);font-size:.92rem}
.form label.chk>input[type=checkbox]{width:20px;height:20px;min-width:20px;flex:none}
.lstat>span:first-child{flex:1 1 300px}
.form label>input,.form label>select,label.blk>input,label.blk>select{width:100%;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:var(--rs);padding:7px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-weight:400}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.8}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.badge{display:inline-block;min-width:2.6em;text-align:center;padding:2px 7px;border-radius:var(--rs);font-weight:600;font-variant-numeric:tabular-nums;background:var(--panel2)}
.g1{background:rgba(46,160,90,.22)!important}.g2{background:rgba(120,180,60,.24)!important}.g3{background:rgba(222,182,40,.28)!important}
.g4{background:rgba(236,140,40,.28)!important}.g5{background:rgba(226,92,60,.28)!important}.g6{background:rgba(200,40,40,.34)!important}
/* tables */
.tblwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%}
table.list td,table.list th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.list th{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
table.list input{width:100%;border-color:transparent;background:transparent}
table.list input:hover{border-color:var(--line)}
table.list tr.addrow input{border-color:var(--line);background:var(--panel)}
table.grid{width:auto;min-width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px;text-align:center;background:var(--panel)}
table.grid thead th{background:var(--panel2);font-weight:500;font-size:.82rem;vertical-align:bottom}
table.grid .sticky{position:sticky;left:0;z-index:2;text-align:left;min-width:170px;max-width:230px;padding:6px 10px;box-shadow:1px 0 0 var(--line)}
table.grid thead .sticky{z-index:3}
table.grid td.name{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
table.grid td.name:hover{color:var(--accent)}
table.grid .avg{background:var(--panel2);min-width:64px;font-variant-numeric:tabular-nums}
table.grid .tot{font-weight:700}
table.grid tfoot td{background:var(--panel2);font-size:.85rem;color:var(--muted)}
.eh{cursor:pointer;min-width:74px;max-width:110px}
.eh:hover{background:var(--accent-soft)!important}
.eh .et{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px;margin:auto}
.eh .ed{font-size:.75rem;color:var(--muted)}
.tb{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 5px;border-radius:var(--rs);margin-bottom:2px}
.t-s .tb{background:#dbe7f7;color:#2a568f}.t-m .tb{background:#e4f1dc;color:#3c6b23}.t-o .tb{background:#efe3f5;color:#6d3d86}
.gin,.pin{width:58px;text-align:center;padding:6px 2px;min-height:36px;font-weight:600;font-variant-numeric:tabular-nums}
.gin.bad,.pin.bad{border-color:var(--danger);background:var(--danger-soft)}
.task{position:relative;min-width:70px}
.tname,.tmax{width:62px;text-align:center;padding:4px;min-height:32px;font-weight:600;background:transparent}
.tmax{font-weight:400}
.task .x{position:absolute;top:1px;right:1px;border:0;background:none;color:var(--muted);font-size:.7rem;cursor:pointer;padding:2px 4px;border-radius:var(--rs)}
.task .x:hover{color:var(--danger)}
.maxrow th{font-size:.8rem}
table.scheme{width:auto}
table.scheme td,table.scheme th{padding:3px 6px;text-align:left;font-size:.9rem}
table.scheme th{color:var(--muted);font-weight:500;font-size:.8rem}
.sg{width:60px;text-align:center;font-weight:600}.sp{width:70px;text-align:center}
/* dashboard */
.dlist{list-style:none;margin:0;padding:0}
.dlist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dlist li:last-child{border-bottom:0}
.dlist .pn{width:32px;height:32px;border-radius:var(--rs);background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.dlist .sub{font-size:.8rem;color:var(--muted)}
.clscard{display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--cc,var(--accent))}
.clscard .t{font-weight:700;font-size:1.15rem}
.clscard .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.88rem}
.card.exam{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;margin:0;width:100%}
.card.exam:hover{border-color:var(--accent)}
.ex-t{font-weight:700;font-size:1.05rem}
.ex-s{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;color:var(--muted)}
.pagehead{margin-bottom:12px}
/* Notenspiegel */
.spiegel{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 0 0;margin:8px 0 6px}
.spiegel .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.spiegel .bar{width:100%;max-width:46px;border-radius:var(--rs);min-height:3px}
.spiegel .n{font-weight:700;font-size:.9rem}
.spiegel .l{font-size:.85rem;color:var(--muted);font-weight:600;white-space:nowrap}
.spiegel.many{gap:2px}.spiegel.many .l{font-size:.62rem}.spiegel.many .n{font-size:.75rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px}
.stat{background:var(--panel2);border-radius:var(--rs);padding:10px 12px}
.stat .k{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
/* Anwesenheit */
.attrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.attrow .nm{flex:1;min-width:150px;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;cursor:pointer;min-height:36px;font-weight:600;font-size:.88rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.a{background:var(--accent-soft);color:var(--accent)}
.seg button.on.E{background:#dbe7f7;color:#2a568f}
.seg button.on.U{background:var(--danger-soft);color:var(--danger)}
.seg button.on.V{background:var(--warn-soft);color:var(--warn)}
.tog{border:1px solid var(--line);background:var(--panel);border-radius:var(--rs);padding:7px 11px;cursor:pointer;min-height:36px;font-size:.85rem;font-weight:600;color:var(--muted)}
.tog.on{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.pill{display:inline-block;padding:4px 10px;border-radius:var(--rs);background:var(--panel2);font-size:.85rem;font-weight:600}
/* Sitzplan */
.room{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow:auto}
.board{text-align:center;padding:8px;border-radius:var(--rs);background:#2b2b2b;color:#fff;font-weight:600;font-size:.85rem;letter-spacing:.05em}
.seats{display:grid;gap:10px}
.seat{border:1.5px dashed var(--line);background:var(--panel2);border-radius:var(--rs);min-height:64px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;font-size:.9rem;line-height:1.15;overflow:hidden}
.seat.full{border-style:solid;background:var(--panel);border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.seat small{color:var(--muted);font-size:.75rem}
.seat.sel{outline:3px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.seat:empty:after{content:"+";color:var(--line);font-size:1.3rem}
.cell{position:relative;aspect-ratio:1/1;min-width:0}
.cell>.seat{position:absolute;inset:0;min-height:0;padding:3px;gap:1px}
.cell .seat b{font-size:clamp(.74rem,1.15vw,.95rem);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .seat small{font-size:.68rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .seat .bd{margin-top:2px;gap:2px}.cell .mk{font-size:.6rem;padding:0 4px}
.seat.empty{cursor:default;background:transparent}
.seat.desk{border-style:solid;border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
.seat.desk:not(.full){background:color-mix(in srgb,var(--warn-soft) 55%,var(--panel))}
.seat.jr{right:-5px;border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:dashed}
.seat.jl{left:-5px;border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:transparent}
.seat.jd{bottom:-5px;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-style:dashed}
.seat.ju{top:-5px;border-top-left-radius:0;border-top-right-radius:0;border-top-color:transparent}
.cell.gap .gapbtn{border:1.5px dotted var(--line);background:transparent;color:var(--muted);font-size:.75rem}
.seats{gap:10px}
.seats.lesson div.seat:empty:after{content:""}
.seat.absent{opacity:.5;background:var(--panel2);border-style:dashed}
.seat .bd{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.mk{font-size:.68rem;font-weight:700;padding:1px 5px;border-radius:var(--rs);background:var(--panel2);color:var(--muted);white-space:nowrap}
.mk.set{color:var(--ink)}
.mk.bad{background:var(--danger-soft);color:var(--danger)}
.mk.late{background:var(--warn-soft);color:var(--warn)}
.segm{display:inline-flex;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.segm button{border:0;background:var(--panel);padding:8px 14px;cursor:pointer;font-weight:600;min-height:38px}
.segm button.on{background:var(--accent);color:var(--accent-ink)}
.lstat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--rs);margin-bottom:12px;font-size:.9rem;background:var(--panel2)}
.lstat.ok{background:var(--accent-soft);color:var(--accent)}.lstat.warn{background:#fff3e0;color:#8a4b00}
.psec{margin-bottom:14px}
.psec h4{margin:0 0 6px;font-size:.82rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{min-width:48px;min-height:48px;border:1px solid var(--line);background:var(--panel);border-radius:var(--rs);font-weight:700;font-size:1rem;cursor:pointer;padding:0 12px}

.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}

.featlist{display:flex;flex-direction:column}

.featrow:last-child{border-bottom:0}.featrow input{width:20px!important;height:20px;flex:none;margin:0;accent-color:var(--accent)}
.featrow span{display:flex;flex-direction:column}.featrow small{color:var(--muted);font-size:.82rem}

/* ===================== Modernes Design (ab 2026-10-16a) =====================
   Abgerundete Ecken, weiche Schatten, Pillen-Navigation, Segment-Reiter, Systemschrift (SF Pro auf Mac/iPad – keine Google-Schrift mehr).
   Einstellungen → Allgemein → „Stil“: Klassisch (eckig) setzt nur Radien/Schatten zurück (data-look="classic"). */
:root{--bg:#f4f4f6;--panel:#fff;--panel2:#f2f3f5;--line:#e3e4e8;--ink:#16171a;--muted:#6b6e76;
  --btn:#eef0f3;--btn-h:#e3e6ea;--seg-on:#fff;--r:16px;--rs:10px;--rl:22px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 10px rgba(16,24,40,.05);--shadow-h:0 2px 4px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.09);--shadow-lg:0 18px 50px rgba(16,24,40,.22);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0f;--panel:#1a1a1d;--panel2:#252529;--line:#2f2f35;--btn:#2a2a2f;--btn-h:#35353b;--seg-on:#3a3a41;
  --shadow:0 1px 2px rgba(0,0,0,.5);--shadow-h:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 18px 50px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0d0d0f;--panel:#1a1a1d;--panel2:#252529;--line:#2f2f35;--btn:#2a2a2f;--btn-h:#35353b;--seg-on:#3a3a41;
  --shadow:0 1px 2px rgba(0,0,0,.5);--shadow-h:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 18px 50px rgba(0,0,0,.6)}
:root[data-look="classic"]{--r:2px;--rs:2px;--rl:2px;--shadow:none;--shadow-h:none}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1{font-weight:700;letter-spacing:-.022em}h2{font-weight:650;letter-spacing:-.015em}h3{font-weight:650;letter-spacing:-.01em}
/* Kopfzeile & Navigation */
aside{border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02);gap:14px}
.brand{text-transform:none;letter-spacing:-.015em;font-weight:700;font-size:1.18rem}
.brand .logo{border-radius:11px;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
#navlist{gap:2px;align-items:center}
.nav{border:0!important;border-radius:999px;min-height:38px;margin:9px 0;padding:0 14px;color:var(--muted);font-weight:550;transition:background .15s,color .15s,box-shadow .15s}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.active{background:var(--accent);color:#fff!important;font-weight:650;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 32%,transparent)}
.topbar{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}
.topbar h1{font-weight:700;font-size:1.3rem}
#stat,#mini,.privbtn{border-radius:999px}
.privbtn{background:var(--btn);border-color:transparent;padding:7px 13px}
.privbtn:hover{background:var(--btn-h)}.privbtn.on{background:var(--accent);color:#fff}
@media (max-width:700px){
  #navlist{padding:8px;gap:2px;border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow-lg)}
  .nav{margin:0;min-height:46px;border-radius:var(--rs);padding:0 16px}
}
/* Schaltflächen */
.btn{border:1px solid transparent;background:var(--btn);border-radius:var(--rs);font-weight:600;transition:background .15s,box-shadow .15s,transform .08s,color .15s}
.btn:hover{background:var(--btn-h);border-color:transparent}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px color-mix(in srgb,var(--accent) 26%,transparent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000);filter:none}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 18%,var(--panel))}
.btn.ghost{background:transparent}.btn.ghost:hover{background:var(--panel2)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.lg{border-radius:calc(var(--rs) + 3px)}
.icon{border-radius:var(--rs)}
.chip,.kachip,.tchip,.pill,.ppill,.tag,.sptag{border-radius:999px}
.chip{background:var(--btn);border-color:transparent;transition:background .15s}
.chip:hover{background:var(--btn-h)}
.chip.on{background:var(--sel);color:var(--sel-ink);border-color:transparent}
.tchip{border-radius:var(--rs)}
/* Eingabefelder */
.sel,select,input,textarea{border-radius:var(--rs);border-color:var(--line);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.gin,.pin,.sg,.sp,.tname,.tmax,.time,.ttc,table.list input,.tsc input,.lav,.spv{border-radius:8px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
/* Karten & Flächen */
.card{border-radius:var(--r);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 75%,transparent)}
.card.exam{transition:box-shadow .15s,transform .15s}.card.exam:hover{box-shadow:var(--shadow-h);transform:translateY(-1px)}
.banner,.room,.pstrip:not(.compact),.setnav,.team,.swbox,.syncbox,.lstat,.stat,.group,.prow,.wcat,.wgh{border-radius:var(--r)}
.stat,.syncbox,.lstat,.group{border-radius:var(--rs)}
.stat .k,table.list th,.psec h4,.spcat,.tslot{text-transform:none;letter-spacing:0}
.stat .k{font-size:.8rem}
.team{overflow:hidden;box-shadow:var(--shadow)}
.setnav{overflow:hidden;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 75%,transparent)}
.setitem .si{border-radius:10px}
.setitem.on{box-shadow:none}
.badge{border-radius:7px}
.seat,.qr button,.qm button,.qh button,.qn,.mk,.tb,.cbx,.skb,.tc,.tscore button,.tf,.evc,.tte,.mday .dn,.pseg,.pbar,.wchip,.wtag,.bon,.code,.spbtns button,.task .x{border-radius:6px}
.seat{border-radius:10px}
.pick button,.spqgrid button,.ladb,.lamode,.swlane,.auslap,.sptile{border-radius:12px}
.spqgrid button{transition:transform .08s}.spqgrid button:active{transform:scale(.95)}
.sptile{border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.sptile:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:#ea8a2e;background:var(--panel)}
.spti{font-size:2.3rem}
.board{border-radius:8px}
.mgrid{border-radius:var(--rs);overflow:hidden}
/* Segmente & Reiter */
.segm,.seg{border:0;background:var(--panel2);padding:3px;gap:3px;border-radius:calc(var(--rs) + 2px)}
.segm button,.seg button{border:0!important;border-radius:var(--rs);background:transparent;transition:background .15s}
.segm button:hover:not(.on),.seg button:hover:not(.on){background:var(--btn-h)}
.segm button.on{background:var(--sel);color:var(--sel-ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button.on{box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs{border-bottom:0;background:var(--panel2);padding:4px;gap:2px;border-radius:calc(var(--rs) + 4px);width:fit-content;max-width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0!important;border-radius:var(--rs);padding:8px 16px;margin:0;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Tabellen */
table.list th{font-size:.82rem}
.tblwrap{border-radius:var(--rs)}
/* Fenster & Hinweise */
#modal{background:rgba(12,14,18,.38);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.mbox{border-radius:var(--rl);box-shadow:var(--shadow-lg);overflow:hidden}
.mhead{padding:18px 20px 6px}.mbody{padding:10px 20px}.mfoot{padding:14px 20px 18px}
#modal.open .mbox{animation:mpop .18s ease-out}
@keyframes mpop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
#toast{border-radius:999px;box-shadow:var(--shadow-lg);padding:11px 20px}
fieldset{border-radius:var(--rs)}
@media print{.card,.room,.team,.setnav{box-shadow:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Neue Bausteine 2026-10-16a ===== */
.mhide{display:none!important}
.mpref{margin:8px 0 6px;display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px}

.mrep{margin:6px 0 10px;padding-left:20px}.mrep li{margin:3px 0}
details>summary{user-select:none}
/* Notenskala */

.schart{width:100%;max-width:620px;height:auto;display:block;margin:4px 0 12px;background:var(--panel2);border-radius:var(--rs)}
.schart .gl{stroke:var(--line);stroke-width:1}
.schart .ax{fill:var(--muted);font-size:12px;font-family:var(--font)}
.schart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.schart .ln.dash{stroke:var(--muted);stroke-dasharray:4 5;stroke-width:1.5}
.schart .pt circle:not(.hit){fill:var(--panel);stroke:var(--accent);stroke-width:2}

.sp[readonly]{background:var(--panel2);color:var(--muted)}
.pinb{border:0;background:none;cursor:pointer;font-size:1.05rem;color:var(--muted);width:30px;height:30px;border-radius:8px}
.pinb:hover{background:var(--panel2)}.pinb.on,.pinon{color:var(--accent)}.pinon{display:inline-block;width:30px;text-align:center;font-size:1.05rem}
/* Sport-Benotung: heute schon bewertet */
.sprepl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:var(--rs);margin:0 0 12px;font-size:.92rem}
.sprepl .btn{margin-left:auto}
/* Uhr / Stoppuhr / Timer */
.cklay{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.cklay .card{margin:0}
.ckcard{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.ckc{align-items:center;text-align:center}
.ckh{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--muted);font-size:.85rem;letter-spacing:.02em}

@media (min-width:1000px){.cklay{grid-template-columns:minmax(320px,1fr) 1.7fr}.ckcol{grid-column:auto;grid-template-columns:1fr}.cktimer{grid-column:auto}}
.ckbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.cklaps small{font-size:.8em}
.cktset{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.ckdur{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ckdur b{min-width:2ch;text-align:center;font-size:1.25rem;font-variant-numeric:tabular-nums}.ckdur .btn{min-width:40px;padding:6px 0}.ckdur>.muted{margin-right:4px}
.ckpre{gap:6px}.ckpre .chip{padding:6px 12px}
.cktimer #ckprog{height:100%;background:var(--accent);transition:width .1s linear}

.cktimer.warn .ckhuge{animation:blink 1s infinite}

.cktimer:fullscreen{justify-content:center;padding:4vw;border-radius:0}.cktimer:fullscreen .ckhuge{font-size:28vw}
.cktimer:-webkit-full-screen{justify-content:center;padding:4vw;width:100%;height:100%;border-radius:0}.cktimer:-webkit-full-screen .ckhuge{font-size:28vw}
#ckmini{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:150;border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-lg);cursor:pointer}
#ckmini.pause{background:var(--good)}#ckmini small{opacity:.85;font-weight:600;margin-left:4px}
/* Ranking (16b) */
.rkset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 16px 12px;font-size:.9rem;color:var(--muted)}.rkset select{min-height:36px;padding:4px 8px}
.rklist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}

.rkeq,.rkeq0{width:34px;height:34px;flex:none}.rkeq{border:1px dashed var(--line);background:transparent;border-radius:8px;cursor:pointer;font-weight:800;color:var(--muted)}

.rkg{border:0;background:none;cursor:pointer;padding:2px}.rkg .badge{font-size:1rem;min-width:3em;padding:4px 8px}.rkg.ovr .badge{outline:2px solid var(--accent);outline-offset:1px}

.rkrest{padding:12px 16px;border-top:1px solid var(--line);background:var(--panel2)}.rkrh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.rkrh .btn{margin-left:auto}
.rkchips{display:flex;flex-wrap:wrap;gap:6px}.rkchips .chip{background:var(--panel)}

.skbs{gap:0}.skb{width:40px;height:40px;border:0!important;background:none!important;font-size:1.7rem;line-height:1;color:color-mix(in srgb,var(--muted) 35%,transparent);padding:0;transition:transform .08s,color .1s}
.skb.on{color:#f2b100;font-weight:400}.skb:active{transform:scale(.85)}.skb:hover{color:#f6c94c}
/* ===== Notentabelle-Ansicht & Turnen-Kür (ab 2026-10-16d) ===== */

/* ================= Grundlagen ================= */
const KEY='lehrerpult.v1';

/* Standard-Gewichtung: schriftlich : mündlich = 2 : 1 – im Sport Praxis : schriftlich = 2 : 1 */
function defW(c){return isSport(c)?{s:1,m:0,o:0,p:2}:{s:2,m:1,o:0,p:0}}
function fmtW(v){return String(+v||0).replace('.',',')}
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
const WHOLE_SCHEME=[{g:'1',min:92},{g:'2',min:81},{g:'3',min:67},{g:'4',min:50},{g:'5',min:30},{g:'6',min:0}];
const DEF_MIT=null,DEF_VER=null; /* Noten nur durch aktives Anklicken */
/* Viertelnoten: 1, 1-, 1-2, 2+, 2, 2-, 2-3, 3+ … 6 */
function qLabel(v){const n=Math.floor(v+1e-9),f=Math.round((v-n)*4);if(f===0)return String(n);if(f===1)return n+'-';if(f===2)return n+'-'+(n+1);return(n+1)+'+'}
function quarterScheme(whole){
  const t={};whole.forEach(r=>{const g=parseFloat(String(r.g).replace(',','.'));if(Number.isInteger(g))t[g]=+r.min});
  WHOLE_SCHEME.forEach(r=>{if(t[+r.g]==null)t[+r.g]=r.min});
  /* „Note g ab t %“ = bei t % gibt es gerade noch g- ; dazwischen gleichmäßig verteilt */
  const pts=[[0.875,100],[1.375,t[1]],[2.375,t[2]],[3.375,t[3]],[4.375,t[4]],[5.375,t[5]],[6.125,0]];
  const ip=x=>{for(let i=1;i<pts.length;i++){const[a,pa]=pts[i-1],[b,pb]=pts[i];if(x<=b)return pa+(pb-pa)*(x-a)/(b-a)}return 0};
  const out=[];let prev=101;
  for(let q=1;q<=6.001;q+=.25){let m=q>5.99?0:Math.round(ip(q+.125)*2)/2;if(m>=prev)m=prev-.5;if(m<0)m=0;out.push({g:qLabel(q),min:m});prev=m}
  return out;
}
const DEFAULT_SCHEME=quarterScheme(WHOLE_SCHEME);
/* Abitur BW (Bewertungstabelle ab 2024): Prozentgrenzen der 100-BE-Tabelle; bei 80/90/100/120 BE gelten die offiziellen Untergrenzen exakt */
const ABI_ROWS=[[15,95],[14,90],[13,85],[12,80],[11,75],[10,70],[9,65],[8,60],[7,55],[6,50],[5,45],[4,40],[3,33],[2,27],[1,20],[0,0]].map(([g,m])=>({g:String(g),min:m}));
const ABI_EXACT={80:[76,72,68,64,60,56,52,48,44,40,36,32,27,22,16,0],90:[86,81,77,72,68,63,59,54,50,45,41,36,30,24,18,0],100:[95,90,85,80,75,70,65,60,55,50,45,40,33,27,20,0],120:[114,108,102,96,90,84,78,72,66,60,54,48,40,32,24,0]};
const BUILTIN_SCHEMES=[{id:'b_q',name:'Viertelnoten 1–6 (Vorlage)',sys:'n',rows:DEFAULT_SCHEME},{id:'b_w',name:'Ganze Noten 1–6',sys:'n',rows:WHOLE_SCHEME},
  {id:'b_abi',name:'Abitur BW – Notenpunkte 0–15',sys:'p',rows:ABI_ROWS,exact:ABI_EXACT,info:'Bei 80, 90, 100 oder 120 Punkten gilt genau die offizielle Bewertungstabelle, bei anderen Höchstpunktzahlen wird prozentual umgerechnet.'}];
function allSchemes(){return[...BUILTIN_SCHEMES,...((typeof S!=='undefined'&&S.schemes)||[])]}

const PALETTE=['#2f7d68','#3b6ea8','#b0603d','#7a4fa3','#b08a1e','#2f8a9e','#a33b6e','#5b7a2a'];
const ICONS={help:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01',stage:'M3 4h18v12H3zM8 21h8M12 16v5',lock:'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z',

  file:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5',

function subsOf(c,t){return(c.subs||[]).filter(u=>u.t===t)}
function subOf(c,e){return e.sub?(c.subs||[]).find(u=>u.id===e.sub&&u.t===e.type)||null:null}
function averages(c,sid){
  const r={};let tot=0,ws=0;
  for(const t of['s','m','o','p']){let sum=0,w=0;const su={};
    for(const e of c.entries){if(e.type!==t)continue;const g=gParse(c,e.grades[sid]);if(g==null||isNaN(g))continue;const ew=e.weight===''||e.weight==null?1:+e.weight;if(!(ew>0))continue;
      const u=subOf(c,e);if(u){const x=su[u.id]=su[u.id]||[0,0];x[0]+=g*ew;x[1]+=ew}else{sum+=g*ew;w+=ew}}
    for(const u of subsOf(c,t)){const x=su[u.id],v=x&&x[1]?x[0]/x[1]:null,uw=u.w===''||u.w==null?1:+u.w;r['u_'+u.id]=v;if(v!=null&&uw>0){sum+=v*uw;w+=uw}}
    r[t]=w?sum/w:null;const tw=+c.weights[t]||0;if(r[t]!=null&&tw>0){tot+=r[t]*tw;ws+=tw}}
  r.all=ws?tot/ws:null;return r;
}
function mean(a){a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function colAvg(c,e){return mean(Object.values(e.grades).map(v=>gParse(c,v)))}
function classAvg(c,key='all'){return mean(c.students.map(s=>averages(c,s.id)[key]))}
function isAbsentToday(c,sid){const r=c.att[today()]?.[sid];return!!(r&&(r.s==='E'||r.s==='U'))}
function matchClassIn(st,txt){
  if(!txt)return null;const t=txt.toLowerCase().trim();
  const c=st.classes.filter(k=>{const n=k.name.toLowerCase().trim();return n&&t.startsWith(n)&&!/[a-z0-9äöüß]/.test(t.charAt(n.length))});
  if(!c.length)return null;c.sort((a,b)=>b.name.length-a.name.length);
  const top=c.filter(k=>k.name.length===c[0].name.length);
  if(top.length>1){const rest=t.slice(top[0].name.length);const hit=top.find(k=>k.subject&&rest.includes(k.subject.toLowerCase().slice(0,3)));if(hit)return hit}
  return top[0];
}

function subjOf(c){const L=S.settings.subjects||[],n=(c.subject||'').toLowerCase().trim();return L.find(x=>x.n.toLowerCase()===n)||L.find(x=>n&&x.k.toLowerCase()===n)||null}

function inkOn(hex){const h=String(hex||'#888').replace('#','');const n=h.length===3?h.split('').map(x=>x+x).join(''):h;const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);return(0.299*r+0.587*g+0.114*b)>160?'#1f2328':'#fff'}
function cstyle(c){const col=ccolor(c);return`background:${col};color:${inkOn(col)}`}

function ttLabel(c){const n=(c.name||'').trim(),sh=(cshort(c)||'').trim(),nl=n.toLowerCase(),sl=sh.toLowerCase();
  if(!sh||sl===nl)return n;if(sl.startsWith(nl+' ')||sl.startsWith(nl))return sh;
  if(c.subject&&nl.includes(c.subject.toLowerCase()))return n;return n+' '+sh}

/* Unterrichtsdaten (Sitzplan / Anwesenheit): c.att[datum][schüler] – nur Abweichungen vom Standard */
function rec(c,d,sid){const r=(c.att[d]||{})[sid]||{};return{s:r.s||'',ha:!!r.ha,mat:!!r.mat,q:r.q??null,mit:r.mit??null,ver:r.ver??null,note:r.note||''}}
/* Schnellbewertung: ++ (2), + (1), o (0), - (-1), -- (-2) */
const QV=[[2,'++','#1e8a3c'],[1,'+','#6cb33f'],[0,'o','var(--ink)'],[-1,'−','#f08a24'],[-2,'−−','#e3051a']];
function qSym(v){const x=QV.find(q=>q[0]===v);return x?x[1]:''}
function qCol(v){const x=QV.find(q=>q[0]===v);return x?x[2]:''}
function shortName(s){return(s.first||s.last||'?')+(s.first&&s.last?' '+s.last.trim()[0]+'.':'')}

function setRec(c,d,sid,k,v){
  c.att[d]=c.att[d]||{};const r=c.att[d][sid]||{};r[k]=v;
  if(!r.s)delete r.s;if(!r.ha)delete r.ha;if(!r.mat)delete r.mat;if(r.q==null)delete r.q;if(r.mit==null)delete r.mit;if(r.ver==null)delete r.ver;if(!r.note)delete r.note;
  if(Object.keys(r).length)c.att[d][sid]=r;else delete c.att[d][sid];
}
function lessonStats(c,sid,from,to){
  const o={n:0,mit:0,ver:0,mitN:0,verN:0,ha:0,mat:0,E:0,U:0,V:0,days:0,qc:{'2':0,'1':0,'0':0,'-1':0,'-2':0}};
  for(const d in c.att){if(from&&d<from)continue;if(to&&d>to)continue;o.days++;const r=rec(c,d,sid);
    if(isAbs(r)){o[r.s]++;continue}o.n++;if(r.q!=null){o.qc[r.q]++;o.mit+=3-r.q;o.mitN++}else if(r.mit!=null){o.mit+=r.mit;o.mitN++}if(r.ver!=null){o.ver+=r.ver;o.verN++}if(r.ha)o.ha++;if(r.mat)o.mat++;if(r.s==='V')o.V++}
  o.mitAvg=o.mitN?o.mit/o.mitN:null;o.verAvg=o.verN?o.ver/o.verN:null;return o;
}

function examMax(ex){return ex.tasks.reduce((a,t)=>a+(+t.max||0),0)}
function schemeGrade(sc,pct){const s=[...sc].sort((a,b)=>b.min-a.min);for(const r of s)if(pct>=r.min-1e-9)return r.g;return s.length?s[s.length-1].g:'?'}
function minPts(pct,max){return Math.ceil(pct*max/100*2-1e-9)/2}
function exSys(ex){return ex.sys==='p'?'p':'n'}
function exExact(ex,max){const X=ex.exact&&ex.exact[max];return X&&X.length===ex.scheme.length?X:null}
function examGrade(ex,sum,max){const rows=[...ex.scheme].sort((a,b)=>b.min-a.min),X=exExact(ex,max);
  if(X){for(let i=0;i<rows.length;i++)if(sum>=X[i]-1e-9)return rows[i].g;return rows[rows.length-1].g}
  return schemeGrade(ex.scheme,max?sum/max*100:0)}
function examResult(ex,sid){
  const p=ex.pts[sid];if(!p)return null;let sum=0,any=false;
  for(const t of ex.tasks){const v=p[t.id];if(v!==undefined&&v!==''&&!isNaN(+v)){sum+=+v;any=true}}
  if(!any)return null;const max=examMax(ex);const pct=max?sum/max*100:0;const g=examGrade(ex,sum,max);
  return{sum,pct,g,gn:sParse(exSys(ex),g)};
}

A.rg=(kind='basis')=>{

  let o=$('#tour');if(!o){o=document.createElement('div');o.id='tour';document.body.appendChild(o)}

function rgKey(e){if(!RG)return;const k=e.key;

function rgShow(){const T=RG;if(!T)return;let s=T.steps[T.i];

    <h3>${s.t}</h3><div class="tpb">${s.b}</div>

    ${last&&s.endInst?`<button class="btn" onclick="rgStop(false);A.goSet('help')">📲 Als App installieren</button>`:''}${last&&s.end==='sport'?`<button class="btn" onclick="rgStop(true);A.rg('sport')">🏃 Rundgang Sport</button>`:''}

function rgPlace(){const T=RG;if(!T)return;const o=$('#tour');if(!o)return;const s=T.steps[T.i];

  if(s.el&&(!T.el||!document.body.contains(T.el)||!tVis(T.el)))T.el=tFind(s.el);

  const vw=innerWidth,vh=innerHeight,pad=6,spot=o.querySelector('.tspot'),pop=o.querySelector('.tpop');
  let r=null;if(el){const q=el.getBoundingClientRect();r={l:Math.max(6,q.left-pad),t:Math.max(6,q.top-pad),r:Math.min(vw-6,q.right+pad),b:Math.min(vh-6,q.bottom+pad)};if(r.r-r.l<8||r.b-r.t<8)r=null}
  const key=r?[r.l,r.t,r.r,r.b].map(Math.round).join(','):'c'+vw+'x'+vh;if(key===T.key&&pop.offsetHeight)return;T.key=key;
  if(r)Object.assign(spot.style,{left:r.l+'px',top:r.t+'px',width:(r.r-r.l)+'px',height:(r.b-r.t)+'px',opacity:1});
  else Object.assign(spot.style,{left:vw/2+'px',top:vh/2+'px',width:'0px',height:'0px',opacity:1});
  o.classList.toggle('center',!r);
  const w=Math.min(380,vw-24);pop.style.width=w+'px';const h=pop.offsetHeight,g=12;let x,y;
  if(!r){x=(vw-w)/2;y=Math.max(12,(vh-h)/2)}
  else if(vw<600){x=12;y=(r.t+r.b)/2>vh/2?12:vh-h-12}

    if(r.b+g+h<=vh-8)y=r.b+g;else if(r.t-g-h>=8)y=r.t-g-h;
    else if(r.r+g+w<=vw-8){x=r.r+g;y=Math.min(Math.max(12,r.t),vh-h-12)}

    else{y=vh-h-12}}
  pop.style.left=Math.round(x)+'px';pop.style.top=Math.round(Math.max(8,y))+'px';
}

/* CSV-Import */
let CSVD=null;
function parseCSV(txt){
  const first=txt.split(/\r?\n/).find(l=>l.trim())||'';const cnt=ch=>first.split(ch).length-1;
  const del=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];const d=cnt(del)?del:';';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  row.push(cell);rows.push(row);
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}
A.csvImport=async input=>{
  const f=input.files[0];input.value='';if(!f)return;const buf=await f.arrayBuffer();let txt;
  try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1252').decode(buf)}
  const rows=parseCSV(txt.replace(/^﻿/,''));if(!rows.length)return toast('Die Datei ist leer');
  const h=rows[0].map(x=>x.toLowerCase());const header=h.some(x=>/name|klasse|schüler|schueler|lerngruppe|geschl/.test(x));
  const find=re=>header?h.findIndex(x=>re.test(x)):-1;
  let last=find(/nach|familien/),first=find(/vor|ruf/),cl=find(/klasse|lerngruppe|kurs/),gc=find(/geschl|gender|^m\/w|^w\/m|^sex/),full=-1;
  if(header&&last<0){const n=h.findIndex(x=>/^name$|schüler|schueler/.test(x));if(n>=0){if(first>=0)last=n;else full=n}}
  if(!header){const nc=Math.max(...rows.map(r=>r.length));if(nc>=2){last=0;first=1}else full=0}
  CSVD={rows,name:f.name,header,last,first,full,cl,gc,target:cls()?cls().id:'__new',newName:''};csvModal();
};
function csvPeople(){
  const D=CSVD,data=D.header?D.rows.slice(1):D.rows,out=[];
  data.forEach(r=>{let first='',last='';
    if(D.full>=0){const v=r[D.full]||'';if(v.includes(',')){const p=v.split(',');last=p[0].trim();first=p.slice(1).join(',').trim()}else{const p=v.trim().split(/\s+/);if(p.length>1)last=p.pop();first=p.join(' ')}}
    else{last=D.last>=0?r[D.last]||'':'';first=D.first>=0?r[D.first]||'':''}
    const k=D.cl>=0?(r[D.cl]||'').trim():'';const g=D.gc>=0?parseG(r[D.gc]):'';if(first||last)out.push({first,last,k,g})});
  return out;
}
function csvModal(){
  const D=CSVD,nc=Math.max(...D.rows.map(r=>r.length)),ex=D.header?D.rows[1]||[]:D.rows[0];
  const opts=sel=>`<option value="-1">–</option>`+Array.from({length:nc},(_,i)=>`<option value="${i}" ${sel===i?'selected':''}>${D.header?esc(D.rows[0][i]||'Spalte '+(i+1)):'Spalte '+(i+1)}${ex[i]?' (z. B. '+esc(ex[i].slice(0,18))+')':''}</option>`).join('');
  const ppl=csvPeople();
  const tgt=D.cl>=0?`<p class="hint">Die Schüler werden nach der Spalte „Klasse“ verteilt. Fehlende Klassen werden neu angelegt (Fach kannst du danach ergänzen).</p>`
    :`<label class="blk">In welche Klasse?<select onchange="CSVD.target=this.value;csvModal()">${S.classes.map(k=>`<option value="${k.id}" ${D.target===k.id?'selected':''}>${esc(k.name)}${k.subject?' · '+esc(k.subject):''}</option>`).join('')}<option value="__new" ${D.target==='__new'?'selected':''}>+ Neue Klasse anlegen</option></select></label>${D.target==='__new'?`<label class="blk">Name der neuen Klasse<input id="csvnew" value="${esc(D.newName)}" oninput="CSVD.newName=this.value" placeholder="z. B. 5a"></label>`:''}`;
  modal('CSV importieren: '+D.name,`<div class="form">
  <label class="chk"><input type="checkbox" ${D.header?'checked':''} onchange="CSVD.header=this.checked;csvModal()"> Erste Zeile enthält Überschriften</label>
  <div class="two"><label>Nachname<select onchange="CSVD.last=+this.value;CSVD.full=-1;csvModal()">${opts(D.full>=0?-1:D.last)}</select></label><label>Vorname<select onchange="CSVD.first=+this.value;CSVD.full=-1;csvModal()">${opts(D.full>=0?-1:D.first)}</select></label></div>
  <div class="two"><label>…oder Name in einer Spalte<select onchange="CSVD.full=+this.value;csvModal()">${opts(D.full)}</select></label><label>Klasse (optional)<select onchange="CSVD.cl=+this.value;csvModal()">${opts(D.cl)}</select></label></div>
  <div class="two"><label>Geschlecht (optional)<select onchange="CSVD.gc=+this.value;csvModal()">${opts(D.gc)}</select></label><p class="hint" style="align-self:end">Erkannt werden z. B. w / m / d, weiblich / männlich, Mädchen / Junge.</p></div>
  ${tgt}
  <div><div class="hint" style="margin-bottom:4px">Vorschau: ${ppl.length} Schüler erkannt</div><div class="tblwrap"><table class="prev"><thead><tr><th>Nachname</th><th>Vorname</th>${D.gc>=0?'<th>Geschl.</th>':''}${D.cl>=0?'<th>Klasse</th>':''}</tr></thead><tbody>${ppl.slice(0,6).map(p=>`<tr><td>${esc(p.last)}</td><td>${esc(p.first)}</td>${D.gc>=0?`<td>${p.g||'<span class="muted">?</span>'}</td>`:''}${D.cl>=0?`<td>${esc(p.k)}</td>`:''}</tr>`).join('')}${ppl.length>6?`<tr><td colspan="3" class="muted">… und ${ppl.length-6} weitere</td></tr>`:''}</tbody></table></div></div></div>`,
  [{label:'Abbrechen'},{label:`${ppl.length} importieren`,cls:'primary',fn:csvDo}],{nofocus:true});
}
function csvDo(){
  const D=CSVD,ppl=csvPeople();if(!ppl.length){toast('Keine Namen erkannt – bitte Spalten prüfen');return false}
  let created=0,added=0,dup=0,upd=0;const mk=name=>{const k=normClass({id:uid(),name,color:PALETTE[S.classes.length%PALETTE.length],gsys:isKS(name)?'p':'n'},S);S.classes.push(k);created++;return k};
  let fixed=null;
  if(D.cl<0){if(D.target==='__new'){const n=(D.newName||'').trim();if(!n){toast('Bitte einen Namen für die neue Klasse eingeben');return false}fixed=mk(n)}else fixed=S.classes.find(k=>k.id===D.target)}
  ppl.forEach(p=>{let k=fixed;
    if(!k){const nm=p.k||'Ohne Klasse';k=S.classes.find(x=>x.name.toLowerCase()===nm.toLowerCase()&&x.id===S.ui.cls)||S.classes.find(x=>x.name.toLowerCase()===nm.toLowerCase())||mk(nm)}
    const ex=k.students.find(s=>s.first.toLowerCase()===p.first.toLowerCase()&&s.last.toLowerCase()===p.last.toLowerCase());
    if(ex){if(p.g&&ex.g!==p.g){ex.g=p.g;upd++}else dup++;return}
    k.students.push({id:uid(),first:p.first,last:p.last,g:p.g||'',note:''});added++});
  if(fixed)S.ui.cls=fixed.id;else if(!cls())S.ui.cls=S.classes[0].id;
  save();render();toast(`${added} Schüler importiert${upd?`, bei ${upd} Geschlecht ergänzt`:''}${dup?`, ${dup} doppelte übersprungen`:''}${created?`, ${created} Klasse(n) angelegt`:''}`);
}

  sorted(c).forEach(s=>{const p=ex.pts[s.id]||{},r=examResult(ex,s.id);rows.push([s.last,s.first,...ex.tasks.map(t=>p[t.id]==null?'':fmtPts(+p[t.id])),r?fmtPts(r.sum):'',r?Math.round(r.pct):'',r?r.g:''])});
  csvOut(rows,`${ex.title}_${c.name}_${ex.date||today()}.csv`)};

/* ================= Anwesenheit ================= */
let LDATE=today();
function attCounts(c,sid){const o={E:0,U:0,V:0,ha:0,mat:0};Object.values(c.att).forEach(d=>{const r=d[sid];if(!r)return;if(r.s)o[r.s]++;if(r.ha&&!(r.s==='E'||r.s==='U'))o.ha++;if(r.mat&&!(r.s==='E'||r.s==='U'))o.mat++});return o}
function dateNav(){const wd=dateOf(LDATE).toLocaleDateString('de-DE',{weekday:'short'});
  return`<button class="btn" onclick="A.ldShift(-1)" aria-label="Vorheriger Tag">‹</button><input type="date" value="${LDATE}" onchange="A.ldDate(this.value)" aria-label="Datum"><button class="btn" onclick="A.ldShift(1)" aria-label="Nächster Tag">›</button><span class="muted">${wd}</span>${LDATE!==today()?`<button class="btn ghost" onclick="A.ldDate(today())">Heute</button>`:''}`}
function lessonStatus(c){
  const L=currentLesson(),now=L&&L.c.id===c.id&&LDATE===today()?`<b>${periodNo(L.i)}. Stunde</b> · `:'';
  if(c.att[LDATE])return`<div class="lstat ok"><span>${now}✓ Stunde vom ${fmtDate(LDATE)} erfasst – Hausaufgaben und Material zählen als vorhanden, solange nichts markiert ist.</span><button class="btn sm" onclick="A.lessonDel()">Stunde löschen</button></div>`;
  return`<div class="lstat"><span>${now}Stunde vom ${fmtDate(LDATE)} noch nicht erfasst – sie wird mit dem ersten Eintrag gespeichert.</span><button class="btn sm primary" onclick="A.lessonMark()">Stunde erfassen</button></div>`;
}
VIEWS.anw=()=>{
  const c=cls(),st=sorted(c);if(!st.length)return noStudents(c);
  const absent=st.filter(s=>isAbs(rec(c,LDATE,s.id))).length;
  let h=`<div class="toolbar">${dateNav()}<div class="spacer"></div><span class="pill">${st.length-absent} / ${st.length} anwesend</span><button class="btn" onclick="A.go('sitz')">Zum Sitzplan</button></div>${lessonStatus(c)}
  <section class="card">${st.map(s=>{const r=rec(c,LDATE,s.id),a=isAbs(r);const b=(k,l,t)=>`<button class="${k||'a'} ${r.s===k?'on':''}" title="${t}" onclick="A.lr('${s.id}','s','${k}')">${l}</button>`;
    return`<div class="attrow"><span class="nm">${esc(sname(s))}${r.note?` <span title="${esc(r.note)}">📝</span>`:''}</span><span class="seg">${b('','✓','anwesend')}${b('V','V','verspätet')}${b('E','E','fehlt entschuldigt')}${b('U','U','fehlt unentschuldigt')}</span>
    <label class="chk" title="Mitarbeit">M <select class="mini" ${a?'disabled':''} onchange="A.lr('${s.id}','mit',this.value?+this.value:null)"><option value="">–</option>${[1,2,3,4,5,6].map(g=>`<option ${r.mit===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <label class="chk" title="Verhalten">Vh <select class="mini" ${a?'disabled':''} onchange="A.lr('${s.id}','ver',this.value?+this.value:null)"><option value="">–</option>${[1,2,3,4].map(g=>`<option ${r.ver===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <button class="tog ${r.ha?'on':''}" ${a?'disabled':''} onclick="A.lr('${s.id}','ha',${!r.ha})" title="Hausaufgaben vergessen">HA</button><button class="tog ${r.mat?'on':''}" ${a?'disabled':''} onclick="A.lr('${s.id}','mat',${!r.mat})" title="Material vergessen">Mat.</button></div>`}).join('')}
  <p class="hint" style="margin-top:10px">✓ anwesend · V verspätet · E fehlt entschuldigt · U fehlt unentschuldigt · M Mitarbeit (1–6) · Vh Verhalten (1–4), jeweils nur wenn vergeben · HA / Mat. markiert = vergessen. Dieselben Daten bearbeitest du auch im Sitzplan.</p></section>`;
  const days=Object.keys(c.att).length;
  h+=`<section class="card"><div class="cardhead"><h3>Übersicht über alle Stunden</h3><span class="muted">${days} erfasste Stunde(n)</span></div><div class="tblwrap"><table class="list"><thead><tr><th>Name</th><th>Ø Mitarb.</th><th>Ø Verh.</th><th>E</th><th>U</th><th>V</th><th>HA</th><th>Mat.</th></tr></thead><tbody>${st.map(s=>{const a=lessonStats(c,s.id);const z=n=>n?`<b>${n}</b>`:'<span class="muted">0</span>';return`<tr><td>${esc(sname(s))}</td><td>${num(a.mitAvg)}</td><td>${num(a.verAvg)}</td><td>${z(a.E)}</td><td>${a.U?`<b style="color:var(--danger)">${a.U}</b>`:z(0)}</td><td>${z(a.V)}</td><td>${z(a.ha)}</td><td>${z(a.mat)}</td></tr>`}).join('')}</tbody></table></div></section>`;
  return h;
};
A.lr=(sid,key,val,panel)=>{const c=cls();setRec(c,LDATE,sid,key,val);save();render();if(panel)seatPanel(sid)};
A.ldDate=v=>{if(v){LDATE=v;autoRoom(cls(),v);render()}};
A.ldShift=n=>{const d=dateOf(LDATE);do{d.setDate(d.getDate()+n)}while(d.getDay()===0||d.getDay()===6);LDATE=iso(d);autoRoom(cls(),LDATE);render()};
A.lessonMark=()=>{const c=cls();c.att[LDATE]=c.att[LDATE]||{};save();render();toast('Stunde mit Standardwerten erfasst')};
A.lessonDel=()=>{const c=cls();confirmBox(`Alle Einträge der Stunde vom ${fmtDate(LDATE)} löschen?`,()=>{delete c.att[LDATE];save();render()})};

/* ================= Sitzplan ================= */
let SEL=null,SEATMODE='lesson',ETOOL='place',TSEL=null,NEWT='h2',SMORE=false;
function tSq(t){return t.n===1?[[t.r,t.c]]:t.o==='h'?[[t.r,t.c],[t.r,t.c+1]]:[[t.r,t.c],[t.r+1,t.c]]}
function tMap(sp){const m={};sp.tables.forEach(t=>tSq(t).forEach(([r,c],i)=>m[r+'-'+c]={t,i}));return m}
function tFits(sp,t,ignore){const m=tMap(sp);return tSq(t).every(([r,c])=>r>=0&&c>=0&&r<sp.rows&&c<sp.cols&&(!m[r+'-'+c]||m[r+'-'+c].t.id===ignore))}
function cleanSeats(c){const sp=c.seating,ids=new Set(c.students.map(s=>s.id));sp.tables=sp.tables.filter(t=>tSq(t).every(([r,cc])=>r<sp.rows&&cc<sp.cols));const m=tMap(sp);
  for(const k in sp.seats)if(!m[k]||!ids.has(sp.seats[k]))delete sp.seats[k]}
function dispRows(sp){const rows=[...Array(sp.rows).keys()];if(!sp.boardTop)rows.reverse();return rows}
function seatKeysOrdered(sp){const out=[],m=tMap(sp);dispRows(sp).forEach(r=>{for(let k=0;k<sp.cols;k++)if(m[r+'-'+k])out.push(r+'-'+k)});return out}
function seatOrder(c){const sp=c.seating,seen=new Set(),o=[];seatKeysOrdered(sp).forEach(k=>{const id=sp.seats[k];if(id&&!seen.has(id)){seen.add(id);o.push(id)}});sorted(c).forEach(s=>{if(!seen.has(s.id))o.push(s.id)});return o}
function joinCls(sp,t,i){if(t.n===1)return'';if(t.o==='h')return i===0?' jr':' jl';const upper=sp.boardTop?0:1;return i===upper?' jd':' ju'}
function lessonSide(c){
  const L=currentLesson(),now=L&&L.c.id===c.id&&LDATE===today()?`<b>${periodNo(L.i)}. Stunde</b>`:'';
  return c.att[LDATE]?`<div class="lstat ok sm">${now}<span>✓ Stunde erfasst</span><button class="btn sm" onclick="A.lessonDel()">löschen</button></div>`
    :`<div class="lstat sm">${now}<span>Noch nicht erfasst – wird mit dem ersten Eintrag gespeichert.</span><button class="btn sm primary" onclick="A.lessonMark()">Stunde erfassen</button></div>`;
}
/* Räume einer Lerngruppe: aus dem Stundenplan (häufigster zuerst), Raum der Lerngruppe und vorhandene Pläne */
function ttRooms(st,id){const n={};Object.values(st.timetable.cells||{}).forEach(l=>(l||[]).forEach(e=>{if(e.g===id&&normRoom(e.room))n[normRoom(e.room)]=(n[normRoom(e.room)]||0)+1}));return Object.keys(n).sort((a,b)=>n[b]-n[a])}
function classRooms(c){const L=[...ttRooms(S,c.id),normRoom(c.room),...Object.keys(c.seatings)].filter(Boolean);const out=[...new Set(L)];if(c.seatings['']&&(!out.length||c.seatRoom===''))out.unshift('');return out}
function roomLabel(r){return r?'Raum '+r:'Standardraum'}
function setRoom(c,r){r=normRoom(r);if(r===c.seatRoom)return;if(r&&!c.seatings[r]&&c.seatings['']&&Object.values(c.seatings[''].seats).length){c.seatings[r]=c.seatings[''];delete c.seatings['']}c.seatRoom=r;TSEL=null;SEL=null}
/* passenden Raum automatisch wählen: laufende Stunde, sonst die nächste/letzte Stunde dieser Lerngruppe am angezeigten Tag */
function autoRoom(c,date){if(!c)return;const d=date||LDATE||today(),L=d===today()&&currentLesson();if(L&&L.c.id===c.id&&normRoom(L.room))return setRoom(c,L.room);
  const ls=dayLessons(dateOf(d)).filter(l=>l.e.g===c.id&&normRoom(l.e.room));if(!ls.length)return;
  const n=new Date(),m=n.getHours()*60+n.getMinutes();const nx=d===today()?(ls.find(l=>parseTime(l.e2)>m)||ls[ls.length-1]):ls[0];setRoom(c,nx.e.room)}
function roomPicker(c,edit){const R=classRooms(c);if(R.length<2&&!edit)return'';
  const used=k=>c.seatings[k]&&Object.values(c.seatings[k].seats).length;
  return`<label class="blk roompick">Raum<select class="sel" onchange="A.seatRoom(this.value)">${R.map(r=>`<option value="${esc(r)}" ${r===c.seatRoom?'selected':''}>${esc(roomLabel(r))}${used(r)?'':' – noch kein Plan'}</option>`).join('')}<option value="__new">+ anderer Raum …</option></select></label>`}
A.seatRoom=v=>{const c=cls();if(v==='__new'){modal('Weiterer Raum',`<label class="blk">Raumnummer oder -name<input id="nroom" placeholder="z. B. 204 oder Bio-Saal"></label>`,[{label:'Abbrechen',fn:()=>render()},{label:'Anlegen',cls:'primary',fn:()=>{const r=normRoom($('#nroom').value);if(!r){toast('Bitte einen Raum eingeben');return false}setRoom(c,r);c.seating;SEATMODE='edit';save();render();toast(`${roomLabel(r)}: Tische anordnen und Schüler setzen`)}}]);return}
  setRoom(c,v);persist();render()};
A.seatCopy=from=>{const c=cls(),src=c.seatings[from];if(!src)return;c.seatings[c.seatRoom]=clone(src);cleanSeats(c);save();render();toast(`Plan aus ${roomLabel(from)} übernommen – jetzt anpassen`)};
A.seatRoomDel=()=>{const c=cls(),r=c.seatRoom;confirmBox(`Sitzplan für ${roomLabel(r)} löschen?`,()=>{delete c.seatings[r];c.seatRoom=Object.keys(c.seatings)[0]||normRoom(c.room);save();render()})};
function roomExtras(c){const O=Object.keys(c.seatings).filter(k=>k!==c.seatRoom);if(!O.length)return'';
  return`<div class="roomx"><div class="hint">Anderer Raum, eigener Plan. Vorlage:</div>${O.map(k=>`<button class="btn sm" onclick="confirmBox('Tische und Plätze aus ${esc(roomLabel(k))} in ${esc(roomLabel(c.seatRoom))} übernehmen? Der bisherige Plan dieses Raums wird ersetzt.',()=>A.seatCopy('${esc(k)}'),'Übernehmen')">Aus ${esc(roomLabel(k))} übernehmen</button>`).join('')}<button class="btn sm ghost danger" onclick="A.seatRoomDel()">Plan für ${esc(roomLabel(c.seatRoom))} löschen</button></div>`}
function sitzPicker(c){
  const today=dayLessons(new Date()).filter(l=>l.e.g&&S.classes.some(k=>k.id===l.e.g)),seenT=new Set(),todayC=today.filter(l=>!seenT.has(l.e.g)&&seenT.add(l.e.g)).map(l=>({c:S.classes.find(k=>k.id===l.e.g),n:l.n0}));
  const curL=currentLesson();
  return `<div class="lgpick"><label class="blk">Lerngruppe wechseln<select class="sel" onchange="A.pickClass(this.value)" aria-label="Lerngruppe">${S.classes.map(k=>`<option value="${k.id}" ${k.id===c.id?'selected':''}>${esc(cname(k))}</option>`).join('')}</select></label>
    ${todayC.length?`<div class="hint" style="margin-top:6px">Heute:</div><div class="tchips">${todayC.map(t=>`<button class="tchip ${t.c.id===c.id?'on':''}" style="--cc:${ccolor(t.c)}" onclick="A.pickClass('${t.c.id}')" title="${esc(cname(t.c))}">${t.n}. ${esc(ttLabel(t.c))}</button>`).join('')}</div>`:''}
    ${curL&&curL.c.id!==c.id?`<button class="btn sm" style="margin-top:6px;width:100%" onclick="A.pickClass('${curL.c.id}')">↩ Zur aktuellen Stunde (${esc(ttLabel(curL.c))})</button>`:''}</div>`;
}
VIEWS.sitz=()=>{
  const c=cls(),st=sorted(c);
  if(isSport(c))return spListView(c);if(!st.length)return`<div class="sitzlay"><div class="spanel noprint">${sitzPicker(c)}</div><div class="sitzmain">${noStudents(c)}</div></div>`;
  const sp=c.seating;cleanSeats(c);const m=tMap(sp),placed=new Set(Object.values(sp.seats)),byId=Object.fromEntries(c.students.map(s=>[s.id,s]));
  const lesson=SEATMODE==='lesson';const focus=document.body.classList.contains('focus');
  let cells='';
  dispRows(sp).forEach(r=>{for(let k=0;k<sp.cols;k++){const key=r+'-'+k,hit=m[key];
    if(!hit){cells+=!lesson&&ETOOL==='tables'?`<div class="cell"><button class="seat floorbtn" onclick="A.floorTap(${r},${k})" aria-label="Freie Fläche"></button></div>`:'<div class="cell"></div>';continue}
    const jc=' desk'+joinCls(sp,hit.t,hit.i),s=byId[sp.seats[key]];
    if(lesson)cells+=`<div class="cell">${s?quickSeat(c,s,jc):`<div class="seat empty${jc}"></div>`}</div>`;
    else if(ETOOL==='tables')cells+=`<div class="cell"><button class="seat${jc} ${s?'full':''} ${TSEL===hit.t.id?'tsel':''}" onclick="A.tableTap('${hit.t.id}')">${s?`<b>${esc(shortName(s))}</b>`:''}</button></div>`;
    else cells+=`<div class="cell"><button class="seat${jc} ${s?'full':''} ${SEL&&SEL.seat===key?'sel':''}" onclick="A.seat('${key}')">${s?`<b>${esc(shortName(s))}</b>`:''}</button></div>`}});
  const board=`<div class="board">Tafel / Pult${c.seatRoom&&classRooms(c).length>1?' · '+esc(roomLabel(c.seatRoom)):''}</div>`;
  const room=`<div class="room" id="room">${lesson?lpFloat(c,sp.boardTop):''}${sp.boardTop?board:''}<div class="seats ${lesson?'lesson':''}" data-cols="${sp.cols}" data-rows="${sp.rows}" style="grid-template-columns:repeat(${sp.cols},minmax(0,1fr))">${cells}</div>${sp.boardTop?'':board}</div>`;
  const un=st.filter(s=>!placed.has(s.id));
  const picker=sitzPicker(c)+roomPicker(c,SEATMODE!=='lesson')+(SEATMODE==='lesson'&&S.ui.pHide?planMini(c):'');
  const mode=`<button class="btn primary" onclick="A.seatMode('lesson')" title="Zurück zur Unterrichtsansicht">✓ Fertig bearbeitet</button>`;
  let side;
  if(lesson){
    const absent=st.filter(s=>isAbs(rec(c,LDATE,s.id))).length;
    const more=focus?'':`<div class="smore ${SMORE?'open':''}"><button class="btn smorebtn" onclick="A.sMore()" aria-expanded="${SMORE}">⚙︎ Weitere Optionen <span>${SMORE?'▴':'▾'}</span></button>${SMORE?`<div class="smorebody">
        <button class="btn" onclick="SMORE=false;A.seatMode('edit')">✏️ Sitzplan bearbeiten</button>
        <button class="btn" onclick="window.print()">🖨 Drucken</button>
        <button class="btn" onclick="A.help()">❓ Hilfe</button>
        ${syncActive()?`<button class="btn sm ghost stat2" onclick="A.syncClick()">${esc($('#stat')?$('#stat').textContent:'')}</button>`:''}</div>`:''}</div>`;
    side=`${picker}<div class="dnav">${dateNav()}</div>${lpSide(c)}
      ${PRIV?'<div class="lstat"><span>🔒 Datenschutz-Modus: nur Namen sichtbar</span></div>':`<span class="pill">${st.length-absent} / ${st.length} anwesend</span>${lessonSide(c)}`}
      ${un.length?`<div class="sun"><div class="hint">${placed.size?'Ohne Sitzplatz':'Noch kein Sitzplan – Schüler'}:</div><div class="chips" style="margin:4px 0 0">${un.map(s=>{const r=rec(c,LDATE,s.id);return`<button class="chip" onclick="seatPanel('${s.id}')" ${isAbs(r)?'style="opacity:.5"':''}>${esc(shortName(s))}${r.q!=null?` <b style="color:${qCol(r.q)}">${qSym(r.q)}</b>`:''}</button>`}).join('')}</div></div>`:''}
      <div class="sbtns"><button class="btn ${PRIV?'primary':''}" onclick="A.privToggle()" title="Für Beamer / Bildschirm teilen: nur Namen anzeigen">${PRIV?'🔒 Datenschutz an':'🔓 Datenschutz'}</button><button class="btn ${focus?'primary':''}" onclick="A.focus()">${focus?'Vollbild beenden':'⛶ Vollbild'}</button></div>
      ${more}`;
  }else{
    const tsel=sp.tables.find(t=>t.id===TSEL);
    const tools=`<span class="segm full"><button class="${ETOOL==='place'?'on':''}" onclick="A.etool('place')">Schüler setzen</button><button class="${ETOOL==='tables'?'on':''}" onclick="A.etool('tables')">Tische</button></span>`;
    if(ETOOL==='place')side=`${picker}${mode}${tools}<p class="hint">Namen unten antippen, dann einen Platz. Zwei Plätze nacheinander antippen tauscht sie.</p>
      <button class="btn" onclick="A.seatRandom()">Zufällig verteilen</button><button class="btn" onclick="A.seatClear()">Alle entfernen</button>
      ${SEL&&SEL.seat&&sp.seats[SEL.seat]?`<button class="btn" onclick="A.unseat()">Vom Platz nehmen</button>`:''}
      ${roomExtras(c)}<div><div class="hint">Noch ohne Platz (${un.length}):</div>${un.length?`<div class="chips" style="margin:4px 0 0">${un.map(s=>`<button class="chip ${SEL&&SEL.stu===s.id?'on':''}" onclick="A.seatStu('${s.id}')">${esc(shortName(s))}</button>`).join('')}</div>`:'<p class="muted" style="margin:0">Alle haben einen Platz.</p>'}</div>`;
    else side=`${picker}${mode}${tools}
      ${tsel?`<div class="tbox"><b>Ausgewählter Tisch</b><div class="arrows"><span></span><button class="btn" onclick="A.tMove(-1,0)" aria-label="nach oben">↑</button><span></span><button class="btn" onclick="A.tMove(0,-1)" aria-label="nach links">←</button><button class="btn" onclick="A.tRot()" title="drehen">⟳</button><button class="btn" onclick="A.tMove(0,1)" aria-label="nach rechts">→</button><span></span><button class="btn" onclick="A.tMove(1,0)" aria-label="nach unten">↓</button><span></span></div>
        <button class="btn sm" onclick="A.tSize()">${tsel.n===2?'In Einzeltisch umwandeln':'In Zweiertisch umwandeln'}</button><button class="btn sm danger" onclick="A.tDel()">Tisch entfernen</button>
        <p class="hint">Oder eine freie Fläche antippen – der Tisch springt dorthin. Schüler wandern mit.</p></div>`
      :`<div><div class="hint">Neuer Tisch – dann freie Fläche antippen:</div><span class="segm full"><button class="${NEWT==='h2'?'on':''}" onclick="NEWT='h2';render()" title="Zweiertisch waagerecht">▭▭</button><button class="${NEWT==='v2'?'on':''}" onclick="NEWT='v2';render()" title="Zweiertisch senkrecht">▯</button><button class="${NEWT==='s1'?'on':''}" onclick="NEWT='s1';render()" title="Einzeltisch">□</button></span><p class="hint">Einen Tisch antippen, um ihn zu drehen, zu verschieben oder zu entfernen.</p></div>`}
      <div><div class="hint">Vorlagen:</div><div class="row"><button class="btn sm" onclick="A.tpl('rows')">Reihen</button><button class="btn sm" onclick="A.tpl('groups')">Gruppen</button><button class="btn sm" onclick="A.tpl('u')">U-Form</button><button class="btn sm" onclick="A.tpl('none')">Leeren</button></div></div>
      <div class="two"><label class="blk">Raum: Reihen<input type="number" class="num" min="2" max="14" value="${sp.rows}" onchange="A.seatDim('rows',this.value)"></label><label class="blk">Spalten<input type="number" class="num" min="2" max="16" value="${sp.cols}" onchange="A.seatDim('cols',this.value)"></label></div>
      <button class="btn" onclick="A.seatBoard()">Tafel ${sp.boardTop?'unten':'oben'} anzeigen</button>${roomExtras(c)}`;
  }
  return`<div class="sitzlay"><div class="spanel noprint">${side}</div><div class="sitzmain">${lesson?gfsAlertHtml(gfsAlerts(c)):''}${lesson&&!S.ui.pHide?planStrip(c,false,true):''}${placed.size||!lesson?room:`<div class="card empty"><h3>Noch kein Sitzplan</h3><p>Unter „Plätze &amp; Tische“ Tische anordnen und Schüler setzen. Bis dahin kannst du die Schüler links antippen.</p></div>`}</div></div>`;
};
/* Platz im Unterricht: oben ++ + o − −−, Mitte Name (→ Details), unten HA / Material */
function quickSeat(c,s,jc){
  if(PRIV)return`<div class="seat full${jc}"><b>${esc(shortName(s))}</b></div>`;
  const r=rec(c,LDATE,s.id),a=isAbs(r);
  const tags=`${r.s==='V'?'<span class="mk late">spät</span>':''}${r.ver!=null?`<span class="mk set ${verClass(r.ver)}">V ${r.ver}</span>`:''}${r.note?'<span class="mk">📝</span>':''}`;

  const A_=T.teams[a],B=T.teams[ti],ia=A_.ids.indexOf(SPSEL),ib=B.ids.indexOf(id);A_.ids[ia]=id;B.ids[ib]=SPSEL;
  [A_,B].forEach(t=>{if(t.cap&&!t.ids.includes(t.cap))t.cap=t.ids[0]});SPSEL=null;save();render()};
A.spMoveTo=ti=>{if(!SPSEL)return;const T=teamsOf(spCls());const a=T.teams.findIndex(t=>t.ids.includes(SPSEL));if(a<0||a===ti){SPSEL=null;return render()}
  T.teams[a].ids=T.teams[a].ids.filter(x=>x!==SPSEL);T.teams[ti].ids.push(SPSEL);if(T.teams[a].cap===SPSEL)T.teams[a].cap=T.teams[a].ids[0];SPSEL=null;save();render()};
A.spPlan=()=>{const T=teamsOf(spCls());const names=T.teams.map((t,i)=>t.c?'Team '+tcol(t.c)[1]+(T.teams.filter(x=>x.c===t.c).length>1?' '+(i+1):''):'Team '+(i+1));
  const n=names.length;if(n<2)return;const L=[...names];if(n%2)L.push(null);const m=L.length,rounds=[];
  for(let r=0;r<m-1;r++){const games=[];for(let i=0;i<m/2;i++){const a=L[i],b=L[m-1-i];if(a&&b)games.push(`${a} – ${b}`);else games.push(`${a||b} hat Pause`)}rounds.push(games);L.splice(1,0,L.pop())}
  modal('Spielplan (jeder gegen jeden)',`<ol>${rounds.map((g,i)=>`<li style="margin-bottom:8px"><b>Runde ${i+1}</b><br>${g.map(esc).join('<br>')}</li>`).join('')}</ol>`,[{label:'Drucken',fn:()=>{window.print();return false}},{label:'Schließen',cls:'primary'}]);
};
