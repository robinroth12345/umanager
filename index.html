/* ===== Sport: Turniere (ab 2026-10-10j) – Jeder gegen jeden, Schweizer System, Changing Teams =====
   c.tours=[{id,name,date,fmt:'rr'|'sw'|'ct',F(Felder),teams:[{n,ids}],games:[{id,r,slot,f,a,b,sa,sb}],byes:[{r,t}],players:[sid],nT,asg:{r:{sid:team}},tm:{dur,t0,acc,on}}]
   rr/sw: Sieg 3, Unentschieden 1, Niederlage 0 (Freilos = Sieg). ct: Teampunkte = eigene Tore + 5 (Sieg) / + 3 (Unentschieden); jeder Spieler bekommt die Punkte seines Teams. */
const TFMT={rr:'Jeder gegen jeden',sw:'Schweizer System',ct:'Changing Teams'};
function tourCur(c){S.ui.tour=S.ui.tour||{};return(c.tours||[]).find(t=>t.id===S.ui.tour[c.id])||null}
function tLetter(i){return String.fromCharCode(65+i)}
function tTeamName(t,i){return t.fmt==='ct'?'Team '+tLetter(i):(t.teams[i]||{}).n||'Team '+(i+1)}
function tSlots(pairs,F,r,start){return pairs.map((p,k)=>({id:uid(),r,slot:start+Math.floor(k/F),f:k%F+1,a:p[0],b:p[1],sa:null,sb:null}))}
function rrPairs(n){const L=[...Array(n).keys()];if(n%2)L.push(null);const m=L.length,R=[];for(let r=0;r<m-1;r++){const g=[];for(let i=0;i<m/2;i++){const a=L[i],b=L[m-1-i];g.push([a,b])}R.push(g);L.splice(1,0,L.pop())}return R}
function tPts(t,a,b){if(a==null||b==null)return null;return a>b?3:a===b?1:0}
function tTable(t){const n=t.teams.length,T=t.teams.map((x,i)=>({i,sp:0,s:0,u:0,nl:0,tg:0,tk:0,p:0}));
  t.games.forEach(g=>{if(g.sa==null||g.sb==null)return;const A=T[g.a],B=T[g.b];A.sp++;B.sp++;A.tg+=g.sa;A.tk+=g.sb;B.tg+=g.sb;B.tk+=g.sa;
    if(g.sa>g.sb){A.s++;B.nl++;A.p+=3}else if(g.sa<g.sb){B.s++;A.nl++;B.p+=3}else{A.u++;B.u++;A.p++;B.p++}});
  (t.byes||[]).forEach(y=>{const X=T[y.t];if(X&&!y.nb){X.p+=3;X.fl=(X.fl||0)+1}});
  return T.sort((x,y)=>y.p-x.p||(y.tg-y.tk)-(x.tg-x.tk)||y.tg-x.tg||x.i-y.i)}
/* Schweizer System: Teams mit ähnlicher Punktzahl, keine Wiederholung; ungerade Zahl → Freilos */
function swNext(t){const r=(t.games.reduce((a,g)=>Math.max(a,g.r),0))+1,tab=tTable(t),met=new Set(t.games.map(g=>g.a+'-'+g.b).concat(t.games.map(g=>g.b+'-'+g.a)));
  let order=tab.map(x=>x.i),bye=null;if(order.length%2){const had=new Set((t.byes||[]).map(y=>y.t));for(let k=order.length-1;k>=0;k--)if(!had.has(order[k])){bye=order[k];break}if(bye==null)bye=order[order.length-1];order=order.filter(i=>i!==bye)}
  const pair=(L)=>{if(!L.length)return[];const a=L[0];for(let k=1;k<L.length;k++){if(met.has(a+'-'+L[k]))continue;const rest=pair(L.filter((_,j)=>j&&j!==k));if(rest)return[[a,L[k]],...rest]}return null};
  const P=pair(order)||order.reduce((acc,x,k)=>k%2?acc:[...acc,[x,order[k+1]]],[]);
  const slot0=t.games.reduce((a,g)=>Math.max(a,g.slot+1),0);t.games.push(...tSlots(P,t.F,r,slot0));if(bye!=null)(t.byes=t.byes||[]).push({r,t:bye});return r}
/* Changing Teams: Spieler je Runde neu auf nT Teams mischen (Größen unterscheiden sich höchstens um 1) */
/* ab 2026-10-16a: t.ppt = Spieler pro Mannschaft (0 = feste Teamzahl nT), t.extra = 'mix' (Überzählige auf Teams verteilen) | 'out' (setzen reihum aus) */
function ctPlan(n,ppt,extra,nT){if(!ppt)return{nT,play:n,out:0};let T=extra==='out'?2*Math.floor(n/ppt/2):2*Math.round(n/ppt/2);T=Math.max(2,T);const play=extra==='out'?Math.min(n,T*ppt):n;return{nT:T,play,out:n-play}}
function ctPlanTxt(n,ppt,extra,nT){const p=ctPlan(n,ppt,extra,nT),lo=Math.floor(p.play/p.nT),hi=Math.ceil(p.play/p.nT);return`${p.nT} Teams à ${lo===hi?lo:lo+'–'+hi} Spieler${p.out?` · ${p.out} ${p.out===1?'setzt':'setzen'} je Runde aus (reihum)`:''}`}
function ctNext(t){const r=Object.keys(t.asg||{}).length+1;let P=shuffle([...t.players]);const A={};
  if(t.ppt){const pl=ctPlan(P.length,t.ppt,t.extra,t.nT);t.nT=pl.nT;
    if(pl.out){const cnt={};Object.values(t.outs||{}).forEach(L=>L.forEach(s=>cnt[s]=(cnt[s]||0)+1));P.sort((a,b)=>(cnt[b]||0)-(cnt[a]||0));const out=P.slice(pl.play);P=shuffle(P.slice(0,pl.play));(t.outs=t.outs||{})[r]=out}}
  P.forEach((sid,k)=>A[sid]=k%t.nT);(t.asg=t.asg||{})[r]=A;
  const pairs=[];for(let i=0;i+1<t.nT;i+=2)pairs.push([i,i+1]);const slot0=t.games.reduce((a,g)=>Math.max(a,g.slot+1),0);t.games.push(...tSlots(pairs,t.F,r,slot0));return r}
function ctTeamPts(g,side){const a=side?g.sb:g.sa,b=side?g.sa:g.sb;if(a==null||b==null)return null;return a+(a>b?5:a===b?3:0)}
function ctRank(c,t){const tot={};t.players.forEach(s=>tot[s]={s,p:0,n:0});t.games.forEach(g=>{const A=(t.asg||{})[g.r]||{};[0,1].forEach(side=>{const pts=ctTeamPts(g,side);if(pts==null)return;const team=side?g.b:g.a;for(const sid in A)if(A[sid]===team&&tot[sid]){tot[sid].p+=pts;tot[sid].n++}})});
  const L=Object.values(tot).sort((x,y)=>y.p-x.p);let rk=0,prev=null;L.forEach((x,k)=>{if(x.p!==prev){rk=k+1;prev=x.p}x.rk=rk});return L}
/* Timer mit lautem Signal */
let TOURIV=null;
function tTm(t){t.tm=t.tm||{dur:480,t0:null,acc:0,on:false};return t.tm}
function tLeft(t){const m=tTm(t);return m.dur*1000-((m.acc||0)+(m.on&&m.t0?Date.now()-m.t0:0))}
function tAlarm(){try{AUSAC=AUSAC||new(window.AudioContext||window.webkitAudioContext)();if(AUSAC.state==='suspended')AUSAC.resume();const t0=AUSAC.currentTime;
  for(let i=0;i<6;i++){const o=AUSAC.createOscillator(),v=AUSAC.createGain();o.type='square';o.frequency.setValueAtTime(i%2?660:990,t0+i*.5);o.connect(v);v.connect(AUSAC.destination);v.gain.setValueAtTime(.0001,t0+i*.5);v.gain.exponentialRampToValueAtTime(.9,t0+i*.5+.02);v.gain.setValueAtTime(.9,t0+i*.5+.4);v.gain.exponentialRampToValueAtTime(.0001,t0+i*.5+.48);o.start(t0+i*.5);o.stop(t0+i*.5+.5)}}catch(e){}if(navigator.vibrate)navigator.vibrate([400,150,400,150,400])}
function tTick(){const c=spCls(),t=c&&tourCur(c),el=$('#tclk');if(!t||!el||!tTm(t).on){clearInterval(TOURIV);TOURIV=null;return}const l=tLeft(t);el.textContent=mmss(Math.ceil(l/1000));
  if(l<=0){const m=tTm(t);m.on=false;m.t0=null;m.acc=m.dur*1000;persist();tAlarm();ausWake(false);el.textContent='0:00';el.classList.add('ring');const b=$('#tbox');if(b)b.classList.add('ring');setTimeout(()=>render(),2600)}}
function tTimerHtml(t){const m=tTm(t),l=tLeft(t),run=m.on;if(run&&!TOURIV)TOURIV=setInterval(tTick,250);
  return`<div id="tbox" class="tbox"><div><div id="tclk" class="ausclk down">${mmss(Math.ceil(Math.max(0,l)/1000))}</div><div class="muted aussub">Spielzeit ${mmss(m.dur)} min · am Ende lautes Signal</div></div>
   <div class="ausctl">${run?`<button class="btn lg" onclick="A.tTm('pause')">⏸ Pause</button>`:`<button class="btn primary lg" onclick="A.tTm('start')">▶ ${m.acc>0&&l>0?'Weiter':'Start'}</button>`}
   ${run?'':`<span class="row"><button class="btn" onclick="A.tTm('dur',-60)">−</button><b style="min-width:3.2em;text-align:center">${Math.round(m.dur/60)} min</b><button class="btn" onclick="A.tTm('dur',60)">+</button></span>`}
   ${m.acc>0||run?`<button class="btn ghost" onclick="A.tTm('reset')">Zurücksetzen</button>`:''}<button class="btn ghost" onclick="tAlarm()" title="Signal testen">🔔 Test</button></div></div>`}
A.tTm=(k,v)=>{const c=spCls(),t=tourCur(c),m=tTm(t);if(k==='start'){if(tLeft(t)<=0)m.acc=0;m.t0=Date.now();m.on=true;try{AUSAC=AUSAC||new(window.AudioContext||window.webkitAudioContext)();AUSAC.resume()}catch(e){}ausWake(true)}
  if(k==='pause'){m.acc=(m.acc||0)+(Date.now()-m.t0);m.on=false;m.t0=null;ausWake(false)}if(k==='reset'){m.acc=0;m.on=false;m.t0=null;ausWake(false)}if(k==='dur')m.dur=Math.max(60,Math.min(3600,m.dur+v));save();render()};
/* Ansichten */
function tourView(c,st){const t=tourCur(c);if(!t)return tourList(c);return tourOne(c,t)}
function tourList(c){const L=[...(c.tours||[])].reverse();
  return`<div class="toolbar"><button class="btn primary" onclick="A.tourNew()">+ Neues Turnier</button></div>
  ${L.length?`<div class="card flush"><div class="spgh"><h2 style="margin:0">Gespeicherte Turniere</h2><span class="muted">${L.length}</span></div><div class="spglist">${L.map(t=>{const n=t.games.filter(g=>g.sa!=null&&g.sb!=null).length;
    return`<button class="spgrow" onclick="A.tourGo('${t.id}')"><span class="spgname">${esc(t.name)}</span><span class="sptag">${TFMT[t.fmt]}</span><span class="muted" style="white-space:nowrap">${t.date?fmtShort(t.date)+' · ':''}${n} / ${t.games.length} Spiele</span><span class="spgadd">Öffnen ›</span></button>`}).join('')}</div></div>`
   :`<div class="card empty"><div style="font-size:2rem">🏆</div><h3>Noch kein Turnier</h3><p><b>Jeder gegen jeden</b> und <b>Schweizer System</b> nutzen die ausgelosten Mannschaften (oder eine Anzahl Teams). Bei <b>Changing Teams</b> werden die Spieler jede Runde neu gemischt und jeder sammelt Punkte für sich.</p></div>`}`}
function tGameRow(c,t,g){const nm=i=>t.fmt==='ct'?tTeamName(t,i):esc(tTeamName(t,i));const done=g.sa!=null&&g.sb!=null;
  const ctx=t.fmt==='ct'?((A)=>[g.a,g.b].map(team=>Object.keys(A).filter(s=>A[s]===team).map(s=>{const x=c.students.find(y=>y.id===s);return x?esc(shortName(x)):''}).filter(Boolean).join(', ')))((t.asg||{})[g.r]||{}):null;
  return`<div class="tgame ${done?'done':''}"><span class="tf">Feld ${g.f}</span><div class="tside"><b>${nm(g.a)}</b>${ctx?`<small>${ctx[0]}</small>`:''}</div>
   <span class="tsc"><input inputmode="numeric" value="${g.sa??''}" onchange="A.tScore('${g.id}',0,this.value)" aria-label="Tore ${nm(g.a)}"><span>:</span><input inputmode="numeric" value="${g.sb??''}" onchange="A.tScore('${g.id}',1,this.value)" aria-label="Tore ${nm(g.b)}"></span>
   <div class="tside r"><b>${nm(g.b)}</b>${ctx?`<small>${ctx[1]}</small>`:''}</div></div>`}
function tStandHtml(c,t){if(t.fmt==='ct'){const L=ctRank(c,t);return`<table class="list ttab"><thead><tr><th>#</th><th>Spieler</th><th>Spiele</th><th>Punkte</th></tr></thead><tbody>${L.map(x=>{const s=c.students.find(y=>y.id===x.s)||{};return`<tr><td>${x.rk}.</td><td>${esc(sname(s))}</td><td>${x.n}</td><td><b>${x.p}</b></td></tr>`}).join('')}</tbody></table><p class="hint">Teampunkte je Spiel: eigene Tore + 5 bei Sieg, + 3 bei Unentschieden. Jeder Spieler bekommt die Punkte seines Teams.</p>`}
  const T=tTable(t);return`<table class="list ttab"><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th>Diff</th><th>Pkt</th></tr></thead><tbody>${T.map((x,k)=>`<tr><td>${k+1}.</td><td>${esc(tTeamName(t,x.i))}${x.fl?' <small class="muted">('+x.fl+'× Freilos)</small>':''}</td><td>${x.sp}</td><td>${x.s}</td><td>${x.u}</td><td>${x.nl}</td><td>${x.tg}:${x.tk}</td><td>${x.tg-x.tk>0?'+':''}${x.tg-x.tk}</td><td><b>${x.p}</b></td></tr>`).join('')}</tbody></table><p class="hint">Sieg 3, Unentschieden 1, Niederlage 0 Punkte${t.fmt==='sw'?'; Freilos zählt als Sieg':''}. Bei Gleichstand entscheiden Tordifferenz, dann mehr Tore.</p>`}
function tourOne(c,t){const R=[...new Set(t.games.map(g=>g.r))].sort((a,b)=>a-b);
  let h=`<div class="toolbar"><button class="btn" onclick="A.tourGo(null)">‹ Turniere</button><div class="spacer"></div>${t.fmt==='sw'?`<button class="btn primary" onclick="A.tourNext()">+ Nächste Runde auslosen</button>`:t.fmt==='ct'?`<button class="btn primary" onclick="A.tourNext()">+ Nächste Runde mischen</button>`:''}<button class="btn" onclick="A.tourEdit()">Bearbeiten</button></div>
  <div class="card flush"><div class="spgh"><h2 style="margin:0">${esc(t.name)}</h2><span class="muted">${TFMT[t.fmt]} · ${t.F} ${t.F===1?'Spielfeld':'Spielfelder'} · ${t.fmt==='ct'?t.players.length+' Spieler, '+(t.ppt?t.nT+' Teams à '+t.ppt+(t.extra==='out'?'':' (±1)'):t.nT+' Teams'):t.teams.length+' Teams'}${t.date?' · '+fmtDate(t.date):''}</span></div>${tTimerHtml(t)}</div>
  <div class="tlay"><div>${R.length?R.map(r=>{const G=t.games.filter(g=>g.r===r),S=[...new Set(G.map(g=>g.slot))],by=(t.byes||[]).find(y=>y.r===r);
    return`<section class="card tround"><h3 style="margin:0 0 8px">Runde ${r}${S.length>1?` <small class="muted">(${S.length} Durchgänge – nicht genug Felder)</small>`:''}</h3>${S.map((sl,k)=>`${S.length>1?`<div class="tslot">Durchgang ${k+1}</div>`:''}${G.filter(g=>g.slot===sl).map(g=>tGameRow(c,t,g)).join('')}`).join('')}${by?`<p class="muted" style="margin:6px 0 0">${by.nb?'Spielfrei':'Freilos (zählt als Sieg)'}: ${esc(tTeamName(t,by.t))}</p>`:''}${t.outs&&t.outs[r]&&t.outs[r].length?`<p class="muted" style="margin:6px 0 0">Setzen aus: ${t.outs[r].map(s=>{const x=c.students.find(y=>y.id===s);return x?esc(shortName(x)):''}).filter(Boolean).join(', ')}</p>`:''}</section>`}).join(''):'<div class="card empty"><p>Noch keine Runde – oben „Nächste Runde“ antippen.</p></div>'}</div>
   <section class="card tstand"><h3 style="margin:0 0 8px">${t.fmt==='ct'?'Rangliste':'Tabelle'}</h3><div id="tstand">${tStandHtml(c,t)}</div></section></div>`;
  return h}

const CKKEY='lehrerpult.uhr';
let CK=(()=>{let o=null;try{o=JSON.parse(localStorage.getItem(CKKEY))}catch(e){}o=o&&typeof o==='object'?o:{};
  o.sw={on:false,t0:0,acc:0,laps:[],...(o.sw||{})};o.tm={dur:180,pause:0,loop:true,pre:false,on:false,t0:0,acc:0,ph:'p',rd:1,ring:false,...(o.tm||{})};return o})();
let CKIV=null,CKPRE=false;
function ckSave(){try{localStorage.setItem(CKKEY,JSON.stringify(CK))}catch(e){}}
function ckAudio(){try{AUSAC=AUSAC||new(window.AudioContext||window.webkitAudioContext)();if(AUSAC.state==='suspended')AUSAC.resume()}catch(e){}}
function ckBeep(n,f){try{ckAudio();const t0=AUSAC.currentTime;for(let i=0;i<(n||1);i++){const o=AUSAC.createOscillator(),v=AUSAC.createGain();o.type='square';o.frequency.value=f||880;o.connect(v);v.connect(AUSAC.destination);const s=t0+i*.28;v.gain.setValueAtTime(.0001,s);v.gain.exponentialRampToValueAtTime(.7,s+.02);v.gain.setValueAtTime(.7,s+.16);v.gain.exponentialRampToValueAtTime(.0001,s+.22);o.start(s);o.stop(s+.24)}}catch(e){}}
function ckPhaseDur(){const m=CK.tm;return(m.ph==='a'?m.pause:m.dur)*1000}
function ckLeft(){const m=CK.tm;return ckPhaseDur()-((m.acc||0)+(m.on&&m.t0?Date.now()-m.t0:0))}
function ckSwMs(){const w=CK.sw;return(w.acc||0)+(w.on&&w.t0?Date.now()-w.t0:0)}
function ckFmtSw(ms){const cs=Math.floor(ms/10),h=Math.floor(cs/360000),m=Math.floor(cs/6000)%60,s=Math.floor(cs/100)%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')+'<small>,'+String(cs%100).padStart(2,'0')+'</small>'}
function ckVisible(){return S.ui.view==='sport'&&S.ui.spTab==='uhr'}
function ckEnsure(){const need=CK.tm.on||CK.sw.on||ckVisible();if(need&&!CKIV)CKIV=setInterval(ckTick,100);if(!need&&CKIV){clearInterval(CKIV);CKIV=null}ckMini()}
function ckTick(){const m=CK.tm;
  if(m.on){let l=ckLeft();
    if(m.pre&&m.ph==='p'&&m.dur>15&&l<=10000&&l>0&&!CKPRE){CKPRE=true;ckBeep(1,1040)}
    if(l<=0){let alarm=false,start=false,guard=0;
      while(l<=0&&m.on&&guard++<500){const end=m.t0+(ckPhaseDur()-(m.acc||0));CKPRE=false;
        if(m.ph==='p'){alarm=true;if(!m.loop){m.on=false;m.t0=0;m.acc=ckPhaseDur();m.ring=true;break}
          if(m.pause>0){m.ph='a'}else{m.rd++}}
        else{m.ph='p';m.rd++;start=true}
        m.t0=end;m.acc=0;l=ckLeft()}
      if(alarm)tAlarm();else if(start)ckBeep(2,1180);
      ckSave();if(!m.on){ausWake(!!CK.sw.on);if(ckVisible())render();ckMini()}}}
  ckPaint();if(!(CK.tm.on||CK.sw.on||ckVisible())&&CKIV){clearInterval(CKIV);CKIV=null}}
function ckPaint(){const now=new Date(),q=id=>document.getElementById(id);
  const cl=q('ckclock');if(cl){cl.textContent=now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
  const sw=q('cksw');if(sw)sw.innerHTML=ckFmtSw(ckSwMs());
  const m=CK.tm,tm=q('cktm');if(tm){const l=ckLeft();tm.textContent=mmss(Math.ceil(Math.max(0,l)/1000));const box=q('cktbox');if(box){box.classList.toggle('pause',m.ph==='a');box.classList.toggle('ring',!!m.ring);box.classList.toggle('warn',m.on&&m.ph==='p'&&l<=10000)}
    const pr=q('ckprog');if(pr)pr.style.width=Math.max(0,Math.min(100,100*Math.max(0,l)/Math.max(1,ckPhaseDur())))+'%';
    const ph=q('ckph');if(ph)ph.textContent=m.ph==='a'?'Wechselpause':m.loop?'Runde '+m.rd:'Timer'}
  ckMini()}
function ckMini(){let b=document.getElementById('ckmini');const show=(CK.tm.on||CK.sw.on)&&!ckVisible();
  if(!show){if(b)b.style.display='none';return}

   <section class="card ckcard cktimer" id="cktbox"><div class="ckh"><span id="ckph">${m.ph==='a'?'Wechselpause':m.loop?'Runde '+m.rd:'Timer'}</span><button class="icon sm" onclick="A.ckFull()" title="Vollbild (für die Halle)">⛶</button></div>
    <div id="cktm" class="ckbig ckhuge">${mmss(Math.ceil(Math.max(0,l)/1000))}</div><div class="tbar"><div id="ckprog" style="width:${Math.max(0,Math.min(100,100*Math.max(0,l)/Math.max(1,ckPhaseDur())))}%"></div></div>
    <div class="ckbtns">${run?`<button class="btn lg" onclick="A.ckTm('pause')">⏸ Pause</button>`:`<button class="btn primary lg" onclick="A.ckTm('start')">▶ ${paused?'Weiter':'Start'}</button>`}${run||paused||m.ring||m.rd>1?`<button class="btn lg" onclick="A.ckTm('reset')">Zurücksetzen</button>`:''}${run&&m.loop?`<button class="btn lg ghost" onclick="A.ckTm('skip')" title="Aktuelle Runde sofort beenden">⏭</button>`:''}</div>
    ${run?`<p class="hint" style="text-align:center">${m.loop?`Dauerschleife: nach ${mmss(m.dur)} min Signal${m.pause?`, ${m.pause} s Wechselpause`:''}, dann startet die nächste Runde von selbst.`:'Am Ende ertönt ein lautes Signal.'}</p>`:`
    <div class="cktset"><div class="ckdur"><span class="muted">Dauer</span><button class="btn" onclick="A.ckTm('dur',-60)">−</button><b>${dm}</b><span>min</span><button class="btn" onclick="A.ckTm('dur',60)">+</button><button class="btn" onclick="A.ckTm('dur',-10)">−</button><b>${String(ds).padStart(2,'0')}</b><span>s</span><button class="btn" onclick="A.ckTm('dur',10)">+</button></div>
     <div class="row ckpre">${[1,2,3,4,5,8,10].map(x=>`<button class="chip ${m.dur===x*60?'on':''}" onclick="A.ckTm('set',${x*60})">${x} min</button>`).join('')}</div>
     <label class="chk"><input type="checkbox" ${m.loop?'checked':''} onchange="A.ckTm('loop',this.checked)"> <span><b>Dauerschleife</b> – nach dem Signal automatisch neu starten (z. B. Kaiserturnier)</span></label>
     ${m.loop?`<label class="chk">Wechselpause zwischen den Runden <select onchange="A.ckTm('pz',+this.value)">${[0,10,15,20,30,45,60,90,120].map(x=>`<option value="${x}" ${m.pause===x?'selected':''}>${x?x+' s':'keine'}</option>`).join('')}</select></label>`:''}
     <label class="chk"><input type="checkbox" ${m.pre?'checked':''} onchange="A.ckTm('pre',this.checked)"> Kurzer Vorwarnton 10 s vor Ende</label>
     <div class="row"><button class="btn sm ghost" onclick="tAlarm()">🔔 Signal testen</button><span class="hint" style="margin:0">Lautstärke am iPad hochdrehen. Der Bildschirm bleibt an, solange die Uhr läuft.</span></div></div>`}
   </section></div>`}
A.ckSw=k=>{const w=CK.sw;ckAudio();if(k==='start'){w.t0=Date.now();w.on=true;ausWake(true)}if(k==='stop'){w.acc=ckSwMs();w.on=false;w.t0=0;if(!CK.tm.on)ausWake(false)}
  if(k==='lap'){w.laps.push(ckSwMs())}if(k==='reset'){w.acc=0;w.on=false;w.t0=0;w.laps=[]}ckSave();render()};
A.ckTm=(k,v)=>{const m=CK.tm;
  if(k==='start'){ckAudio();if(m.ring||ckLeft()<=0){m.acc=0;m.ph='p';m.rd=1}m.ring=false;m.t0=Date.now();m.on=true;CKPRE=false;ausWake(true)}
  if(k==='pause'){m.acc=(m.acc||0)+(Date.now()-m.t0);m.on=false;m.t0=0;if(!CK.sw.on)ausWake(false)}
  if(k==='reset'){m.acc=0;m.on=false;m.t0=0;m.ph='p';m.rd=1;m.ring=false;CKPRE=false;if(!CK.sw.on)ausWake(false)}
  if(k==='skip'&&m.on){m.acc=ckPhaseDur();m.t0=Date.now();ckSave();ckTick();return render()}
  if(k==='dur'){m.dur=Math.max(10,Math.min(5940,m.dur+v));m.acc=0;m.ring=false}
  if(k==='set'){m.dur=v;m.acc=0;m.ring=false}
  if(k==='loop')m.loop=!!v;if(k==='pz')m.pause=v;if(k==='pre')m.pre=!!v;
  ckSave();render()};

function spCalc(g){const o={};for(const k in g.obs){const L=(g.obs[k]||[]).filter(x=>x&&x.q!=null);if(L.length){g.obs[k]=L;o[k]=mean(L.map(x=>x.q))}else delete g.obs[k]}g.grades=o}

   ${R.order.length?`<ol class="rklist" id="rklist">${R.order.map((sid,i)=>{const s=by[sid]||{},tie=i&&R.tie[sid],ov=R.fixed&&R.man[sid];return`<li class="rkrow ${tie?'tie':''}" data-sid="${sid}">

   ${rest.length?`<div class="rkrest"><div class="rkrh"><b>Noch nicht eingeordnet (${rest.length})</b> <span class="muted">– antippen = unten anhängen</span><button class="btn sm" onclick="A.rkAll()">Alle anhängen</button></div><div class="rkchips">${rest.map(s=>`<button class="chip" onclick="A.rkAdd('${s.id}')">${esc(sname(s))}</button>`).join('')}</div></div>`:''}
   <div class="rkfoot"><button class="btn" onclick="SPRANK=false;render()">Zurück zur Liste</button><span class="spacer"></span><button class="btn primary lg" onclick="A.rkApply()" ${R.order.length?'':'disabled'}>✓ Noten übernehmen (${R.order.length})</button></div></div>
  <p class="hint">${R.fixed?'Die Noten sind festgeschrieben: Änderst du eine Note, springt der Schüler an die passende Stelle – die anderen Noten bleiben, wie sie sind. Verschiebst du einen Schüler, passt sich nur seine eigene Note an (falls sie nicht mehr zwischen die Nachbarn passt). Mit „↺ Neu gleichmäßig verteilen“ beginnst du die Verteilung von vorn.':'Zu Beginn werden die Noten gleichmäßig entlang der Rangfolge verteilt – von der Note für die beste bis zur Note für die letzte Position. Sobald du eine Note antippst und änderst, werden alle Noten festgeschrieben.'} „=“ setzt einen Schüler gleich mit der Zeile darüber; mehrere „=“ untereinander bekommen alle die Note der ersten Zeile. „Noten übernehmen“ trägt sie in die Notenreihe ein; eine Note von heute wird dabei ersetzt.${R.applied?` Zuletzt übernommen am ${fmtShort(R.applied)}.`:''}</p>`}

A.rkTie=sid=>{const c=spCls(),g=spCur(c),R=rkOf(c,g),i=R.order.indexOf(sid);if(i<1)return;
  if(R.tie[sid])delete R.tie[sid];else{R.tie[sid]=1;if(R.fixed){const v=R.q[R.order[i-1]];rkBlock(R,i).forEach(x=>R.q[x]=v)}}save();render()};
A.rkStart=k=>{if(!k)return;const c=spCls(),g=spCur(c),R=rkOf(c,g),sys=gsys(c),L=sorted(c).filter(s=>!laBlock(g,s));
  const go=()=>{let A_=[...L];if(k==='sk')A_.sort((a,b)=>(b.sk||0)-(a.sk||0));if(k==='g')A_.sort((a,b)=>{const x=g.grades[a.id],y=g.grades[b.id];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return sys==='p'?y-x:x-y});

A.rkApply=()=>{const c=spCls(),g=spCur(c),R=rkOf(c,g),Q=rkCalc(c,g),t=today(),n=R.order.length;
  const replaced=R.order.filter(sid=>(g.obs[sid]||[]).some(x=>x.d===t)).length;

    R.applied=t;spCalc(g);spSave(c,g);SPRANK=false;SPSHOW=true;render();toast(`${n} Noten übernommen – stehen auch im Notenbuch`)},'Übernehmen')};

function rkDrag(ev,h){const li=h.closest('.rkrow'),ol=li&&li.parentNode;if(!ol)return;ev.preventDefault();li.classList.add('drag');
  const move=e=>{const y=e.clientY;const rows=[...ol.children].filter(x=>x!==li);let before=null;for(const r of rows){const b=r.getBoundingClientRect();if(y<b.top+b.height/2){before=r;break}}
    if(before!==li.nextSibling)ol.insertBefore(li,before);const b=ol.getBoundingClientRect();if(e.clientY<b.top+40)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-40)window.scrollBy(0,12)};
  const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);li.classList.remove('drag');
    const c=spCls(),g=spCur(c),R=rkOf(c,g),ord=[...ol.children].map(x=>x.dataset.sid);if(ord.join()!==R.order.join()){const old=[...R.order];R.order=ord;rkMoved(c,g,old,li.dataset.sid);save()}render()};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)}
function spGrades(c,st){

   ${laTabOk(g)?'<button class="btn latb" onclick="A.laShow()" title="Notentabelle zeigen (Jungen/Mädchen umschaltbar) – z. B. für die Schüler">📋 Notentabelle</button>':''}<button class="btn" onclick="A.spgFresh()" title="Weitere Bewertung derselben Sportart (neue Spalte im Notenbuch)">+ Neue Bewertung</button>${g&&!PRIV?`${tb?'':`<button class="btn ${SPRANK?'primary':''}" onclick="${SPRANK?'SPRANK=false;render()':'A.rkOpen()'}" title="Schüler nach Stärke ordnen und daraus Noten vergeben">🏅 Ranking</button>${SPRANK?'':`<button class="btn" onclick="SPSHOW=!SPSHOW;if(!SPSHOW)SPSORT=false;render()">${SPSHOW?'🙈 Noten verbergen':'👁 Noten anzeigen'}</button>`}`}${SPSHOW&&!tb&&!SPRANK?`<button class="btn ${SPSORT?'primary':''}" onclick="SPSORT=!SPSORT;render()">${SPSORT?'✓ Nach Note sortiert':'Nach Note sortieren'}</button>`:''}<button class="btn" onclick="A.spgEdit()">Bearbeiten</button>`:''}</div>
  <p class="hint nbauto">✓ Die Noten stehen automatisch im Notenbuch unter <b>Praxis</b> als Spalte „${esc(spAbbr(g.sport))}“${Object.values(g.obs).some(L=>L.length>1)?' (bei mehreren Noten der Durchschnitt, auf Viertelnoten gerundet – genau in der Mitte zugunsten des Schülers)':''}. <button class="btn sm ghost" onclick="S.ui.cls='${c.id}';A.go('noten')">Notenbuch öffnen</button></p>`;
  if(spIsKur(g))return h+turnView(c,st,g);

  if(SPRANK&&!PRIV)return h+rkView(c,st,g);
  const vals=st.map(s=>g.grades[s.id]).filter(v=>v!=null),avg=mean(vals),nObs=st.reduce((a,s)=>a+((g.obs[s.id]||[]).length),0);
  const SH=sid=>PRIV?!hid(sid):SPSHOW;
  let rows=[...st];if(SPSHOW&&SPSORT&&!PRIV)rows.sort((a,b)=>{const x=g.grades[a.id],y=g.grades[b.id];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return gsys(c)==='p'?y-x:x-y});
  const t0=today();
  h+=`<div class="card flush"><div class="spgh"><h2 style="margin:0">${esc(g.sport)}</h2><span class="muted">${g.date?fmtDate(g.date)+' · ':''}${vals.length} / ${st.length} bewertet · ${nObs} ${nObs===1?'Note':'Noten'}${SPSHOW&&!PRIV&&avg!=null?' · Ø '+num(avg):''}</span></div>${PRIV?privNote():''}

/* ===== Turnen: Kür nach Übungskatalog (ab 2026-10-16d) =====

  return{boden:L('bo',[['Strecksprung mit ganzer Drehung',2],['Kopfstand aus Hock- oder Grätschstand',2],['Aufschwingen in den Handstand',2],['Aufschwingen in den Handstand mit Abrollen',2.5],['Sprungrolle',2],['Rad (Handstützüberschlag seitwärts)',1.5],['Rad beidseitig',3.5],['Radwende',3],['Felgrolle',3],['Handstützüberschlag vorwärts/rückwärts',4],['Standwaage',1.5],['Drehsprung, Schersprung, Schrittsprung oder Pferdchensprung (nur einer)',1],['Salto vorwärts vom Reuterbrett',3],['Salto vorwärts',4]]),

    barren:L('ba',[['Sturzhangkippe',1.5],['Kippaufschwung (Lauf- oder Schwebekippe)',4],['Oberarmstemmaufschwung vorwärts in den Grätschsitz',1.5],['Oberarmstemmaufschwung vorwärts/rückwärts',3],['Oberarmrolle vorwärts',2],['Oberarmstand aus dem Sitz',3],['Oberarmstand aus dem Schwingen',3.5],['Oberarmkippe',3.5],['Oberarmkippe in den Grätschsitz',2],['3 ganze Schwünge (Rückschwung über die Horizontale)',2],['Kehre mit ½ Drehung',2],['Hohe Wende',1.5],['Wendekehre',2],['Drehhocke (Kreishocke)',3.5]]),

A.tuMove=(sid,i,d)=>{const X=tuCtx();if(!X)return;const L=tuKur(X.g,sid).items,j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];tuStore(X.c,X.g)};
A.tuRem=(sid,i)=>{const X=tuCtx();if(!X)return;tuKur(X.g,sid).items.splice(i,1);tuStore(X.c,X.g)};
A.tuClear=sid=>{const X=tuCtx();if(!X)return;confirmBox('Alle Elemente aus dieser Kür entfernen?',()=>{tuKur(X.g,sid).items=[];tuStore(X.c,X.g)},'Leeren')};
A.tuCopy=(sid,from)=>{const X=tuCtx();if(!X||!from)return;const{c,g}=X,s=c.students.find(x=>x.id===sid),sx=tuSex(s),cat=tuCfg().cat[g.tu.dev]||[],src=(g.kur[from]||{}).items||[];
  tuKur(g,sid).items=src.map(x=>{const e=x.src&&cat.find(y=>y.id===x.src);return{id:uid(),n:x.n,max:e?tuMax(e,sx):x.max,src:x.src||null,pts:null,part:x.part}});tuStore(c,g);toast('Kür übernommen – bei Bedarf anpassen')};
A.tuDone=sid=>{const X=tuCtx();if(!X)return;const k=tuKur(X.g,sid);if(!k.items.length)return;k.done=true;tuStore(X.c,X.g,false);render();window.scrollTo(0,0);setTimeout(()=>{const i=document.querySelector('.tuin');if(i&&!i.value)i.focus()},30)};
A.tuEdit=sid=>{const X=tuCtx();if(!X)return;tuKur(X.g,sid).done=false;tuStore(X.c,X.g)};
A.tuPts=(sid,i,el)=>{const X=tuCtx();if(!X)return;const{c,g}=X,k=tuKur(g,sid),x=k.items[i];if(!x)return;const raw=el.value.trim();
  if(raw==='')x.pts=null;else{const v=pnum(raw);if(isNaN(v)||v<0){toast('Bitte eine Zahl eingeben');el.value=tuN(x.pts);return}if(v>+x.max+1e-9){toast(`Höchstens ${tuN(x.max)} Punkte für dieses Element`);el.value=tuN(x.pts);return}x.pts=Math.round(v*100)/100}
  el.value=tuN(x.pts);tuStore(c,g,false);const f=document.getElementById('tusum');if(f)f.innerHTML=tuFoot(c,g,k)};
A.tuNext=el=>{const L=[...document.querySelectorAll('.tuin')],i=L.indexOf(el);if(i>=0&&L[i+1])L[i+1].focus()};

/* Einstellungen: Übungskatalog & Notenschlüssel (Unteransicht in Sport → Benotung) */
A.tuCfg=(tab,dev)=>{TUCFG=tab||'cat';if(dev)TUDEV=dev;else{const c=spCls(),g=c&&spCur(c);if(spIsKur(g))TUDEV=g.tu.dev}render();window.scrollTo(0,0)};
function tuCfgView(c){tuRecalcAll();const T=tuCfg(),dev=TU_DEV[TUDEV]?TUDEV:'boden',L=T.cat[dev]||[];
  let h=`<div class="toolbar"><button class="btn" onclick="TUCFG=null;render();window.scrollTo(0,0)">‹ Zurück</button><div class="segm" role="group" aria-label="Bereich">${[['cat','Übungskatalog'],['scheme','Notenschlüssel']].map(([k,t])=>`<button class="${TUCFG===k?'on':''}" onclick="A.tuCfg('${k}')">${t}</button>`).join('')}</div></div>`;
  if(TUCFG==='scheme'){const own=TULVL&&T.lvl&&T.lvl[TULVL];return h+`<div class="card"><h2 style="margin-top:0">Notenschlüssel Turnen (Kür)</h2><p class="muted">Ab welchem Anteil der Höchstpunktzahl gibt es welche Note? Der Übungskatalog gilt für alle Klassenstufen; den Notenschlüssel kannst du bei Bedarf je Klassenstufe anpassen (Klassenstufe aus dem Namen der Lerngruppe). Bereits vergebene Noten werden sofort neu berechnet.</p>
    <label class="blk" style="max-width:360px">Gilt für<select class="sel" onchange="TULVL=this.value;render()">${['',5,6,7,8,9,10,11,12].map(n=>`<option value="${n}" ${String(TULVL)===String(n)?'selected':''}>${n?'Klasse '+n+(T.lvl&&T.lvl[n]?' – eigener Schlüssel':' – wie Standard'):'Standard (alle Klassenstufen)'}</option>`).join('')}</select></label>
    ${TULVL&&!own?`<div class="lstat" style="margin-top:12px"><span>Für Klasse ${TULVL} gilt der Standard-Schlüssel.</span><button class="btn sm primary" onclick="A.tuLvlOwn()">Eigenen Schlüssel für Klasse ${TULVL} anlegen</button></div>`:`
    <div class="row" style="margin:12px 0 10px"><select class="sel" onchange="A.schemeLoad('tu',this.value)" aria-label="Notenschlüssel laden"><option value="">Anderen Schlüssel laden …</option><option value="__def">Standard-Notenschlüssel (Einstellungen)</option>${allSchemes().filter(x=>x.sys==='n').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="btn sm" onclick="A.schemeReset('tu')">Vorlage wiederherstellen</button>${own?`<button class="btn sm ghost danger" onclick="A.tuLvlDel()">Eigenen Schlüssel für Klasse ${TULVL} entfernen</button>`:''}</div>
    ${schemeEditor(own?own.scheme:T.scheme,'tu')}`}</div>`}
  return h+`<div class="card"><h2 style="margin-top:0">Übungskatalog</h2><div class="segm full tudevseg" role="group" aria-label="Gerät">${Object.entries(TU_DEV).map(([k,D])=>`<button class="${dev===k?'on':''}" onclick="TUDEV='${k}';render()">${esc(D.n)}</button>`).join('')}</div>
  <p class="muted" style="margin:10px 0">„Punkte“ = Höchstpunktzahl bei perfekter Ausführung. Gibt es für Mädchen eine andere Punktzahl, trägst du sie in der Spalte „Mädchen“ ein (leer = gleich). Die Liste ist von leicht nach schwer (nach Punktzahl) sortiert. Änderungen gelten für neu zusammengestellte Küren – fertige Küren behalten ihre Punktzahlen.</p>
  ${(()=>{const p3=TU_3.includes(dev),row=e=>`<div class="tucrow ${p3?'p3':''}"><input value="${esc(e.n)}" onchange="A.tuCe('${e.id}','n',this.value)" aria-label="Element"><input inputmode="decimal" value="${tuN(e.p)}" onchange="A.tuCe('${e.id}','p',this.value)" aria-label="Punkte"><input inputmode="decimal" value="${tuN(e.pw)}" placeholder="gleich" onchange="A.tuCe('${e.id}','pw',this.value)" aria-label="Punkte Mädchen"><select onchange="A.tuCe('${e.id}','only',this.value)" aria-label="für"><option value="">alle</option><option value="m" ${e.only==='m'?'selected':''}>nur Jungen</option><option value="w" ${e.only==='w'?'selected':''}>nur Mädchen</option></select>${p3?`<select onchange="A.tuCe('${e.id}','part',this.value)" aria-label="Teil">${TU_PK.map(k=>`<option value="${k}" ${tuPart(e,dev)===k?'selected':''}>${TU_PN[k]}</option>`).join('')}</select>`:''}<span class="tubt"><button class="icon" onclick="A.tuCd('${e.id}')" aria-label="löschen">✕</button></span></div>`,
    hd=`<div class="tucrow tuchd ${p3?'p3':''}"><span>Element</span><span>Punkte</span><span>Mädchen</span><span>für</span>${p3?'<span>Teil</span>':''}<span></span></div>`,S2=tuSortEl(L);
    return`<div class="tucfg">${p3?TU_PK.map(k=>`<h4 class="tucfgh">${TU_PN[k]}</h4>${hd}${S2.filter(e=>tuPart(e,dev)===k).map(row).join('')||'<p class="muted" style="margin:0">–</p>'}`).join(''):hd+S2.map(row).join('')}`})()}</div>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="A.tuCa()">+ Element</button><span class="spacer"></span><button class="btn sm ghost" onclick="A.tuCr()">Standard für ${esc(TU_DEV[dev].n)} wiederherstellen</button></div></div>`}
function tuCatW(){const T=tuCfg(1),dev=TU_DEV[TUDEV]?TUDEV:'boden';return T.cat[dev]}
A.tuCe=(id,f,v)=>{const e=tuCatW().find(x=>x.id===id);if(!e)return;
  if(f==='n'){v=v.trim();if(v)e.n=v}else if(f==='p'){const n=pnum(v);if(isNaN(n)||n<=0){toast('Bitte eine Punktzahl größer 0 eingeben');render();return}e.p=n}
  else if(f==='pw'){if(!String(v).trim())delete e.pw;else{const n=pnum(v);if(isNaN(n)||n<=0){toast('Bitte eine Punktzahl größer 0 eingeben (oder leer lassen)');render();return}e.pw=n}}
  else if(f==='only'){if(v)e.only=v;else delete e.only}else if(f==='part'){if(TU_PN[v])e.part=v}save();render()};
A.tuCm=(i,d)=>{const L=tuCatW(),j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render()};
A.tuCd=id=>{const L=tuCatW(),e=L.find(x=>x.id===id);if(!e)return;confirmBox(`Element „${e.n}“ aus dem Katalog löschen? Bereits zusammengestellte Küren bleiben unverändert.`,()=>{L.splice(L.indexOf(e),1);save();render()})};
A.tuCa=()=>{tuCatW().push({id:uid(),n:'Neues Element',p:1});save();render();setTimeout(()=>{const r=[...document.querySelectorAll('.tucrow input')];const i=r[r.length-3];if(i){i.focus();i.select()}},30)};
A.tuCr=()=>{const dev=TU_DEV[TUDEV]?TUDEV:'boden';confirmBox(`Übungskatalog ${TU_DEV[dev].n} auf den Standard zurücksetzen? Eigene Elemente und Änderungen an diesem Gerät gehen verloren; fertige Küren bleiben unverändert.`,()=>{tuCfg(1).cat[dev]=tuDefCat()[dev];save();render()},'Zurücksetzen')};


/* ===== Stundenplanung & Hausaufgaben je Stunde (ab 2026-10-16e) =====
   c.lp = {'JJJJ-MM-TT': {plan, ha, due}} – plan = Stundenplanung, ha = Hausaufgabe aus dieser Stunde, due = fällig am (Standard: nächste Stunde laut Stundenplan) */
/* Planung/HA im Sitzplan gehören zur Stunde: hat die Lerngruppe am gewählten Tag keinen Unterricht (z. B. Planung am Wochenende), gilt die nächste Stunde laut Stundenplan (Fix 1.0) */
function lpDate(c){const d=LDATE;if(!c||dayLessons(dateOf(d)).some(l=>l.e.g===c.id))return d;return nextLesson(c,d)||d}
function lpOf(c,d){return(c&&c.lp||{})[d]||null}
function lpSet(c,d,o){c.lp=c.lp||{};const x={...(c.lp[d]||{}),...o};['plan','ha','due'].forEach(k=>{if(!x[k])delete x[k]});if(!x.ha)delete x.due;if(Object.keys(x).length)c.lp[d]=x;else delete c.lp[d]}
function nextLesson(c,d){const t=dateOf(d);for(let i=0;i<120;i++){t.setDate(t.getDate()+1);if(dayLessons(t).some(l=>l.e.g===c.id))return iso(t)}return''}
function haDue(c,d){return Object.entries(c&&c.lp||{}).filter(([k,x])=>x.ha&&x.due===d&&k<d).map(([k,x])=>({d:k,...x})).sort((a,b)=>a.d.localeCompare(b.d))}
function fmtWd(d){return d?dateOf(d).toLocaleDateString('de-DE',{weekday:'short'})+' '+fmtDate(d):''}
function lpLessons(c,d){return dayLessons(dateOf(d)).filter(l=>l.e.g===c.id).map(l=>l.n0===l.n1?l.n0+'. Stunde':l.n0+'.–'+l.n1+'. Stunde').join(', ')}
A.lpOpen=(cid,d,room)=>{const c=S.classes.find(k=>k.id===cid);if(!c)return;const p=lpOf(c,d)||{},due=haDue(c,d),nx=nextLesson(c,d),ls=lpLessons(c,d);
  const save1=()=>{lpSet(c,d,{plan:$('#lpp').value.trim(),ha:$('#lph').value.trim(),due:$('#lpd').value||nx});save()};
  modal(`${cname(c)} – ${fmtWd(d)}`,`${ls?`<p class="muted" style="margin:0 0 10px">${ls}</p>`:''}${due.length?`<div class="lstat hainfo">📌 <span><b>Heute fällige Hausaufgaben:</b> ${due.map(x=>esc(x.ha)).join(' · ')}</span></div>`:''}
   <div class="form"><label>Stundenplanung<textarea id="lpp" rows="9" placeholder="z. B. Einstieg: Bild zeigen&#10;Erarbeitung: AB S. 34 in Partnerarbeit&#10;Sicherung: Tafelbild">${esc(p.plan||'')}</textarea></label>
   <label>Hausaufgabe aus dieser Stunde (optional)<textarea id="lph" rows="2" placeholder="z. B. Buch S. 34 Nr. 3">${esc(p.ha||'')}</textarea></label>
   <label>Hausaufgabe fällig am<input type="date" id="lpd" value="${p.due||nx}"><small class="muted">${nx?'Nächste Stunde laut Stundenplan: '+fmtWd(nx)+' – dort erscheint die Hausaufgabe automatisch im '+(isSport(c)?'Sitzplan (Klassenliste)':'Sitzplan')+'.':'Keine weitere Stunde im Stundenplan gefunden – bitte Datum wählen.'}</small></label></div>`,
  [{label:isSport(c)?'Zur Klassenliste':'Zum Sitzplan',cls:'left',fn:()=>{save1();A.calLesson(cid,d,room||'')}},{label:'Abbrechen'},{label:'Speichern',cls:'primary',fn:()=>{save1();render();toast('Stunde gespeichert')}}])};
A.lpShow=()=>{const c=cls(),D=lpDate(c),p=lpOf(c,D);if(!p||!p.plan)return A.lpOpen(c.id,D);
  modal(`Stundenplanung – ${fmtWd(D)}`,`<div class="lptext">${esc(p.plan)}</div>${p.ha?`<p class="hint" style="margin-top:12px">📌 Hausaufgabe aus dieser Stunde: <b>${esc(p.ha)}</b>${p.due?' (fällig '+fmtWd(p.due)+')':''}</p>`:''}`,
  [{label:'Bearbeiten',cls:'left',fn:()=>{A.lpOpen(c.id,D);return false}},{label:'Schließen',cls:'primary'}],{nofocus:true})};
A.haAdd=()=>{const c=cls(),D=lpDate(c),p=lpOf(c,D)||{},nx=nextLesson(c,D);
  modal(`Hausaufgabe – ${fmtWd(D)}`,`<div class="form"><label>Hausaufgabe<textarea id="lph" rows="3" placeholder="z. B. Buch S. 34 Nr. 3">${esc(p.ha||'')}</textarea></label><label>Fällig am<input type="date" id="lpd" value="${p.due||nx}"><small class="muted">${nx?'Nächste Stunde: '+fmtWd(nx)+' – dort wird die Hausaufgabe im Sitzplan angezeigt.':'Keine weitere Stunde im Stundenplan gefunden – bitte Datum wählen.'}</small></label></div>`,
  [...(p.ha?[{label:'Entfernen',cls:'danger left',fn:()=>{lpSet(c,D,{ha:''});save();render()}}]:[]),{label:'Abbrechen'},{label:'Speichern',cls:'primary',fn:()=>{const t=$('#lph').value.trim(),d=$('#lpd').value;if(t&&!d){toast('Bitte ein Fälligkeitsdatum wählen');return false}lpSet(c,D,{ha:t,due:d});save();render();if(t)toast('Hausaufgabe gespeichert – erscheint am '+fmtWd(d))}}])};
A.haShow=()=>{const c=cls(),L=haDue(c,LDATE);
  modal(`Hausaufgaben für ${fmtWd(LDATE)}`,L.length?`<ul class="dlist">${L.map(x=>`<li style="cursor:pointer" onclick="A.lpOpen('${c.id}','${x.d}')"><span class="badge">📌</span><div><div class="haText">${esc(x.ha)}</div><div class="sub">aufgegeben am ${fmtWd(x.d)}</div></div></li>`).join('')}</ul><p class="hint">Wer sie nicht hat: im Sitzplan auf dem Platz „HA ✓“ antippen (→ „HA ✗“).</p>`:'<p class="muted">Keine Hausaufgaben fällig.</p>',[{label:'Schließen',cls:'primary'}],{nofocus:true})};
function lpSide(c){const D=lpDate(c),p=lpOf(c,D)||{},due=haDue(c,LDATE),dl=D!==LDATE?' '+fmtShort(D):'';
  return`<div class="lpside noprint"><div class="lpbtns"><button class="btn sm ${p.plan?'has':''}" onclick="A.lpShow()" title="Stundenplanung für diese Stunde anzeigen/bearbeiten">📝 Planung${dl}${p.plan?' ●':''}</button><button class="btn sm ${p.ha?'has':''}" onclick="A.haAdd()" title="Hausaufgabe für die nächste Stunde aufgeben">＋ HA${dl}${p.ha?' ✓':''}</button></div>${p.plan?(PRIV?'<div class="lpbox muted">📝 Planung im Datenschutz-Modus ausgeblendet</div>':`<button class="lpbox" onclick="A.lpOpen('${c.id}','${D}')" title="Antippen zum Bearbeiten"><b>📝 Stundenplanung${dl?' für '+fmtWd(D):''}</b><span>${esc(p.plan)}</span>${p.ha?`<em>HA: ${esc(p.ha)}</em>`:''}</button>`):''}${due.length?`<button class="hadue" onclick="A.haShow()"><b>📌 Hausaufgaben für heute</b><span>${due.map(x=>esc(x.ha)).join(' · ')}</span></button>`:''}</div>`}
function lpFloat(c,top){const D=lpDate(c),p=lpOf(c,D)||{},due=haDue(c,LDATE);
  return`<div class="lpfloat noprint ${top?'top':'bot'}"><button class="lpf ${p.plan?'has':''}" onclick="A.lpShow()" title="Stundenplanung" aria-label="Stundenplanung">📝</button><button class="lpf ${p.ha?'has':''}" onclick="A.haAdd()" title="Hausaufgabe aufgeben" aria-label="Hausaufgabe aufgeben">＋HA</button>${due.length?`<button class="lpf due" onclick="A.haShow()" title="Hausaufgaben für heute" aria-label="Hausaufgaben für heute">📌${due.length>1?due.length:''}</button>`:''}</div>`}

/* ===== Sport: Klassenliste statt Sitzplan (ab 16e) =====
   c.att[d][sid].sk = krank/verletzt, .sv = Sportsachen vergessen; c.attest=[{id,sid,from,until,note}] → bis „until“ automatisch krankgeschrieben */
function attestOf(c,sid,d){return(c.attest||[]).find(a=>a.sid===sid&&a.from<=d&&d<=a.until)||null}
function spAbs(c,sid){let k=0,v=0;for(const d in c.att){const r=c.att[d][sid];if(!r)continue;if(r.sk)k++;if(r.sv)v++}return{k,v,at:(c.attest||[]).filter(a=>a.sid===sid).sort((a,b)=>b.from.localeCompare(a.from))}}
function spListView(c){const st=sorted(c),d=LDATE;let nK=0;
  let nV=0;const rows=st.map(s=>{const r=(c.att[d]||{})[s.id]||{},at=attestOf(c,s.id,d),k=!!(r.sk||at),v=!!r.sv,cnt=spAbs(c,s.id);if(k)nK++;else if(v)nV++;
    if(PRIV)return`<div class="slrow"><span class="slnm">${esc(sname(s))}</span></div>`;
    return`<div class="slrow ${k?'sk':''} ${v&&!k?'sv':''}"><span class="slnm">${esc(sname(s))}${s.g?` <small class="muted">${s.g}</small>`:''}${cnt.k||cnt.v?`<small class="slcnt" title="im Schuljahr erfasst">${cnt.k?'🤕 '+cnt.k+'×':''}${cnt.k&&cnt.v?' · ':''}${cnt.v?'👕 '+cnt.v+'×':''}</small>`:''}</span>
      <span class="slbtns">${at?`<button class="slat" onclick="A.atEdit('${at.id}')" title="Attest bearbeiten">🩺 krankgeschrieben bis ${fmtShort(at.until)}</button>`:`<button class="tog ${r.sk?'on':''}" onclick="A.slSet('${s.id}','sk')">🤕 krank/verletzt</button>`}<button class="tog ${v?'on':''}" onclick="A.slSet('${s.id}','sv')">👕 Sportsachen vergessen</button>${at?'':`<button class="btn sm ghost" onclick="A.atNew('${s.id}')" title="Attest mit Gültigkeit eintragen">📄 Attest</button>`}</span></div>`}).join('');
  const side=`${sitzPicker(c)}<div class="dnav">${dateNav()}</div>${lpSide(c)}${PRIV?'<div class="lstat"><span>🔒 Datenschutz-Modus: nur Namen sichtbar</span></div>':`<span class="pill">${nK?nK+' krank · ':''}${nV?nV+' ohne Sportsachen · ':''}${st.length-nK-nV} / ${st.length} machen mit</span>`}
    <div class="sbtns"><button class="btn ${PRIV?'primary':''}" onclick="A.privToggle()" title="Für Beamer / Bildschirm teilen: nur Namen anzeigen">${PRIV?'🔒 Datenschutz an':'🔓 Datenschutz'}</button></div>`;
  const main=`<div class="card flush"><div class="spgh"><h2 style="margin:0">Klassenliste</h2><span class="muted">${fmtWd(d)}</span><div class="spacer"></div><button class="btn sm" onclick="S.ui.scls='${c.id}';S.ui.spTab='grades';A.go('sport')">Benotung</button><button class="btn sm" onclick="S.ui.scls='${c.id}';S.ui.spTab='teams';A.go('sport')">Mannschaften</button></div>
    ${st.length?`<div class="sllist">${rows}</div>`:`<p class="muted" style="padding:0 16px 16px">Noch keine Schüler.</p>`}</div>
    <p class="hint">„krank/verletzt“ und „Sportsachen vergessen“ gelten für den gewählten Tag. Mit „📄 Attest“ trägst du ein, bis wann ein Attest gilt – bis dahin ist der Schüler an jedem Tag automatisch als krankgeschrieben vermerkt. Die Zahlen hinter dem Namen zählen das Schuljahr.</p>`;
  return`<div class="sitzlay"><div class="spanel noprint">${side}</div><div class="sitzmain">${main}</div></div>`}
A.slSet=(sid,k)=>{if(PRIV)return;const c=cls();c.att[LDATE]=c.att[LDATE]||{};const r=c.att[LDATE][sid]={...(c.att[LDATE][sid]||{})};if(r[k])delete r[k];else r[k]=1;if(!Object.keys(r).length)delete c.att[LDATE][sid];if(!Object.keys(c.att[LDATE]).length)delete c.att[LDATE];save();render()};
function atModal(c,a,isNew){const s=c.students.find(x=>x.id===a.sid);
  modal(`Attest – ${sname(s||{})}`,`<div class="form"><div class="two"><label>gilt ab<input type="date" id="atf" value="${a.from}"></label><label>gilt bis<input type="date" id="atu" value="${a.until||''}"></label></div><label>Notiz (optional)<input id="atn" value="${esc(a.note||'')}" placeholder="z. B. Bänderdehnung, Sportbefreiung Laufen"></label><p class="hint">Bis einschließlich zum Enddatum ist ${esc(s?s.first||s.last:'der Schüler')} in der Klassenliste automatisch als krankgeschrieben vermerkt.</p></div>`,
  [...(isNew?[]:[{label:'Löschen',cls:'danger left',fn:()=>{c.attest=(c.attest||[]).filter(x=>x.id!==a.id);save();render()}}]),{label:'Abbrechen'},{label:'Speichern',cls:'primary',fn:()=>{const f=$('#atf').value,u=$('#atu').value;if(!f||!u){toast('Bitte Beginn und Ende eintragen');return false}if(u<f){toast('Das Enddatum liegt vor dem Beginn');return false}

const CATN={s:'schriftlich',m:'mündlich',o:'sonstige',p:'Praxis'};
function zaInfo(c,s){const id=s.id,sys=gsys(c),a=averages(c,id),z=zeugnis(c,id,a),H=[];
  if(a.all==null){H.push(['r','noch keine Noten']);return{a,z,H}}
  catsOf(c).filter(t=>+c.weights[t]>0).forEach(t=>{const n=c.entries.filter(e=>e.type===t&&e.grades[id]!=null&&e.grades[id]!==''&&!isNaN(gParse(c,e.grades[id]))).length;
    if(!n)H.push(['r','keine Note '+CATN[t]]);else if(n===1&&(t==='m'||t==='s'))H.push(['y','nur 1 Note '+CATN[t]])});
  const R=rndCfg(),m=sys==='p'?R.p:R.n;if(m!=='x'){const stp=sys==='p'?1:({q:.25,h:.5,w:1}[m]||.25),x=a.all/stp,dist=Math.abs((x-Math.floor(x))-.5)*stp;
    if(dist<stp*.12){const lo=Math.floor(x)*stp,hi=lo+stp;H.push(['y',`knapp: Ø ${num(a.all)} – zwischen ${sLabel(sys,lo)} und ${sLabel(sys,hi)}`])}}
  (c.gfs||[]).filter(g=>g.sid===id&&!g.grade&&g.date&&g.date<=today()).forEach(()=>H.push(['r','GFS-Note fehlt']));
  if(z.ovr){const ov=gParse(c,z.ovr),cv=zRound(sys,a.all);if(cv!=null&&!isNaN(ov)&&Math.abs(ov-cv)>=(sys==='p'?2:.5))H.push(['b',`festgelegt ${z.ovr}, berechnet ${z.calc}`])}
  else if(z.calc)H.push(['g','Zeugnisnote noch nicht festgelegt']);
  return{a,z,H}}
function zassView(){if(PRIV)return`<div class="card empty"><h3>🔒 Datenschutz-Modus</h3><p>Der Zeugnis-Assistent ist im Datenschutz-Modus gesperrt.</p><button class="btn" onclick="ZASS=null;render()">‹ Notenbuch</button></div>`;

      <button class="btn sm" onclick="ZASS=null;S.ui.cls='${c.id}';A.go('noten')">Notenbuch</button>${open?`<button class="btn sm" onclick="A.zaFixAll('${c.id}')" title="Berechnete Noten als Zeugnisnoten festlegen">Alle ${open} berechneten Noten festlegen</button>`:''}</div>

function elCls(c,s){const id=s.id,sys=gsys(c),sport=isSport(c),a=averages(c,id),z=zeugnis(c,id,a),L=catsOf(c),ents=entriesSorted(c).filter(e=>e.grades[id]),ls=lessonStats(c,id);

   ${ex.length?`<div class="elsub">Klassenarbeiten</div><ul class="elg">${ex.map(o=>row(sBadge(exSys(o.x),o.r.g),esc(o.x.title),`${fmtPts(o.r.sum)}/${fmtPts(examMax(o.x))} P. · ${Math.round(o.r.pct)} %`)).join('')}</ul>`:''}

/* ===== Ferien & Feiertage Baden-Württemberg (ab 16e) =====
   Ferien laut Kultusministerium BW (über kalenderpedia.de, Stand Oktober 2026), Feiertage berechnet. Bewegliche Ferientage legt jede Schule selbst fest. */
const BW_FERIEN={'2026/27':[['Herbstferien','2026-10-26','2026-10-31'],['Weihnachtsferien','2026-12-23','2027-01-09'],['Osterferien','2027-03-25','2027-04-03'],['Pfingstferien','2027-05-18','2027-05-29'],['Sommerferien','2027-07-29','2027-09-11']],
  '2027/28':[['Herbstferien','2027-11-02','2027-11-06'],['Weihnachtsferien','2027-12-23','2028-01-08'],['Osterferien','2028-04-13','2028-04-22'],['Pfingstferien','2028-06-06','2028-06-17'],['Sommerferien','2028-07-27','2028-09-09']]};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return iso(new Date(y,mo-1,da,12))}
function bwList(sj){const F=BW_FERIEN[sj];if(!F)return[];const Y=+sj.slice(0,4),Y1=Y+1,E=easter(Y1),ed=n=>addDays(E,n);
  const H=[[`${Y}-10-03`,'Tag der Deutschen Einheit'],[`${Y}-11-01`,'Allerheiligen'],[`${Y}-12-25`,'1. Weihnachtsfeiertag'],[`${Y}-12-26`,'2. Weihnachtsfeiertag'],[`${Y1}-01-01`,'Neujahr'],[`${Y1}-01-06`,'Heilige Drei Könige'],[ed(-2),'Karfreitag'],[ed(1),'Ostermontag'],[`${Y1}-05-01`,'Tag der Arbeit'],[ed(39),'Christi Himmelfahrt'],[ed(50),'Pfingstmontag'],[ed(60),'Fronleichnam']]
    .filter(([d])=>{const w=dateOf(d).getDay();return w>0&&w<6&&!F.some(([,a,b])=>d>=a&&d<=b)});
  return[...F.map(([t,a,b])=>({t,a,b,k:'f'})),...H.map(([d,t])=>({t,a:d,b:d,k:'h'}))].sort((x,y)=>x.a.localeCompare(y.a))}

  modal('Ferien & Feiertage Baden-Württemberg',`<label class="blk">Schuljahr<select class="sel" onchange="A.bwOpen(this.value)">${K.map(k=>`<option ${k===sj?'selected':''}>${k}</option>`).join('')}</select></label>

let ESTID=null,ESTT=null;

function estTimes(e){const s=parseTime(e.start),z=parseTime(e.end),n=Math.max(5,+e.len||10),o=[];if(s==null||z==null)return o;for(let t=s;t+n<=z;t+=n)o.push(pad5(String(Math.floor(t/60))+':'+String(t%60).padStart(2,'0')));return o}

function estBooked(k){const B=[];(S.est||[]).forEach(e=>{for(const t in e.slots||{})if(e.slots[t].key===k)B.push({e,t})});

   <button class="btn primary" onclick="A.estEdit()">+ Neuer Sprechtag</button>${e?`<button class="btn" onclick="A.estEdit('${e.id}')">Bearbeiten</button><div class="spacer"></div><button class="btn" onclick="window.print()">🖨 Drucken</button>`:''}</div>`;
  if(!e)return h+`<div class="card empty"><div style="font-size:2rem">📅</div><h3>Zeitplan für den Elternsprechtag</h3><p>Lege einen Sprechtag mit Beginn und Ende an – die App erstellt daraus 10-Minuten-Termine. Zeile antippen → Schüler wählen; daneben ist Platz für Notizen (z. B. Namen der Eltern). Am Sprechtag selbst ist der aktuelle Termin farbig markiert.</p><button class="btn primary" onclick="A.estEdit()">+ Neuer Sprechtag</button></div>`;
  const T=estTimes(e),S2=e.slots||{},booked=T.filter(t=>S2[t]&&S2[t].key).length,live=e.date===today();

   ${live?`<div id="estlive" class="estlive noprint">${estLiveTxt(e)}</div>`:''}
   <div class="tblwrap"><table class="list est"><thead><tr><th>Zeit</th><th>Schüler</th><th>Notizen (z. B. Namen der Eltern)</th><th class="noprint"></th></tr></thead><tbody>
   ${T.map(t=>{const x=S2[t]||{};const it=x.key&&elAll().find(o=>o.k===x.key);
     return`<tr class="estrow ${x.pause?'pause':''}" data-t="${t}"><td class="estt" onclick="A.estPick('${t}')">${t}</td>
      <td class="ests" onclick="if(event.target===this)A.estPick('${t}')">${x.pause?'<span class="muted">☕ Pause</span>':x.key?`<button class="lnk" onclick="A.estPick('${t}')">${esc(x.name||'?')}</button><small class="muted"> ${it?it.items.map(o=>esc(o.c.name+(o.c.subject?' '+o.c.subject:''))).join(', '):''}</small>`:`<button class="btn sm ghost estfree" onclick="A.estPick('${t}')">+ Schüler wählen</button>`}</td>
      <td><input class="estn" value="${esc(x.note||'')}" placeholder="${x.key?'z. B. Frau Muster, Vater …':''}" oninput="A.estNote('${t}',this.value)" aria-label="Notiz ${t}"><span class="onlyprint">${esc(x.note||'')}</span></td>
      <td class="noprint estact">${x.key?`<button class="btn sm ghost" onclick="A.estProf('${t}')" title="Alle Daten und Gesprächsnotizen">Profil ›</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
   ${orphan.length?`<p class="hint" style="padding:0 16px">⚠️ ${orphan.length} Einträge liegen außerhalb der eingestellten Zeiten (${orphan.join(', ')}) – unter „Bearbeiten“ die Zeiten anpassen.</p>`:''}</div>

  return h}
function estLiveTxt(e){const T=estTimes(e),n=+e.len||10,m=estNowMin(),S2=e.slots||{},nm=t=>{const x=S2[t]||{};return x.pause?'Pause':x.key?esc(x.name):'frei'};
  const i=T.findIndex(t=>m>=parseTime(t)&&m<parseTime(t)+n);if(i>=0){const nx=T.slice(i+1).find(t=>S2[t]&&S2[t].key);return`<b>Jetzt (${T[i]}):</b> ${nm(T[i])}${nx?` · <b>als Nächstes ${nx}:</b> ${nm(nx)}`:''}`}

  $$('.estrow').forEach(r=>{const t=parseTime(r.dataset.t);r.classList.toggle('now',m>=t&&m<t+n);r.classList.toggle('past',m>=t+n)});const l=$('#estlive');if(l)l.innerHTML=estLiveTxt(e)}

  [...(e?[{label:'Löschen',cls:'danger left',fn:()=>confirmBox(`Sprechtag „${e.title}“ vom ${fmtDate(e.date)} mit allen Einträgen löschen? Gesprächsnotizen bei den Schülern bleiben erhalten.`,()=>{S.est=S.est.filter(x=>x.id!==e.id);ESTID=null;save();render()})}]:[]),{label:'Abbrechen'},

     S.est=S.est||[];if(e)Object.assign(e,o);else{const n={id:uid(),...o,slots:{}};S.est.push(n);ESTID=n.id}save();render()}}])};

  if(C){const K=new Set(C.students.map(elKey));L=L.filter(x=>K.has(x.k))}else if(q)L=L.filter(x=>(x.first+' '+x.last+' '+x.last+', '+x.first).toLowerCase().includes(q));else return'<p class="muted">Namen eintippen oder Lerngruppe wählen.</p>';

/* QR-Code-Erzeuger (Byte-Modus, Fehlerkorrektur M, Version 1–40) – eigene kompakte Umsetzung, offline */
const QRGEN=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dataCw=v=>Math.floor(raw(v)/8)-ECC[v]*BLK[v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  const divisor=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const remainder=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r};
  const bit=(x,i)=>((x>>>i)&1)!==0;
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(String(text)));
    let ver=1;for(;ver<=40;ver++){const cc=ver<=9?8:16;if(4+cc+8*bytes.length<=dataCw(ver)*8)break}
    if(ver>40)return null;
    const bb=[];const put=(val,len)=>{for(let i=len-1;i>=0;i--)bb.push((val>>>i)&1)};
    put(4,4);put(bytes.length,ver<=9?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataCw(ver)*8;put(0,Math.min(4,cap-bb.length));put(0,(8-bb.length%8)%8);
    for(let p=0xEC;bb.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bb.length;i+=8){let v=0;for(let j=0;j<8;j++)v=v<<1|bb[i+j];data.push(v)}
    /* Fehlerkorrektur + Verschränkung */
    const nb=BLK[ver],el=ECC[ver],rc=Math.floor(raw(ver)/8),nShort=nb-rc%nb,shortLen=Math.floor(rc/nb),div=divisor(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=d.length;const e=remainder(d,div);if(i<nShort)d.push(0);blocks.push(d.concat(e))}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)cw.push(b[i])});
    /* Matrix */
    const n=ver*4+17,M=[],F=[];for(let y=0;y<n;y++){M.push(new Array(n).fill(false));F.push(new Array(n).fill(false))}
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<n;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<n&&y>=0&&y<n)setF(x,y,d!==2&&d!==4)}};
    finder(3,3);finder(n-4,3);finder(3,n-4);
    if(ver>1){const na=Math.floor(ver/7)+2,step=ver===32?26:Math.ceil((ver*4+4)/(na*2-2))*2,pos=[6];for(let p=n-7;pos.length<na;p-=step)pos.splice(1,0,p);
      pos.forEach((a,i)=>pos.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}))}
    const fmt=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412;
      for(let i=0;i<=5;i++)setF(8,i,bit(b,i));setF(8,7,bit(b,6));setF(8,8,bit(b,7));setF(7,8,bit(b,8));for(let i=9;i<15;i++)setF(14-i,8,bit(b,i));
      for(let i=0;i<8;i++)setF(n-1-i,8,bit(b,i));for(let i=8;i<15;i++)setF(8,n-15+i,bit(b,i));setF(8,n-8,true)};
    fmt(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;for(let i=0;i<18;i++){const v=bit(b,i),a=n-11+i%3,c=Math.floor(i/3);setF(a,c,v);setF(c,a,v)}}
    let i=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<n;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?n-1-v:v;if(!F[y][x]&&i<cw.length*8){M[y][x]=bit(cw[i>>>3],7-(i&7));i++}}}
    const inv=(m,x,y)=>[(x+y)%2===0,y%2===0,x%3===0,(x+y)%3===0,(Math.floor(x/3)+Math.floor(y/2))%2===0,x*y%2+x*y%3===0,(x*y%2+x*y%3)%2===0,((x+y)%2+x*y%3)%2===0][m];
    const apply=m=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!F[y][x]&&inv(m,x,y))M[y][x]=!M[y][x]};
    const score=()=>{let s=0,dark=0;for(let y=0;y<n;y++){let rx=1,ry=1;for(let x=0;x<n;x++){if(M[y][x])dark++;
        if(x>0){if(M[y][x]===M[y][x-1]){rx++;if(rx===5)s+=3;else if(rx>5)s++}else rx=1;if(M[x][y]===M[x-1][y]){ry++;if(ry===5)s+=3;else if(ry>5)s++}else ry=1}
        if(x<n-1&&y<n-1){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])s+=3}}}
      return s+Math.floor(Math.abs(dark*20-n*n*10)/(n*n))*10};
    let best=0,bs=1e9;for(let m=0;m<8;m++){apply(m);fmt(m);const sc=score();if(sc<bs){bs=sc;best=m}apply(m)}
    apply(best);fmt(best);return M}
  function svg(text,opt={}){const M=encode(text);if(!M)return'';const n=M.length,q=4,s=n+2*q;let d='';
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(M[y][x])d+=`M${x+q} ${y+q}h1v1h-1z`;
    return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" ${opt.cls?`class="${opt.cls}"`:''} role="img" aria-label="QR-Code"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
  return{encode,svg};
})();

/* ================= Bühne (ab 2026-10-17f, vorher „Werkzeuge“; 17i: Sprache, Zahnrad-Einstellungen, Analog-Timer) =================
   Gadgets für den Beamer. Auswahl S.ui.stage = [ids] (fehlt = Standard). Gerätezustand (Arbeitsform, Ampel,
   Würfel, Punkte, QR, Tafeltext, Ablauf-Phase, Gadget-Einstellungen) in localStorage 'lehrerpult.buehne' – nicht synchronisiert.
   Sprache der Bühne: S.settings.stLang = 'de' | 'en' | 'auto' (fehlt = auto: Englisch, wenn die gewählte Lerngruppe Englisch ist). */
const GADS=[
  ['ablauf','📋','Stundenablauf','Lesson plan','Planung der heutigen Stunde Schritt für Schritt'],
  ['ha','📌','Hausaufgabe','Homework','HA der heutigen Stunde groß zum Abschreiben'],
  ['timer','⏱','Timer','Timer','Countdown mit Signal – digital oder analog'],
  ['uhr','🕐','Uhrzeit','Clock','Große Uhr'],
  ['arbeit','🧑‍🏫','Arbeitsform','Working mode','Stille, Einzel-, Partner-, Gruppenarbeit, Talking, Writing …'],
  ['ampel','🚦','Ampel','Traffic light','Rot / Gelb / Grün, optional mit Beschriftung'],
  ['laut','🔊','Lautstärke','Noise level','Geräuschpegel über das Mikrofon (bleibt auf dem Gerät)'],
  ['sound','🎵','Soundboard','Soundboard','Applaus, Trommelwirbel, Tusch, Richtig/Falsch … und eigene Sounds'],
  ['zufall','🎯','Zufallsauswahl','Random pick','Schüler ziehen – ohne Wiederholung, Abwesende ausgelassen'],
  ['gruppen','👥','Gruppen','Groups','Gruppen aus den Anwesenden bilden – mit Nummern oder Rollen'],
  ['wuerfel','🎲','Würfel','Dice','1–6 Würfel'],
  ['punkte','🏆','Punktestand','Scoreboard','Punkte für 2–6 Teams'],
  ['qr','🔳','QR-Code','QR code','Link als QR-Code zum Scannen'],
  ['text','✏️','Tafeltext','Board text','Großer Text, z. B. Seite und Aufgabe']];
const GDEF=['ablauf','timer','zufall','arbeit'];
const GSETS=new Set(['timer','arbeit','ampel','laut','sound','zufall','gruppen']); /* Gadgets mit ⚙-Einstellungen */
const ARBF=[['still','🤐','Stille','Silence'],['fl','🤫','Flüstern','Whisper'],['ea','👤','Einzelarbeit','Individual work'],['pa','👥','Partnerarbeit','Pair work'],['ga','👨‍👩‍👧‍👦','Gruppenarbeit','Group work'],['pl','🧑‍🏫','Plenum – bitte melden','Whole class – raise your hand'],['talk','💬','Sprechen','Talking'],['write','✍️','Schreiben','Writing'],['pause','☕','Pause','Break']];
const PKC=['#1f6feb','#e3051a','#1e8a3c','#f08a24','#7b3fb3','#0e9aa7'];
const ROLES_DE='Zeitwächter, Schreiber, Sprecher, Materialchef',ROLES_EN='Timekeeper, Writer, Speaker, Materials manager';
let STG=(()=>{try{return JSON.parse(localStorage.getItem('lehrerpult.buehne')||'{}')||{}}catch(e){return{}}})();
function stgSave(){try{localStorage.setItem('lehrerpult.buehne',JSON.stringify(STG))}catch(e){}}
/* Sprache */
function isEngl(c){return!!c&&/engl|english|^e$|^en$/i.test(((c.subject||'')+' '+(c.short||'')).trim())}
function stLang(){const m=S.settings.stLang||'auto';if(m==='en')return'en';if(m==='de')return'de';return isEngl(cls())?'en':'de'}
const L2=(de,en)=>stLang()==='en'?en:de;
const stLoc=()=>stLang()==='en'?'en-GB':'de-DE';
A.stLang=v=>{S.settings.stLang=v;save();render()};
function stageList(){const L=Array.isArray(S.ui.stage)?S.ui.stage:GDEF,O=(STG.lay&&STG.lay.order)||[],ix=k=>{const i=O.indexOf(k);return i<0?100+GADS.findIndex(g=>g[0]===k):i};
  return GADS.map(g=>g[0]).filter(k=>L.includes(k)).sort((a,b)=>ix(a)-ix(b))}
/* Anordnen (ab 2026-10-18d): Reihenfolge STG.lay.order, Breite STG.lay.size[k] = 1–4 Spalten (4 = ganze Breite); nur auf diesem Gerät */
let STARR=false;
function layO(){STG.lay=STG.lay||{order:[],size:{}};STG.lay.size=STG.lay.size||{};const L=stageList();STG.lay.order=[...L,...(STG.lay.order||[]).filter(k=>!L.includes(k))];return STG.lay}
function gSpan(k){const z=STG.lay&&STG.lay.size&&STG.lay.size[k];return z||(GSIZE[k]==='w2'?2:1)}
A.stageArr=()=>{STARR=!STARR;GSET.clear();render()};
A.gMove=(k,d)=>{const Y=layO(),L=stageList(),i=L.indexOf(k),j=i+d;if(i<0||j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];Y.order=[...L,...Y.order.filter(x=>!L.includes(x))];stgSave();render()};
A.gSize=(k,n)=>{const Y=layO();Y.size[k]=n;stgSave();render()};
A.stReset=()=>confirmBox('Reihenfolge und Größen der Kacheln zurücksetzen?',()=>{delete STG.lay;stgSave();render()},'Zurücksetzen');
function stSpan(){const st=$('#stage');if(!st)return;const cols=getComputedStyle(st).gridTemplateColumns.split(' ').filter(Boolean).length||1;
  st.querySelectorAll('.gad').forEach(g=>{const n=gSpan(g.dataset.g);g.style.gridColumn=n>=4||n>=cols?(n>1?'1 / -1':''):(n>1?'span '+n:'')})}
function stDrag(ev,k){ev.preventDefault();const card=ev.target.closest('.gad');if(!card)return;card.classList.add('dragging');document.body.style.userSelect='none';try{getSelection().removeAllRanges()}catch(e){}let tgt=null;
  const mv=e=>{const el=document.elementFromPoint(e.clientX,e.clientY),g=el&&el.closest('.stage .gad');document.querySelectorAll('.gad.droptgt').forEach(x=>x.classList.remove('droptgt'));tgt=g&&g!==card?g:null;if(tgt)tgt.classList.add('droptgt')};
  const up=()=>{document.body.style.userSelect='';window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);card.classList.remove('dragging');
    if(tgt){const Y=layO(),L=stageList().filter(x=>x!==k),i=L.indexOf(tgt.dataset.g),after=stageList().indexOf(k)<stageList().indexOf(tgt.dataset.g);L.splice(after?i+1:i,0,k);Y.order=[...L,...Y.order.filter(x=>!L.includes(x))];stgSave()}render()};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)}
A.stageTog=k=>{const L=stageList();if(!L.includes(k)&&STG.lay&&STG.lay.order){STG.lay.order=STG.lay.order.filter(x=>x!==k);STG.lay.order.splice(L.length,0,k);stgSave()}S.ui.stage=L.includes(k)?L.filter(x=>x!==k):[...L,k];persist();render()};
A.stageOn=k=>{const L=stageList();if(!L.includes(k)){S.ui.stage=[...L,k];persist()}};
A.stageAll=on=>{S.ui.stage=on?GADS.map(g=>g[0]):[];persist();render()};
A.tool=k=>{A.stageOn(k);render()}; /* alte Aufrufe (z. B. Mini-Timer) */
let TOOL='zufall';const DRAWN={};let LASTPICK=null,GROUPS=null,DICE=null,STIV=null,TEDIT=false;const GSET=new Set();
const ZOPT={norep:true,skip:true},GOPT={mode:'size',n:4,skip:true,sex:'any'},RC={max:'40',pts:'',avg:''};
Object.assign(ZOPT,STG.zopt||{});Object.assign(GOPT,STG.gopt||{});
function optSave(){STG.zopt={...ZOPT};STG.gopt={...GOPT};stgSave()}
A.gset=k=>{GSET.has(k)?GSET.delete(k):GSET.add(k);if(k==='timer')TEDIT=false;render()};
VIEWS.tools=()=>{const L=stageList(),c=cls(),need=L.some(k=>['ablauf','ha','zufall','gruppen'].includes(k)),m=S.settings.stLang||'auto';
  const bar=`<div class="stbar noprint">${STG.chipsHide?'':`<div class="stchips" role="group" aria-label="Gadgets ein- und ausschalten">${GADS.map(([k,i,t,,d])=>`<button class="stchip ${L.includes(k)?'on':''}" onclick="A.stageTog('${k}')" title="${esc(t)} – ${esc(d)}" aria-label="${esc(t)}" aria-pressed="${L.includes(k)}"><span class="sci">${i}</span><span class="sct">${t}</span></button>`).join('')}</div>`}
    <div class="row stctl"><button class="btn sm ghost" onclick="STG.chipsHide=!STG.chipsHide;stgSave();render()" title="Gadget-Auswahl ein- oder ausblenden" aria-expanded="${!STG.chipsHide}">${STG.chipsHide?'▸ Gadgets wählen':'▾ Gadgets'}</button>${need&&S.classes.length?classPicker():''}<label class="stlang" title="Sprache der Bühne">🌐 <select class="sel" onchange="A.stLang(this.value)" aria-label="Sprache der Bühne"><option value="auto" ${m==='auto'?'selected':''}>Automatisch${m==='auto'?` (${stLang()==='en'?'English':'Deutsch'})`:''}</option><option value="de" ${m==='de'?'selected':''}>Deutsch</option><option value="en" ${m==='en'?'selected':''}>English</option></select></label><button class="btn sm ghost" onclick="A.stageAll(${L.length<GADS.length})">${L.length<GADS.length?'Alle an':'Alle aus'}</button><button class="btn sm ${STARR?'primary':''}" onclick="A.stageArr()" title="Reihenfolge und Größe der Kacheln ändern">${STARR?'✓ Fertig angeordnet':'✥ Anordnen'}</button>${STARR?`<button class="btn sm ghost" onclick="A.stReset()">↺ Standard</button>`:''}<button class="btn primary" onclick="A.stageFull()" title="Browser-Vollbild (Beamer)">${stFull()?'⤡ Vollbild beenden':'⛶ Vollbild'}</button><button class="stcol" onclick="A.stageNav()" title="Navigation und Leisten ausblenden – nur die Gadgets sind zu sehen" aria-label="Navigation ausblenden"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button></div></div>`;
  const body=L.length?L.map(k=>{const g=GADS.find(x=>x[0]===k),open=GSET.has(k);let h='';try{h=(open&&GSETUP[k]?`<div class="gset noprint">${GSETUP[k](c)}<div class="row"><button class="btn sm primary" onclick="A.gset('${k}')">✓ Fertig</button></div></div>`:'')+GADGET[k](c)}catch(e){console.error('Gadget',k,e);h='<p class="muted">Konnte nicht angezeigt werden.</p>'}
      const ix=L.indexOf(k),sz=gSpan(k),arr=STARR?`<div class="garr noprint"><button class="ghandle" onpointerdown="stDrag(event,'${k}')" title="Ziehen zum Verschieben" aria-label="Verschieben">⠿</button><button class="icon sm" onclick="A.gMove('${k}',-1)" ${ix<=0?'disabled':''} title="Nach vorne" aria-label="Nach vorne">◀</button><button class="icon sm" onclick="A.gMove('${k}',1)" ${ix>=L.length-1?'disabled':''} title="Nach hinten" aria-label="Nach hinten">▶</button><span class="gsz" role="group" aria-label="Breite">${[[1,'S'],[2,'M'],[3,'L'],[4,'▭']].map(([n,l])=>`<button class="${sz===n?'on':''}" onclick="A.gSize('${k}',${n})" title="${n===4?'ganze Breite':n+' Spalte'+(n>1?'n':'')}">${l}</button>`).join('')}</span></div>`:'';
      return`<section class="card gad gad-${k} ${GSIZE[k]||''} ${open?'gopen':''} ${STARR?'arr':''}" data-g="${k}">${arr}<div class="gadh"><span>${g[1]} ${L2(g[2],g[3])}</span><span class="gadhb noprint">${GSETS.has(k)?`<button class="icon sm ${open?'on':''}" onclick="A.gset('${k}')" title="Einstellungen" aria-label="Einstellungen ${g[2]}" aria-pressed="${open}">⚙︎</button>`:''}<button class="icon sm" onclick="A.stageTog('${k}')" title="Ausblenden" aria-label="${g[2]} ausblenden">✕</button></span></div><div class="gadb">${h}</div></section>`}).join('')
    :`<div class="card empty" style="grid-column:1/-1"><h3>Die Bühne ist leer</h3><p>Schalte oben die Gadgets ein, die du für deine Stunde brauchst. Die Auswahl bleibt gespeichert.</p></div>`;
  return bar+`<div class="stshow noprint"><button class="stcol" onclick="A.stageNav()" title="Navigation und Leisten wieder einblenden" aria-label="Navigation einblenden"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>${stFull()?`<button class="btn sm" onclick="A.stageFull()" title="Vollbild beenden">⤡</button>`:''}</div><div id="stage" class="stage" lang="${stLang()}">${body}</div>`};
AFTER.tools=()=>{const L=stageList();stSpan();if(L.includes('timer')){updT();stFit()}if(L.includes('qr'))qrDraw();stTick();clearInterval(STIV);if(L.includes('uhr'))STIV=setInterval(stTick,1000);const te=$('#tedit');if(te){te.focus();te.select()}};
function stFit(){document.querySelectorAll('.gad .tdisp,.gad .stclock').forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize),n=0;while(el.scrollWidth>el.clientWidth+1&&fs>14&&n++<40){fs*=.93;el.style.fontSize=fs+'px'}})}
window.addEventListener('resize',()=>{if(S.ui.view==='tools'){stSpan();stFit()}});
function stTick(){const e=$('#stclock');if(!e){clearInterval(STIV);return}const d=new Date();e.textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});if(!e.dataset.fit){e.dataset.fit=1;stFit()}const s=$('#stdate');if(s)s.textContent=d.toLocaleDateString(stLoc(),{weekday:'long',day:'numeric',month:'long'})}
function stFull(){return!!(document.fullscreenElement||document.webkitFullscreenElement)}
A.stageFull=()=>{const d=document,el=d.documentElement;if(stFull()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
  const f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f){toast('Vollbild wird in diesem Browser nicht unterstützt – nutze den Pfeil ︿ rechts neben „Vollbild“');return}
  try{const r=f.call(el);if(r&&r.catch)r.catch(()=>toast('Vollbild nicht möglich – nutze den Pfeil ︿ rechts neben „Vollbild“'))}catch(e){toast('Vollbild nicht möglich – nutze den Pfeil ︿ rechts neben „Vollbild“')}};
A.stageNav=()=>{document.body.classList.toggle('stfocus');window.scrollTo(0,0)};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(S.ui.view==='tools')render()}));
const GADGET={},GSETUP={};
/* Format je Gadget: sq = quadratisch, w2 = doppelt breit, sonst Höhe nach Inhalt */
const GSIZE={timer:'sq',arbeit:'sq',qr:'sq',uhr:'wide',gruppen:'w2',punkte:'w2'};
function needCls(c){return c?'':`<p class="muted">Lege zuerst eine Lerngruppe an.</p>`}
const chk=(on,js,label)=>`<label class="chk"><input type="checkbox" ${on?'checked':''} onchange="${js}"> ${label}</label>`;
/* Stundenablauf aus der Stundenplanung (c.lp[heute].plan) */
function ablaufSteps(c){const p=c&&lpOf(c,today());return((p&&p.plan)||'').split(/\n+/).map(x=>x.replace(/^\s*(?:[-–•*·▪]|\d+[.)]|\(\d+\))\s*/,'').trim()).filter(Boolean)}
GADGET.ablauf=c=>{if(!c)return needCls(c);const st=ablaufSteps(c),key=c.id+'|'+today(),ph=Math.min((STG.phase||{})[key]||0,Math.max(0,st.length-1));
  if(!st.length)return`<p class="muted">Für heute ist für ${esc(cname(c))} keine Stundenplanung eingetragen. Jede Zeile der Planung wird hier ein Schritt.</p><button class="btn noprint" onclick="A.lpOpen('${c.id}','${today()}')">📝 Planung eintragen</button>`;
  return`<ol class="ablauf">${st.map((s,i)=>`<li class="${i<ph?'done':i===ph?'now':''}" onclick="A.phase(${i})">${esc(s)}</li>`).join('')}</ol>
  <div class="row center noprint ablnav"><button class="btn sm" onclick="A.phase(${ph-1})" ${ph<=0?'disabled':''}>‹ ${L2('Zurück','Back')}</button><span class="muted">${L2(`Schritt ${ph+1} von ${st.length}`,`Step ${ph+1} of ${st.length}`)}</span><button class="btn sm primary" onclick="A.phase(${ph+1})" ${ph>=st.length-1?'disabled':''}>${L2('Weiter','Next')} ›</button><button class="btn sm ghost" onclick="A.lpOpen('${c.id}','${today()}')" title="Planung bearbeiten">✎</button></div>`};
A.phase=i=>{const c=cls();if(!c)return;const n=ablaufSteps(c).length;STG.phase=STG.phase||{};const key=c.id+'|'+today();STG.phase[key]=Math.max(0,Math.min(n-1,i));
  for(const k in STG.phase)if(!k.endsWith(today()))delete STG.phase[k];stgSave();render()};
GADGET.ha=c=>{if(!c)return needCls(c);const p=lpOf(c,today())||{},due=haDue(c,today());
  return`${p.ha?`<div class="hatext">${esc(p.ha).replace(/\n/g,'<br>')}</div>${p.due?`<p class="hadue">${L2('bis','due')} ${esc(new Date(p.due+'T12:00').toLocaleDateString(stLoc(),{weekday:'long',day:'numeric',month:stLang()==='en'?'long':'numeric'}))}</p>`:''}`:`<p class="muted">${L2('Für heute ist keine Hausaufgabe eingetragen.','No homework for today.')}</p>`}
  ${due.length?`<div class="hafall"><b>${L2('Heute fällig:','Due today:')}</b> ${due.map(x=>esc(x.ha)).join(' · ')}</div>`:''}
  <div class="row noprint"><button class="btn sm" onclick="A.lpOpen('${c.id}','${today()}')">${p.ha?'✎ Ändern':'＋ Hausaufgabe eintragen'}</button></div>`};
/* Timer: Digital, Ring (Fortschrittsring mit Zeit in der Mitte) oder Scheibe (flache Restzeit-Scheibe); Zeit durch Antippen ändern */
const TRC=2*Math.PI*86;
function tStyle(){const v=STG.tstyle||'digital';return v==='analog'?'disc':v==='both'?'ring':v}
function tRingSvg(){return`<svg class="tring" viewBox="0 0 200 200" aria-hidden="true"><circle class="trtrack" cx="100" cy="100" r="86"/><circle id="trarc" class="trarc" cx="100" cy="100" r="86" transform="rotate(-90 100 100)" stroke-dasharray="${TRC.toFixed(2)}" stroke-dashoffset="0"/></svg>`}
function tDiscSvg(){const d=[];for(let i=0;i<12;i++){const a=i*Math.PI/6;d.push(`<circle cx="${(100+93*Math.sin(a)).toFixed(1)}" cy="${(100-93*Math.cos(a)).toFixed(1)}" r="${i%3?1.6:2.8}"/>`)}
  return`<svg class="tdisc" viewBox="0 0 200 200" aria-hidden="true"><circle class="tdface" cx="100" cy="100" r="86"/><path id="tana" class="twedge" d=""/><g class="tddots">${d.join('')}</g><circle class="tdhub" cx="100" cy="100" r="9"/></svg>`}
function tAnaUpd(){const f=TM.total?Math.max(0,Math.min(1,TM.left/TM.total)):0;
  const arc=$('#trarc');if(arc)arc.setAttribute('stroke-dashoffset',(TRC*(1-f)).toFixed(2));
  const p=$('#tana');if(p){const a=f*2*Math.PI,r=86;if(f>=.9999)p.setAttribute('d','M100 14A86 86 0 1 1 99.99 14Z');else if(f<=0)p.setAttribute('d','');
    else{const x=100+r*Math.sin(a),y=100-r*Math.cos(a);p.setAttribute('d',`M100 100L100 14A86 86 0 ${a>Math.PI?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z`)}}
  const box=$('#timerbox');if(box){box.classList.toggle('tdone',TM.left<=0&&TM.total>0);box.classList.toggle('tlow',f>0&&f<=.15&&TM.total>0)}}
function tParse(v){v=String(v||'').trim().replace(',','.');if(!v)return 0;let m;
  if((m=v.match(/^(\d+):(\d{1,2})$/)))return(+m[1])*60+(+m[2]);if((m=v.match(/^(\d+(?:\.\d+)?)\s*(s|sek|sec)$/i)))return Math.round(+m[1]);
  if((m=v.match(/^(\d+(?:\.\d+)?)\s*(m|min)?$/i)))return Math.round(+m[1]*60);return 0}
A.tEdit=()=>{if(TM.running)return;TEDIT=true;render()};
A.tEditOk=v=>{const s=tParse(v);TEDIT=false;if(s>0)A.tSet(Math.min(s,600*60));render()};
GADGET.timer=()=>{const sty=tStyle(),tip='title="Antippen, um die Zeit zu ändern" onclick="A.tEdit()"';
  const disp=TEDIT?`<div class="tedit noprint"><input id="tedit" class="tdisp tdin" inputmode="decimal" value="${tfmt(TM.total)}" aria-label="Zeit eingeben (z. B. 5 oder 5:30)" onkeydown="if(event.key==='Enter')A.tEditOk(this.value);if(event.key==='Escape'){TEDIT=false;render()}" onblur="A.tEditOk(this.value)"><p class="hint center">Minuten (z. B. „5“) oder Minuten:Sekunden („2:30“), dann Enter</p></div>`
    :sty==='ring'?`<div class="tview"><div class="tringwrap" ${tip}>${tRingSvg()}<div class="tdisp tin" id="tdisp">${tfmt(TM.left)}</div></div></div>`
    :sty==='disc'?`<div class="tview"><div class="tanawrap" ${tip}>${tDiscSvg()}</div><div class="tdisp tsmall" id="tdisp" ${tip}>${tfmt(TM.left)}</div></div>`
    :`<div class="tview"><div class="tdisp" id="tdisp" ${tip}>${tfmt(TM.left)}</div></div><div class="tbar"><div id="tprog"></div></div>`;
  return`<div id="timerbox" class="gtimer t-${sty}">${disp}<div class="row center noprint tctl"><button class="btn primary" id="tbtn" onclick="A.tToggle()">${L2('Start','Start')}</button><button class="btn" onclick="A.tReset()" title="Zurücksetzen">↺</button></div></div>`};
GSETUP.timer=()=>{const sty=tStyle();
  return`<div class="gsrow"><b>Darstellung</b><div class="seg">${[['digital','Digital'],['ring','Ring'],['disc','Scheibe']].map(([k,l])=>`<button class="${sty===k?'on':''}" onclick="STG.tstyle='${k}';stgSave();render()">${l}</button>`).join('')}</div></div>
  <div class="gsrow"><b>Schnellwahl</b><div class="row">${[1,2,3,5,10,15,20,30,45].map(m=>`<button class="btn sm" onclick="A.tSet(${m*60});render()">${m} min</button>`).join('')}</div></div>
  <p class="hint" style="margin:0">Tipp: Auf die Zeit tippen, um sie direkt einzugeben. Am Ende ertönt ein Signal (Lautstärke am iPad hochdrehen).</p>`};
GADGET.uhr=()=>`<div class="stclock" id="stclock"></div><div class="muted center" id="stdate"></div>`;

A.mic=async()=>{if(MIC){micStop();render();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ctx=new(window.AudioContext||window.webkitAudioContext)();const an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(st).connect(an);
    MIC={st,ctx,an,buf:new Float32Array(an.fftSize),lvl:0,over:0,t:performance.now()};render();micLoop()}
  catch(e){toast('Kein Zugriff auf das Mikrofon – bitte im Browser erlauben')}};
function micLoop(){if(!MIC)return;const bar=$('#micbar');if(!bar){micStop();return}
  MIC.an.getFloatTimeDomainData(MIC.buf);let s=0;for(let i=0;i<MIC.buf.length;i++)s+=MIC.buf[i]*MIC.buf[i];
  const db=20*Math.log10(Math.sqrt(s/MIC.buf.length)+1e-7),lv=Math.max(0,Math.min(100,(db+62)*100/52));MIC.lvl=MIC.lvl*.85+lv*.15;
  const thr=STG.thr||65,now=performance.now(),dt=now-MIC.t;MIC.t=now;MIC.over=MIC.lvl>=thr?MIC.over+dt:Math.max(0,MIC.over-dt*2);
  bar.style.width=MIC.lvl.toFixed(1)+'%';bar.parentElement.style.setProperty('--mute',(100-MIC.lvl).toFixed(1)+'%');const z=MIC.lvl>=thr?'r':MIC.lvl>=thr*.75?'y':'g';bar.className='mz-'+z;
  const f=$('#micface');if(f)f.textContent=z==='r'?'😱':z==='y'?'😐':'🙂';const b=$('#micbox');if(b)b.classList.toggle('loud',MIC.over>1200);
  MIC.raf=requestAnimationFrame(micLoop)}
function micStop(){if(!MIC)return;cancelAnimationFrame(MIC.raf);try{MIC.st.getTracks().forEach(t=>t.stop())}catch(e){}try{MIC.ctx.close()}catch(e){}MIC=null}
