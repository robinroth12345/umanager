function sOut(ctx,len){const g=ctx.createGain();g.gain.value=STG.vol??.8;g.connect(ctx.destination);SNDG.push(g);setTimeout(()=>{SNDG=SNDG.filter(x=>x!==g)},(len+1)*1000);return g}
function nBuf(ctx,sec){const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*sec),ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function sNoise(ctx,out,t,dur,f,q,vol,type){if(!NB)NB=nBuf(ctx,1);if(!NB2)NB2=nBuf(ctx,4);const s=ctx.createBufferSource();s.buffer=dur>.45?NB2:NB;
  const fl=ctx.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q;const g=ctx.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl).connect(g).connect(out);s.start(t,dur>.45?0:Math.random()*.5);s.stop(t+dur+.05)}
function sTone(ctx,out,t,f,dur,type,vol,att,lp){const o=ctx.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f,t);const g=ctx.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.3,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let n=o;if(lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;n=o.connect(fl)}n.connect(g).connect(out);o.start(t);o.stop(t+dur+.05);return o}
const SYN={
  applaus(ctx,t){const out=sOut(ctx,4),D=3.2;for(let i=0;i<420;i++){const x=D*Math.pow(Math.random(),1.15),env=Math.min(1,x/.35)*Math.max(0,1-x/D)**.6;

  try{const rec={id:uid(),name:f.name.replace(/\.[^.]+$/,'').slice(0,28),type:f.type||'audio/mpeg',buf:await f.arrayBuffer(),t:Date.now()};const db=await sdb();
    const tx=db.transaction('snd','readwrite');tx.objectStore('snd').put(rec);tx.oncomplete=()=>{SNDS=SNDS||[];SNDS.push(rec);toast('Sound hinzugefügt');render()};tx.onerror=()=>toast('Speichern nicht möglich')}catch(e){toast('Speichern nicht möglich')}};

function deal(pool,mode,n){const k=Math.max(1,Math.min(pool.length,mode==='size'?Math.max(1,Math.round(pool.length/n)):n));const g=Array.from({length:k},()=>[]);pool.forEach((s,i)=>g[i%k].push(s));return g}
A.groups=()=>{const c=cls();const pool=shuffle(c.students.filter(s=>!(GOPT.skip&&isAbsentToday(c,s.id))));if(!pool.length)return toast('Keine SuS verfügbar');
  const nm=s=>sfull(s);let out=[],warn='';const unk=pool.filter(s=>!s.g).length;
  if(GOPT.sex==='sep'){
    const parts=[['w','Mädchen'],['m','Jungen'],['d','divers'],['','ohne Angabe']];
    parts.forEach(([g,l])=>{const p=pool.filter(s=>(s.g||'')===g);if(p.length)deal(p,GOPT.mode,GOPT.n).forEach(x=>out.push({label:l,list:x.map(nm)}))});
  }else if(GOPT.sex==='mix'){
    const order=[...pool.filter(s=>s.g==='w'),...pool.filter(s=>s.g==='m'),...pool.filter(s=>s.g!=='w'&&s.g!=='m')];

const TM={total:300,left:300,running:false,end:0,iv:null};let AC=null;
function tTimer(){return`<section class="card tool" id="timerbox"><div class="tdisp" id="tdisp">05:00</div><div class="tbar"><div id="tprog"></div></div>
  <div class="row center">${[1,2,3,5,10,15,20,30,45].map(m=>`<button class="btn sm" onclick="A.tSet(${m*60})">${m} min</button>`).join('')}</div>

  <div class="row center"><button class="btn primary lg" id="tbtn" onclick="A.tToggle()">Start</button><button class="btn lg" onclick="A.tReset()">Zurücksetzen</button><button class="btn lg" onclick="A.tFull()">Vollbild</button></div></section>`}
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume()}catch(e){}}
function ring(){if(!AC)return;const t=AC.currentTime;for(let i=0;i<4;i++){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=i%2?660:880;g.gain.setValueAtTime(.0001,t+i*.32);g.gain.exponentialRampToValueAtTime(.3,t+i*.32+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.32+.28);o.connect(g).connect(AC.destination);o.start(t+i*.32);o.stop(t+i*.32+.3)}}
function tfmt(sec){const s=Math.ceil(sec);return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function updT(){const el=$('#tdisp');if(el){el.textContent=tfmt(TM.left);el.classList.toggle('done',TM.left<=0)}const p=$('#tprog');if(p)p.style.width=(TM.total?TM.left/TM.total*100:0)+'%';const b=$('#tbtn');if(b)b.textContent=TM.running?'Pause':(TM.left<TM.total&&TM.left>0?L2('Weiter','Resume'):'Start');try{tAnaUpd()}catch(e){}updMini()}
function updMini(){const m=$('#mini');if(!m)return;const show=TM.running&&!(S.ui.view==='tools'&&stageList().includes('timer'));m.style.display=show?'inline-block':'none';if(show)m.textContent='⏱ '+tfmt(TM.left)}
function tick(){TM.left=Math.max(0,(TM.end-Date.now())/1000);if(TM.left<=0){TM.running=false;clearInterval(TM.iv);ring();toast('Die Zeit ist um!')}updT()}
A.tSet=sec=>{clearInterval(TM.iv);TM.running=false;TM.total=TM.left=sec;updT()};
A.tCustom=()=>{const s=(+$('#tmin').value||0)*60+(+$('#tsec').value||0);if(s>0)A.tSet(s)};
A.tToggle=()=>{unlockAudio();if(TM.running){TM.left=Math.max(0,(TM.end-Date.now())/1000);TM.running=false;clearInterval(TM.iv)}else{if(TM.left<=0)TM.left=TM.total;TM.end=Date.now()+TM.left*1000;TM.running=true;clearInterval(TM.iv);TM.iv=setInterval(tick,200)}updT()};

/* ================= Stundenplan ================= */
function parseTime(t){const m=String(t||'').trim().match(/^(\d{1,2})[:.](\d{2})$/);return m?+m[1]*60+ +m[2]:null}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekAB(date){const ref=S.settings.abRef;if(!ref)return'';const w=Math.round((mondayOf(date)-mondayOf(dateOf(ref)))/(7*864e5));return Math.abs(w)%2===0?'A':'B'}
function hjOf(date){return S.settings.hj2&&iso(date)>=S.settings.hj2?'2':'1'}
function entryActive(e,date){const wk=weekAB(date);return(!e.wk||!wk||e.wk===wk)&&(!e.hj||e.hj===hjOf(date))}
function slotAll(d,i){return S.timetable.cells[`${d}-${i}`]||[]}
function periodNo(i){return i+1} /* Pausenzeilen zählen mit: die Mittagspause ersetzt die 7. Stunde, danach geht es mit der 8. weiter */
function entryKey(e){return JSON.stringify([e.g||'',e.t||'',e.room||'',e.wk||'',e.hj||''])}
function dayLessons(date){
  const d=date.getDay()-1,P=S.timetable.periods,out=[];if(d<0||d>4||freeDay(iso(date)))return out;
  P.forEach((p,i)=>{if(p.brk)return;slotAll(d,i).filter(e=>entryActive(e,date)).forEach(e=>{const k=entryKey(e);
    const prev=out.find(o=>o.key===k&&o.i1===i-1);if(prev){prev.i1=i;prev.n1=periodNo(i);prev.e2=p.e}else out.push({key:k,e,i0:i,i1:i,n0:periodNo(i),n1:periodNo(i),s:p.s,e2:p.e})})});
  return out.sort((a,b)=>a.i0-b.i0);
}
function currentLesson(){
  const now=new Date(),d=now.getDay()-1;if(d<0||d>4||freeDay(today()))return null;const min=now.getHours()*60+now.getMinutes();
  const P=S.timetable.periods;let best=null;
  for(let i=0;i<P.length;i++){const p=P[i];if(p.brk)continue;const st=parseTime(p.s);if(st==null)continue;const en=parseTime(p.e)??st+(+S.settings.lessonMin||45);
    if(min>=st-5&&min<en){const e=slotAll(d,i).find(x=>x.g&&entryActive(x,now)&&S.classes.some(k=>k.id===x.g));
      if(e&&(!best||st<=min)){const c=S.classes.find(k=>k.id===e.g);best={i,c,room:e.room||'',key:today()+'#'+c.id};if(st<=min)break}}}
  return best;
}
let AUTOKEY=null;

  if($('#modal').classList.contains('open'))return;const ae=document.activeElement;if(ae&&ae.matches&&ae.matches('input,textarea,select'))return;

  toast(`${periodNo(L.i)}. Stunde: ${cname(L.c)} – Sitzplan geöffnet`);

function entryHtml(e,date,h){

  const tags=[e.wk?e.wk+'-Woche':'',e.hj?e.hj+'. Hj.':''].filter(Boolean).join(' · ');

function planEdit(){

  if(empty)h+=`<div class="lstat">Der Stundenplan ist noch leer. Tippe auf ein Feld, um eine Stunde einzutragen – oder importiere eine Stundenplan-Datei (legt fehlende Lerngruppen automatisch an).</div>`;

  const covered={};
  P.forEach((p,i)=>{
    if(p.brk){h+=`<tr class="brk"><th class="time" onclick="A.ttPeriod(${i})">${esc(p.s)}–${esc(p.e)}</th><td colspan="5">${esc(p.brk)}</td></tr>`;return}

    for(let d=0;d<5;d++){if(covered[`${d}-${i}`])continue;const L=slotAll(d,i);let span=1;
      if(L.length){const k=JSON.stringify(L.map(entryKey));while(P[i+span]&&!P[i+span].brk&&JSON.stringify(slotAll(d,i+span).map(entryKey))===k){covered[`${d}-${i+span}`]=1;span++}}
      const isNow=cur&&d===dow&&cur.i>=i&&cur.i<i+span&&L.some(e=>e.g===cur.c.id);
      const hh=Math.max(36,(span*52-8)/Math.max(1,L.length)-(L.length>1?3:0));
      h+=`<td class="slot ${d===dow?'today':''} ${isNow?'now':''}" ${span>1?`rowspan="${span}"`:''} onclick="A.ttEdit(${d},${i},${span})"><div class="stack">${L.map(e=>entryHtml(e,dates[d],hh)).join('')}</div></td>`}

/* ================= Stoffverteilungspläne ================= */
/* Plan: {id,name,subject,grade,start,topics:[{id,title,dur,unit:'w'|'h',fix,note}]} · Lerngruppe: c.plan={id,ist,shifts:{topicId:Schultage}} */
const PCOLS=['#8fb3e0','#9fd0a8','#f2c48d','#c9b3e6','#f0a8a8','#a8d8d8','#e6d58f','#c4c4c4'];
function yearRange(){return{from:S.settings.yearStart||'2026-09-14',to:S.settings.yearEnd||'2027-07-28'}}
function planOf(c){return c&&c.plan&&S.plans.find(p=>p.id===c.plan.id)||null}
function planClasses(p){return S.classes.filter(c=>c.plan&&c.plan.id===p.id)}
function durLabel(t){const n=String(+t.dur||0).replace('.',',');return t.unit==='h'?n+' Std':n+(+t.dur===1?' Woche':' Wochen')}
let SCHEDC=new Map();
function schoolDays(from,to,c){const out=[];for(let d=from;d<=to;d=addDays(d,1)){const w=dateOf(d).getDay();if(w===0||w===6)continue;const free=!!freeDay(d);
  out.push({d,free,h:c&&!free?dayLessons(dateOf(d)).filter(l=>l.e.g===c.id).reduce((a,l)=>a+l.n1-l.n0+1,0):0})}return out}
/* Themen nacheinander auf die Schultage verteilen: Wochen = Schultage ohne Ferien, Stunden = Unterrichtsstunden laut Stundenplan */
function planSchedule(p,c){const Y=yearRange(),start=p.start||Y.from,key=p.id+'|'+(c?c.id:'')+'|'+start+Y.to+JSON.stringify(p.topics)+JSON.stringify(c&&c.plan&&c.plan.shifts||{});
  if(SCHEDC.has(key))return SCHEDC.get(key);
  const days=schoolDays(start,Y.to,c),hasH=days.some(x=>x.h>0),shifts=(c&&c.plan&&c.plan.shifts)||{};let i=0;const out=[];
  p.topics.forEach(t=>{const o={t,s:null,e:null,gap:null,late:0,over:false,approx:false};
    if(t.fix){const fi=days.findIndex(x=>x.d>=t.fix);if(fi>i){o.gap={s:days[i]?days[i].d:null,e:days[fi-1].d,kind:'Puffer'};i=fi}else if(fi>=0&&fi<i)o.late=days.slice(fi,i).filter(x=>!x.free).length}
    let sh=+shifts[t.id]||0;if(sh>0){const g0=i;while(sh>0&&i<days.length){if(!days[i].free)sh--;i++}if(i>g0){o.gap={s:days[g0].d,e:days[i-1].d,kind:'Verzug'};const pr=out[out.length-1];if(pr&&pr.e)pr.xe=days[i-1].d}}
    const useH=t.unit==='h'&&hasH;let need=t.unit==='h'?(useH?+t.dur||0:(+t.dur||0)/3*5):(+t.dur||0)*5;o.approx=t.unit==='h'&&!useH;
    while(need>1e-9&&i<days.length){const x=days[i],cap=x.free?0:(useH?x.h:1);if(cap>0){if(!o.s)o.s=x.d;o.e=x.d;need-=cap}i++}
    o.over=need>1e-9;out.push(o)});
  const res={start,end:Y.to,topics:out,days};SCHEDC.set(key,res);return res}
function teachDays(a,b){let n=0;for(let d=addDays(a,1);d<b;d=addDays(d,1)){const w=dateOf(d).getDay();if(w&&w<6&&!freeDay(d))n++}return n}
function planStatus(c){const p=planOf(c);if(!p)return null;const sc=planSchedule(p,c),t0=today(),T=sc.topics;
  const XE=x=>x.xe||x.e,soll=T.find(x=>x.s&&x.s<=t0&&XE(x)>=t0)||null,next=T.find(x=>x.s&&x.s>t0)||null,ist=c.plan.ist?T.find(x=>x.t.id===c.plan.ist):null;
  let delta=null;if(ist&&ist.s){if(t0>XE(ist))delta=Math.round(teachDays(XE(ist),t0)/5*2)/2;else if(t0<ist.s)delta=-Math.round((teachDays(t0,ist.s)+1)/5*2)/2;else delta=0}
  let wk='';if(soll){const tot=Math.max(1,Math.ceil((teachDays(addDays(soll.s,-1),addDays(XE(soll),1)))/5)),done=Math.min(tot,Math.floor(teachDays(addDays(soll.s,-1),t0)/5)+1);wk=`Woche ${done} von ${tot}`}
  return{p,sc,soll,next,ist,delta,wk,done:!soll&&!next&&T.length&&T[T.length-1].e&&T[T.length-1].e<t0}}
function statusPill(st){if(!st||st.delta==null)return`<span class="ppill">Stand nicht gesetzt</span>`;const d=st.delta,f=n=>String(Math.abs(n)).replace('.',',');
  if(d===0)return`<span class="ppill ok">im Plan</span>`;if(d<0)return`<span class="ppill ok">${f(d)} Wo. voraus</span>`;return`<span class="ppill ${d<=1?'warn':'bad'}">${f(d)} Wo. hinterher</span>`}
/* Zeitleiste über das Schuljahr */
function planBarHtml(p,c,st){const sc=planSchedule(p,c),S0=dateOf(sc.start).getTime(),tot=Math.max(1,dateOf(sc.end).getTime()-S0),pos=d=>Math.max(0,Math.min(100,(dateOf(d).getTime()-S0)/tot*100));
  let h='<div class="pbar">';
  let run=null;sc.days.forEach((x,k)=>{if(x.free){if(!run)run={s:x.d};run.e=x.d}if((!x.free||k===sc.days.length-1)&&run){h+=`<div class="phol" style="left:${pos(run.s)}%;width:${Math.max(.3,pos(addDays(run.e,1))-pos(run.s))}%" title="unterrichtsfrei ${fmtShort(run.s)}–${fmtShort(run.e)}"></div>`;run=null}});
  sc.topics.forEach((x,k)=>{if(x.gap&&x.gap.s)h+=`<div class="pgap" style="left:${pos(x.gap.s)}%;width:${pos(addDays(x.gap.e,1))-pos(x.gap.s)}%" title="${x.gap.kind==='Verzug'?'verlängert (Verzug)':x.gap.kind}"></div>`;if(!x.s)return;
    const l=pos(x.s),w=Math.max(.6,pos(addDays(x.e,1))-l),cur=st&&st.soll===x,ist=st&&st.ist===x;
    h+=`<div class="pseg ${cur?'cur':''} ${ist?'ist':''} ${x.over?'over':''}" style="left:${l}%;width:${w}%;--pc:${PCOLS[k%PCOLS.length]}" title="${esc(x.t.title)} · ${fmtShort(x.s)}–${fmtShort(x.e)} · ${durLabel(x.t)}${x.late?' · beginnt laut Plan zu spät':''}">${w>7?`<span>${esc(x.t.title)}</span>`:''}</div>`});
  if(c)(c.gfs||[]).forEach(g=>{const w=gfsWhen(c,g);if(!w||w.d<sc.start||w.d>sc.end)return;const s=c.students.find(x=>x.id===g.sid)||{};
    h+=`<div class="pgfs ${w.fix?'':'est'} ${g.grade?'done':''}" style="left:${pos(w.d)}%" title="${PRIV?'GFS':'GFS '+esc(sfull(s))+(g.topic?': '+esc(g.topic):'')} · ${w.fix?fmtDate(w.d):'≈ '+fmtDate(w.d)+' (geschätzt)'}" ${PRIV?'':`onclick="event.stopPropagation();A.gfsEdit('${c.id}','${g.id}')"`}>🎤</div>`});
  if(c)kaList(c).forEach(e=>{if(e.date<sc.start||e.date>sc.end)return;const done=kaHasGrades(e);
    h+=`<div class="pka ${done?'done':''} ${!done&&e.date>=today()&&gfsDays(e.date)<=7?'soon':''}" style="left:${pos(e.date)}%" title="${esc(e.title||'Schriftlich')} · ${fmtDate(e.date)}${done?' · benotet':' · '+kaIn(e.date)}" onclick="event.stopPropagation();A.kaEdit('${c.id}','${e.id}')">📝</div>`});
  const t0=today();if(t0>=sc.start&&t0<=sc.end)h+=`<div class="ptoday" style="left:${pos(t0)}%" title="heute"></div>`;
  if(st&&st.ist&&st.ist.s){const mid=(pos(st.ist.s)+pos(addDays(st.ist.e,1)))/2;h+=`<div class="pist" style="left:${mid}%" title="Dein Stand: ${esc(st.ist.t.title)}">▲</div>`}
  h+='</div><div class="pmonths">';const m0=dateOf(sc.start);for(let m=new Date(m0.getFullYear(),m0.getMonth()+1,1,12);iso(m)<=sc.end;m.setMonth(m.getMonth()+1))h+=`<span style="left:${pos(iso(m))}%">${MON[m.getMonth()].slice(0,3)}</span>`;
  return h+'</div>'}
function planStrip(c,compact,hideBtn){if(!feat('stoff'))return'';const st=planStatus(c);if(!st)return'';const{p,soll,next}=st;
  const txt=soll?`Laut Plan: <b>${esc(soll.t.title)}</b> · ${st.wk}${next?` · ab ${fmtShort(next.s)}: ${esc(next.t.title)}`:''}`:next?`Laut Plan als Nächstes ab ${fmtShort(next.s)}: <b>${esc(next.t.title)}</b>`:st.done?'Plan abgeschlossen':'Kein Thema im Zeitraum';

/* ===== GFS (gleichwertige Feststellung von Schülerleistungen) – ab 2026-10-10h =====
   c.gfs=[{id,sid,tid,area,topic,date,note,grade,ack{w4,w2}}]; je Schüler eine GFS im Schuljahr (auch über Fächer hinweg, Abgleich über den Namen).
   Notenspalte „GFS“ (e.gfs=true) entsteht mit der ersten Buchung und verschwindet mit der letzten; Sport: Bereich Praxis, Gewichtung von Hand. */
function gfsWhen(c,g){if(g.date)return{d:g.date,fix:true};const p=g.tid&&planOf(c);if(p){const x=planSchedule(p,c).topics.find(o=>o.t.id===g.tid);if(x&&x.s)return{d:x.s,fix:false}}return null}
function gfsDays(d){return Math.round((dateOf(d)-dateOf(today()))/864e5)}
function gfsCol(c){return c.entries.find(e=>e.gfs)||null}
function gfsSync(c){c.gfs=c.gfs||[];let e=gfsCol(c),fresh=false;
  if(!c.gfs.length){if(e)c.entries=c.entries.filter(x=>x!==e);return false}
  if(!e){e={id:uid(),type:isSport(c)?'p':'s',weight:1,grades:{},gfs:true};c.entries.push(e);fresh=true}
  e.title=e.title||'GFS';e.grades={};c.gfs.forEach(g=>{if(g.grade)e.grades[g.sid]=g.grade});
  const ds=c.gfs.map(g=>g.date).filter(Boolean).sort();e.date=ds.length?ds[ds.length-1]:'';return fresh}
function sameName(a,b){const n=x=>(String(x.first||'')+' '+String(x.last||'')).trim().toLowerCase();return n(a)&&n(a)===n(b)}
function gfsElsewhere(c,s,gid){for(const k of S.classes){for(const g of (k.gfs||[])){if(g.id===gid)continue;const t=k.students.find(x=>x.id===g.sid);if(t&&(k===c?t.id===s.id:sameName(t,s)))return{k,g}}}return null}
/* Meldungen: ca. 4 Wochen (≤ 28 Tage) und ca. 2 Wochen (≤ 14 Tage) vorher; danach Erinnerung an die Note */
function gfsAlerts(onlyC){const out=[];S.classes.forEach(c=>{if(onlyC&&c!==onlyC)return;(c.gfs||[]).forEach(g=>{const w=gfsWhen(c,g);if(!w)return;const n=gfsDays(w.d),a=g.ack||{};
  if(n<0){if(!g.grade&&w.fix)out.push({c,g,w,n,k:'note'});return}
  if(n<=14&&!a.w2)out.push({c,g,w,n,k:'w2'});else if(n<=28&&n>14&&!a.w4)out.push({c,g,w,n,k:'w4'})})});return out.sort((x,y)=>x.n-y.n)}
function gfsAlertHtml(L){if(!L.length)return'';return L.map(({c,g,w,n,k})=>{const s=c.students.find(x=>x.id===g.sid)||{},nm=PRIV?'Ein Schüler':esc(sfull(s));
  const when=n===0?'heute':n<0?`am ${fmtDate(w.d)}`:n<=13?`in ${n} ${n===1?'Tag':'Tagen'}`:`in ca. ${Math.round(n/7)} Wochen`;
  const msg=k==='note'?`<b>${nm}</b> (${esc(cname(c))}) hat die GFS ${when} gehalten – Note noch nicht eingetragen.`:`<b>${nm}</b> (${esc(cname(c))}): GFS ${when}${w.fix?' ('+fmtDate(w.d)+')':' – geschätzt nach Stoffplan, noch kein fester Termin'}${PRIV?'':' · '+esc(g.topic||g.area||'Thema offen')}. ${w.fix?'Vorbesprechung eingeplant?':'Bitte Termin vereinbaren und Vorbesprechung einplanen.'}`;
  return`<div class="lstat gfsal ${k}">🎤 <span>${msg}</span><span class="row" style="margin-left:auto">${PRIV?'':`<button class="btn sm" onclick="A.gfsEdit('${c.id}','${g.id}')">${k==='note'?'Note eintragen':'Öffnen'}</button>`}${k!=='note'?`<button class="btn sm ghost" onclick="A.gfsAck('${c.id}','${g.id}','${k}')">✓ erledigt</button>`:''}</span></div>`}).join('')}
A.gfsAck=(cid,gid,k)=>{const c=S.classes.find(x=>x.id===cid),g=(c.gfs||[]).find(x=>x.id===gid);if(!g)return;g.ack=g.ack||{};g.ack[k]=true;if(k==='w2')g.ack.w4=true;save();render()};

/* ---- Word (.docx): Vorlage erzeugen, ausgefüllten Plan exportieren, einlesen ---- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(([name,txt])=>{const nb=enc.encode(name),data=enc.encode(txt),crc=crc32(data),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer),nb,data);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+data.length});
  const cdl=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdl,true);e.setUint32(16,off,true);

function rrDates(st,rule,untilCap,cb){const R={};rule.split(';').forEach(p=>{const[k,v]=p.split('=');if(k&&v)R[k.toUpperCase()]=v.toUpperCase()});

  raw.forEach(r=>{if(r['RECURRENCE-ID']){const w=icsDT(r['RECURRENCE-ID'][0]);if(w)(over[v(r,'UID')]=over[v(r,'UID')]||new Set()).add(wKey(w))}});
  raw.forEach(r=>{if(String(v(r,'STATUS')).toUpperCase()==='CANCELLED')return;const st=r.DTSTART&&icsDT(r.DTSTART[0]);if(!st)return;

    const ex=new Set(over[v(r,'UID')]&&!r['RECURRENCE-ID']?over[v(r,'UID')]:[]);
    (r.EXDATE||[]).forEach(p=>String(p.val).split(',').forEach(x=>{const w=icsDT({val:x,params:p.params},st.tz);if(w)ex.add(w.allday&&!st.allday?isoW(w):wKey({...w,allday:st.allday}))}));

    const emit=w=>{const k=wKey(w);if(ex.has(k)||(!st.allday&&ex.has(k.slice(0,10))))return;

async function decryptData(o,pw){const key=await deriveKey(pw,unb64(o.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct));return JSON.parse(new TextDecoder().decode(pt))}
function plainWrap(){return{app:'lehrerpult',v:1,enc:false,created:new Date().toISOString(),data:S}}

  const name=`lehrerpult-sicherung-${today()}${pw?'-verschluesselt':''}.json`;

const SKEY='lehrerpult.sync',NKEY='lehrerpult.notfall',SFILE='lehrerpult-sync.json';

const SYNC={state:'off',msg:'',busy:false,again:false,conflict:false};

/* iCloud Drive: am PC (Chrome/Edge) automatisch über eine Datei im iCloud-Ordner, am iPad per Laden/Speichern über die Dateien-App */

const CLOUDS={icloud:['iCloud','iCloud Drive','am Mac ist iCloud Drive im Finder; am Windows-PC die App „iCloud für Windows“'],onedrive:['OneDrive','OneDrive','am Mac und Windows-PC die OneDrive-App; am iPad die OneDrive-App, damit OneDrive in „Dateien“ erscheint'],gdrive:['Google Drive','Google Drive','am Mac und Windows-PC „Google Drive für Desktop“; am iPad die Google-Drive-App'],nextcloud:['Nextcloud','Nextcloud','am Mac und Windows-PC das Nextcloud-Programm („Desktop-Client“); am iPad die Nextcloud-App'],other:['Cloud','Cloud-Ordner','die Cloud muss als Ordner im Finder bzw. Explorer und am iPad in „Dateien“ erscheinen']};

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('lehrerpult',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

/* Verschlüsselung mit zwischengespeichertem Schlüssel (schnell genug für Sync alle paar Sekunden) */
const KC={};let SESSION_SALT=null;

async function buildEnv(rev){
  const base={app:'lehrerpult',v:2,rev,hist:(SC.hist||[]).slice(-300),updated:S.updated||Date.now(),device:deviceName(),created:new Date().toISOString()};
  if(!SC.pw)return{...base,enc:false,data:S};
  if(!SESSION_SALT)SESSION_SALT=b64(crypto.getRandomValues(new Uint8Array(16)));
  const key=await getKey(SC.pw,SESSION_SALT),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(S)));
  return{...base,enc:true,salt:SESSION_SALT,iv:b64(iv),ct:b64(ct)};
}
async function openEnv(text){
  let env;try{env=JSON.parse(text)}catch(e){throw new Error('Die Datei in der Cloud ist beschädigt')}
  if(env.enc){if(!SC.pw)throw new Error('Die Cloud-Daten sind verschlüsselt – bitte das Sync-Passwort eintragen');
    try{const key=await getKey(SC.pw,env.salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.ct));return{env,data:JSON.parse(new TextDecoder().decode(pt))}}
    catch(e){throw new Error('Falsches Sync-Passwort – die Cloud-Daten lassen sich nicht entschlüsseln')}}
  if(env.data)return{env,data:env.data};if(Array.isArray(env.classes))return{env:{},data:env};
  throw new Error('Unbekanntes Format der Cloud-Datei');
}

/* Anbieter */
function cErr(msg,auth){const e=new Error(msg);e.auth=!!auth;return e}
const PROV={
  pcloud:{
    cred(){return SC.pc.token?{access_token:SC.pc.token}:{auth:SC.pc.auth}},
    async call(m,p){const r=await fetch(`https://${SC.pc.host}/${m}`,{method:'POST',referrerPolicy:'no-referrer',credentials:'omit',body:new URLSearchParams({...p,...this.cred()})});return r.json()},
    err(j){return cErr('pCloud: '+(j.error||'Fehler '+j.result),[1000,2000,2094,2095].includes(j.result))},
    fpath(){return SC.folder+'/'+SFILE},
    async version(){const j=await this.call('stat',{path:this.fpath()});if(j.result===0)return String(j.metadata.hash);if([2002,2005,2009].includes(j.result))return null;throw this.err(j)},
    async read(){const j=await this.call('getfilelink',{path:this.fpath(),forcedownload:1});if(j.result!==0){if([2002,2005,2009].includes(j.result))return null;throw this.err(j)}
      let r;try{r=await fetch('https://'+j.hosts[0]+j.path,{referrerPolicy:'no-referrer',credentials:'omit',cache:'no-store'})}catch(e){throw cErr('pCloud lässt das Herunterladen der Datei aus dem Browser nicht zu')}
      if(!r.ok)throw cErr('Herunterladen von pCloud fehlgeschlagen ('+r.status+')');return r.text()},
    async write(text){let j=await this.call('createfolderifnotexists',{path:SC.folder});if(j.result!==0)throw this.err(j);

      const r=await fetch(`https://${SC.pc.host}/uploadfile?`+new URLSearchParams({...this.cred(),path:SC.folder,filename:SFILE,nopartial:1}),{method:'POST',referrerPolicy:'no-referrer',credentials:'omit',body:fd});
      j=await r.json();if(j.result!==0)throw this.err(j);return String(j.metadata[0].hash)}
  },
  nc:{

  }

/* Verlauf (ab 2026-10-18h): bis zu 20 frühere Stände in IndexedDB 'lehrerpult-verlauf' (nur dieses Gerät) – vor jedem Laden/Zusammenführen und einmal täglich */

/* Enthält der fremde Stand unseren letzten eigenen/geladenen Stand? Unbekannt (z. B. direkt nach einem Update) → NEIN, dann wird zusammengeführt statt blind übernommen (Fix 18k) */

async function syncNow(){
  if(!syncActive()||SYNC.conflict)return;if(SYNC.busy){SYNC.again=true;return}
  if(SC.prov==='icloud'){if(icManual()){updSyncUI();return}if(!FH)return;try{if((await FH.queryPermission({mode:'readwrite'}))!=='granted'){setSync('paused','Der Browser braucht deine Erlaubnis für die '+CN()+'-Datei.');return}}catch(e){}}
  SYNC.busy=true;setSync('busy');
  try{
    const P=PROV[SC.prov],ver=await P.version();
    if(ver!=null&&ver!==SC.lastVer){
      const {env,data}=await openEnv(await remoteText(P,ver));
      if(!SC.dirty&&!isDesc(env)){SYNC.busy=false;autoMerge(data,env,ver);return}
      if(!SC.dirty){vSave('Vor dem Laden: Stand von '+deviceName(),clone(S));applyRemote(data,env);SC.lastVer=ver;SC.hist=histAdd(env.hist,env.rev);if(env.rev)setBase(env.rev,data);SC.lastSync=Date.now();saveSC();setSync('ok');toast(`Neuere Daten ${env.device?'vom '+env.device:'aus der Cloud'} geladen`)}
      else{SYNC.busy=false;if(!quietMerge(data,env,ver))showConflict(data,env,ver);return}
    }else if(SC.dirty||ver==null){
      const stamp=S.updated,rev=uid(),snap=JSON.stringify(S),text=JSON.stringify(await buildEnv(rev));
      SC.lastVer=await P.write(text,rev);SC.myRev=rev;SC.hist=histAdd(SC.hist,rev);setBase(rev,snap);if(S.updated===stamp)SC.dirty=false;else SYNC.again=true;
      SC.lastSync=SC.lastWrite=Date.now();S.settings.lastBackup=SC.lastSync;S.settings.lastBackupKind='cloud';persist();saveSC();setSync('ok');
    }else{SC.lastSync=Date.now();saveSC();setSync('ok')}
  }catch(e){console.warn(e);
    if(!navigator.onLine)setSync('offline');
    else if(e instanceof TypeError)setSync('error','Die Cloud ist nicht erreichbar (keine Verbindung oder vom Anbieter blockiert).');
    else setSync('error',e.message)}
  SYNC.busy=false;if(SYNC.again){SYNC.again=false;clearTimeout(PUSHT);PUSHT=setTimeout(syncNow,1500)}
}
function showConflict(data,env,ver){
  SYNC.conflict=true;setSync('conflict','Änderungen auf zwei Geräten');
  const when=env.updated?new Date(env.updated).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'',other=env.device||'';
  modal('Änderungen auf zwei Geräten',`<p>Seit dem letzten Abgleich wurde sowohl <b>hier (${esc(deviceName())})</b> als auch <b>${other?'am '+esc(other):'auf einem anderen Gerät'}</b>${when?' (zuletzt '+when+')':''} etwas geändert – z. B. weil vor dem Arbeiten nicht der neueste Stand geladen wurde.</p>
   <p><b>Empfohlen: Zusammenführen.</b> Noten, Bewertungen, Einträge und Termine von <b>beiden</b> Geräten werden kombiniert – nichts muss von Hand übertragen werden.</p>${mergePrefHtml(other,(env.updated||0)>(S.updated||0))}
   <details><summary>Oder nur einen Stand behalten …</summary><p class="muted" style="margin:0 0 8px">Der andere Stand wird als Notfall-Kopie aufbewahrt.</p><div class="row"><button class="btn sm" onclick="A._mb(0)">Nur Stand ${other?'vom '+esc(other):'aus der Cloud'}</button><button class="btn sm" onclick="A._mb(1)">Nur Stand von ${esc(deviceName())}</button></div></details>`,
  [{label:'Cloud-Stand übernehmen',cls:'mhide',fn:()=>{keepCopy(clone(S),'Konflikt: Stand dieses Geräts');SYNC.conflict=false;applyRemote(data,env);SC.lastVer=ver;SC.hist=histAdd(env.hist,env.rev);if(env.rev)setBase(env.rev,data);SC.dirty=false;SC.lastSync=Date.now();saveSC();setSync('ok');toast('Cloud-Stand übernommen')}},
   {label:'Stand von diesem Gerät',cls:'mhide',fn:()=>{keepCopy(data,'Konflikt: Cloud-Stand');SYNC.conflict=false;SC.lastVer=ver;SC.hist=histAdd(SC.hist,env.hist,env.rev);SC.dirty=true;saveSC();if(icManual()){updSyncUI();setTimeout(A.icSave,50)}else syncNow()}},
   {label:'Später',fn:()=>{}},

/* Automatisch zusammenführen, wenn hier nichts Ungespeichertes ist, der fremde Stand aber unseren letzten Stand nicht enthält
   (z. B. Datei am iPad als Kopie statt „Ersetzen“ gesichert, oder Geräte abwechselnd ohne Abgleich benutzt). */
function autoMerge(data,env,ver){const pref=(env.updated||0)>(S.updated||0)?'r':'l';
  keepCopy(clone(S),'Vor dem automatischen Zusammenführen: Stand von '+deviceName());
  let m;try{m=mergeStates(S,data,env,pref)}catch(e){console.error(e);showConflict(data,env,ver);return}
  applyMerged(m);if(env.rev)SC.myRev=env.rev;SC.hist=histAdd(SC.hist,env.hist,env.rev);if(env.rev)setBase(env.rev,data);SC.lastVer=ver;SC.dirty=true;SC.lastSync=Date.now();saveSC();setSync('ok');render();
  toast(`Stand ${env.device?'vom '+env.device:'aus der Cloud'} mit diesem Gerät zusammengeführt – nichts verworfen`);
  if(icManual())updSyncUI();else syncNow()}
/* Leises Zusammenführen (ab 2026-10-18i): beide Geräte haben Änderungen, aber keine Stelle wurde auf beiden verschieden geändert →
   ohne Dialog kombinieren (nichts geht verloren). Nur bei echten Widersprüchen erscheint der Dialog. */
function quietMerge(data,env,ver){let m;try{m=mergeStates(S,data,env,'l')}catch(e){console.error(e);return false}
  if(m.conflicts>0)return false;
  keepCopy(clone(S),'Vor dem Zusammenführen: Stand von '+deviceName());
  applyMerged(m);if(env&&env.rev)SC.myRev=env.rev;SC.hist=histAdd(SC.hist,env.hist,env.rev);if(env.rev)setBase(env.rev,data);SC.lastVer=ver;SC.dirty=true;SC.lastSync=Date.now();saveSC();SYNC.conflict=false;setSync('ok');render();
  toast(`Änderungen ${env.device?'vom '+env.device:'aus der Cloud'} übernommen – beide Stände kombiniert`);
  if(icManual())updSyncUI();else syncNow();return true}
function doMerge(data,env,ver,pref){
  keepCopy(clone(S),'Vor dem Zusammenführen: Stand von '+deviceName());
  let m;try{m=mergeStates(S,data,env,pref)}catch(e){console.error(e);toast('Zusammenführen fehlgeschlagen: '+e.message);return}
  applyMerged(m);if(env&&env.rev)SC.myRev=env.rev;SC.hist=histAdd(SC.hist,env.hist,env.rev);if(env.rev)setBase(env.rev,data);SC.lastVer=ver;SC.dirty=true;SC.lastSync=Date.now();saveSC();SYNC.conflict=false;setSync('ok');render();
  if(icManual()){updSyncUI();mergeReport(m,env.device,{label:'Jetzt in '+CN()+' speichern …',fn:()=>{setTimeout(A.icSave,50)}})}
  else{mergeReport(m,env.device);syncNow()}
}
/* ===== Zusammenführen (ab 2026-10-16a): zwei Stände (dieses Gerät + Cloud/Datei) kombinieren statt einen zu verwerfen =====
   Drei-Wege-Abgleich mit dem letzten gemeinsamen Stand (lehrerpult.base): was nur auf einer Seite geändert wurde, wird übernommen –
   auch Löschungen. Ohne gemeinsamen Stand (alte Datei, Sicherung) wird nur ergänzt, nie gelöscht. Echte Widersprüche
   (dieselbe Stelle auf beiden Geräten verschieden geändert) entscheidet die gewählte Seite. */
const BKEY='lehrerpult.base';
function setBase(rev,obj){try{localStorage.setItem(BKEY,JSON.stringify({rev:rev||null,saved:Date.now(),data:typeof obj==='string'?JSON.parse(obj):obj}))}catch(e){try{localStorage.removeItem(BKEY)}catch(_){}}}
function getBase(){try{return JSON.parse(localStorage.getItem(BKEY))}catch(e){return null}}
function histAdd(L,...x){const s=[...(L||[])];x.flat().forEach(r=>{if(r&&!s.includes(r))s.push(r)});return s.slice(-300)}
function mEq(a,b){if(a===b)return true;if(a==null||b==null||typeof a!=='object'||typeof b!=='object')return false;return JSON.stringify(a)===JSON.stringify(b)}
function mObj(x){return x!=null&&typeof x==='object'&&!Array.isArray(x)}
const M_SKIP=new Set(['ui','updated','lastBackup','lastBackupKind']);
/* opt: {pref:'l'|'r', st:{c:0}} – b kann undefined sein (kein gemeinsamer Stand) */
function mergeVal(b,l,r,opt,key,path){
  if(mEq(l,r))return l;
  if(b!==undefined){if(mEq(b,l))return r;if(mEq(b,r))return l}
  else{if(l===undefined)return r;if(r===undefined)return l}
  if(mObj(l)&&mObj(r)){const o={},bb=mObj(b)?b:undefined;
    const K=[...new Set([...Object.keys(l),...Object.keys(r)])];
    K.forEach(k=>{if(M_SKIP.has(k)&&path===''){o[k]=opt.pref==='r'?(r[k]!==undefined?r[k]:l[k]):(l[k]!==undefined?l[k]:r[k]);return}
      const v=mergeVal(bb?bb[k]:undefined,l[k],r[k],opt,k,path+'/'+k);if(v!==undefined)o[k]=v});return o}
  if(Array.isArray(l)&&Array.isArray(r)){
    const hasId=A=>A.length&&A.every(x=>mObj(x)&&x.id!=null);
    if((hasId(l)||!l.length)&&(hasId(r)||!r.length)&&(l.length||r.length)){
      const bm=new Map((Array.isArray(b)?b:[]).filter(mObj).map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x]));
      const ids=[...l.map(x=>x.id),...r.map(x=>x.id).filter(id=>!lm.has(id))],out=[];
      ids.forEach(id=>{const v=mergeVal(bm.has(id)?bm.get(id):undefined,lm.get(id),rm.get(id),opt,'',path+'/#');if(v!==undefined)out.push(v)});
      /* Ohne gemeinsamen Stand: Element nur auf einer Seite = neu → behalten. Mit Stand: siehe mergeVal (gelöscht bleibt gelöscht). */
      return out}
    if(/\/obs\/[^/]+$/.test(path)){ /* Notenreihe Sport: Einträge beider Seiten vereinigen */
      const S_=x=>JSON.stringify(x),bs=new Set((Array.isArray(b)?b:[]).map(S_)),ls=new Set(l.map(S_)),rs=new Set(r.map(S_));
      const out=l.filter(x=>!(bs.has(S_(x))&&!rs.has(S_(x))));r.forEach(x=>{const k=S_(x);if(!ls.has(k)&&!bs.has(k))out.push(x)});return out}
  }
  /* echter Widerspruch */
  opt.st.c++;if(opt.st.ex.length<12)opt.st.ex.push(path);
  return opt.pref==='r'?(r!==undefined?r:l):(l!==undefined?l:r);
}
/* Mit gemeinsamem Stand wird ein Element, das b hatte und eine Seite gelöscht hat, gelöscht. mergeVal(b,undefined,r): mEq(b,r)→l=undefined ✓ */
function leafCount(a,b,path=''){ /* grobe Zahl unterschiedlicher Werte (ohne ui/Zeitstempel) */
  if(mEq(a,b))return 0;if(path===''||mObj(a)||mObj(b)||Array.isArray(a)||Array.isArray(b)){
    if((mObj(a)||a==null)&&(mObj(b)||b==null)&&(a||b)){let n=0;new Set([...Object.keys(a||{}),...Object.keys(b||{})]).forEach(k=>{if(path===''&&M_SKIP.has(k))return;if(k==='lastBackup'||k==='lastBackupKind')return;n+=leafCount((a||{})[k],(b||{})[k],path+'/'+k)});return n}
    if(Array.isArray(a)&&Array.isArray(b)&&a.every(x=>mObj(x)&&x.id!=null)&&b.every(x=>mObj(x)&&x.id!=null)){const am=new Map(a.map(x=>[x.id,x])),bm=new Map(b.map(x=>[x.id,x]));let n=0;new Set([...am.keys(),...bm.keys()]).forEach(id=>n+=leafCount(am.get(id),bm.get(id),path+'/#'));return n}}
  return 1}
/* Kern: liefert {data,conflicts,fromR,fromL,based} */
function mergeStates(local,remote,remoteEnv,pref){
  const L=JSON.parse(JSON.stringify(local)),R=JSON.parse(JSON.stringify(remote)),B0=getBase();
  const based=!!(B0&&B0.data&&B0.rev&&remoteEnv&&(remoteEnv.rev===B0.rev||(remoteEnv.hist||[]).includes(B0.rev)));
  const opt={pref,st:{c:0,ex:[]}};
  const M=mergeVal(based?B0.data:undefined,L,R,opt,'','');
  M.ui=local.ui;
  return{data:M,conflicts:opt.st.c,where:opt.st.ex,fromR:leafCount(L,M),fromL:leafCount(R,M),based};
}
function mergeFix(){ /* abgeleitete Werte neu berechnen (Sport-Ø, Punkte-Korrekturen) */
  S.classes.forEach(c=>{try{(c.exams||[]).forEach(ex=>{if(ex.entryId&&c.entries.some(e=>e.id===ex.entryId))exSync(c,ex)});if(typeof gfsSync==='function'&&(c.gfs||[]).length)gfsSync(c)}catch(e){console.warn(e)}})}
function applyMerged(m){const ui=S.ui;S=migrate(m.data);S.ui=ui;if(!S.classes.some(k=>k.id===S.ui.cls))S.ui.cls=S.classes[0]?S.classes[0].id:null;mergeFix();S.updated=Date.now();persist()}
function mergeReport(m,otherName,after){

  modal('Zusammengeführt ✓',`<p>Beide Stände sind jetzt in einem vereint.</p><ul class="mrep"><li><b>${m.fromR}</b> ${m.fromR===1?'Änderung':'Änderungen'} ${otherName?'vom '+esc(otherName):'aus der Cloud/Datei'} übernommen</li><li><b>${m.fromL}</b> ${m.fromL===1?'Änderung':'Änderungen'} von ${hereN} behalten</li>${m.conflicts?`<li><b>${m.conflicts}</b> ${m.conflicts===1?'Stelle wurde':'Stellen wurden'} auf beiden Seiten unterschiedlich geändert – dort gilt jetzt der gewählte Stand.</li>`:''}</ul>${m.based?'':'<p class="hint">Hinweis: Für diese Datei gab es noch keinen gemeinsamen Ausgangsstand. Deshalb wurde nur <b>ergänzt</b> – etwas, das auf einem Gerät gelöscht wurde, kann wieder auftauchen. Ab jetzt merkt sich das Lehrerpult den gemeinsamen Stand, dann werden auch Löschungen erkannt.</p>'}<p class="muted">Der Stand von vorher liegt als Notfall-Kopie unter Einstellungen → Cloud-Synchronisierung.</p>`,
    after?[{label:after.label,cls:'primary',fn:after.fn}]:[{label:'OK',cls:'primary'}])}

  <label class="chk"><input type="radio" name="mpref" value="r" ${newerOther?'checked':''}> Stand ${otherName?'vom '+esc(otherName):'aus der Cloud'}</label></fieldset>`}

async function pcLogin(email,pw){
  let last=null;
  for(const host of['eapi.pcloud.com','api.pcloud.com']){
    try{const r=await fetch(`https://${host}/userinfo`,{method:'POST',body:new URLSearchParams({getauth:1,logout:1,username:email,password:pw})});const j=await r.json();
      if(j.result===0&&j.auth)return{host,auth:j.auth};last=j}catch(e){last={net:e}}}
  if(last&&last.net)throw last.net;
  throw cErr('pCloud-Anmeldung fehlgeschlagen: '+((last&&last.error)||'unbekannter Fehler')+'. Bei aktivierter Zwei-Faktor-Anmeldung ist die Anmeldung hier leider nicht möglich.',1);
}

  return`<p><b>pCloud war nicht erreichbar.</b> Prüfe die Internetverbindung. Falls die Verbindung besteht, blockiert pCloud den Zugriff aus dieser Web-App.</p>`;

async function adoptRemote(old){ /* nach dem Verbinden: vorhandenen Cloud-Stand übernehmen oder überschreiben */

    SC.lastVer=nv;SC.on=true;SC.lastSync=Date.now();S.settings.lastBackup=SC.lastSync;S.settings.lastBackupKind='cloud';persist();saveSC();setSync('ok');render();toast(`Verbunden – ab jetzt wird automatisch mit ${provName(SC.prov)} synchronisiert`);return}

   [{label:'Abbrechen',fn:()=>{SC=old;saveSC();render()}},
    {label:'Dieses Gerät hochladen',fn:()=>{keepCopy(data,'Cloud-Stand vor dem Überschreiben');SC.dirty=true;fin('Verbunden');syncNow()}},
    {label:'Cloud-Daten laden',fn:()=>{keepCopy(clone(S),'Stand dieses Geräts vor dem Laden');applyRemote(data,env);SC.hist=histAdd(env.hist,env.rev);if(env.rev)setBase(env.rev,data);SC.dirty=false;fin('Verbunden – Daten geladen')}},
    {label:'Beide zusammenführen',cls:'primary',fn:()=>{SC.on=true;saveSC();doMerge(data,env,ver,'r')}}]);

async function icAdopt(text,old){ /* nach dem Verknüpfen: vorhandene Datei übernehmen oder überschreiben */

   [{label:'Abbrechen',fn:()=>{SC=old;saveSC();render()}},

    {label:'Beide zusammenführen',cls:'primary',fn:()=>{SC.on=true;saveSC();doMerge(data,env,ver,'r')}}]);

      [{label:'Noch nicht'},{label:'Erledigt – Datei liegt in '+CN()+'',cls:'primary',fn:()=>{done();toast('Als gespeichert markiert')}}]);}};
A.syncConnect=async()=>{
  const prov=SYF.prov,out=$('#synctest');const v=id=>($('#'+id)?$('#'+id).value.trim():'');
  const folder='/'+v('sy_folder').replace(/^\/+|\/+$/g,'')||'/Lehrerpult';const pw=$('#sy_pw')?$('#sy_pw').value:'';
  if(pw.length<6){toast('Bitte ein Sync-Passwort mit mindestens 6 Zeichen eingeben');return}if(pw!==($('#sy_pw2')?$('#sy_pw2').value:'')){toast('Die Sync-Passwörter stimmen nicht überein');return}
  const show=(cls,html)=>{if(out){out.className='syncbox '+cls;out.innerHTML=html}};
  show('','Verbinde und teste Schreiben &amp; Lesen …');
  const old=clone(SC);
  try{
    const next={prov,folder:folder==='/'?'/Lehrerpult':folder,pw,device:v('sy_dev')||deviceName(),on:false,dirty:false,lastVer:null};
    if(prov==='pcloud'){const email=v('sy_user'),pass=$('#sy_pass').value;if(!email||!pass){show('err','Bitte E-Mail und Passwort eingeben.');return}next.pc={...(await pcLogin(email,pass)),email}}
    else{let url=v('sy_url'),user=v('sy_user'),pass=$('#sy_pass').value;if(!url||!user||!pass){show('err','Bitte Server-Adresse, Benutzername und App-Passwort eingeben.');return}
      if(!/^https?:\/\//.test(url))url='https://'+url;url=url.replace(/\/(index\.php.*|apps\/.*|remote\.php.*)$/,'');next.nc={url,user,pass}}
    SC=next;const P=PROV[prov];const ver=await P.version();
    if(ver==null){
      const rev=uid(),text=JSON.stringify(await buildEnv(rev));const nv=await P.write(text,rev);
      const back=await P.read();const {env}=await openEnv(back);if(env.rev!==rev)throw cErr('Die zurückgelesene Datei stimmt nicht überein');
      SC.lastVer=nv;SC.on=true;SC.lastSync=Date.now();S.settings.lastBackup=SC.lastSync;S.settings.lastBackupKind='cloud';persist();saveSC();setSync('ok');render();toast('Verbunden – Daten dieses Geräts liegen jetzt in der Cloud');return;
    }
    const {env,data}=await openEnv(await remoteText(P,ver));const n=(data.classes||[]).length,local=S.classes.length;
    const finish=(how)=>{SC.on=true;SC.lastSync=Date.now();saveSC();setSync('ok');render();toast(how)};
    if(!local){applyRemote(data,env);SC.hist=histAdd(env.hist,env.rev);if(env.rev)setBase(env.rev,data);SC.lastVer=ver;SC.dirty=false;finish('Verbunden – Daten aus der Cloud geladen');return}
    SC.lastVer=ver;saveSC();
    modal('Daten in der Cloud gefunden',`<p>In der Cloud liegt bereits ein Stand${env.device?' vom '+esc(env.device):''}${env.updated?' ('+new Date(env.updated).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})+')':''} mit <b>${n} Klasse(n)</b>. Auf diesem Gerät sind <b>${local} Klasse(n)</b> gespeichert.</p><p>Welcher Stand soll ab jetzt auf allen Geräten gelten? Der andere bleibt als Notfall-Kopie hier erhalten.</p>`,
      [{label:'Abbrechen',fn:()=>{SC=old;saveSC();render()}},
       {label:'Dieses Gerät hochladen',fn:()=>{keepCopy(data,'Cloud-Stand vor dem Überschreiben');SC.dirty=true;finish('Verbunden – wird hochgeladen');syncNow()}},
       {label:'Cloud-Daten laden',cls:'primary',fn:()=>{keepCopy(clone(S),'Stand dieses Geräts vor dem Laden');applyRemote(data,env);SC.hist=histAdd(env.hist,env.rev);if(env.rev)setBase(env.rev,data);SC.dirty=false;finish('Verbunden – Daten aus der Cloud geladen')}}]);
    show('ok','Verbindung klappt – bitte auswählen, welcher Stand gelten soll.');
  }catch(e){console.warn(e);SC=old;saveSC();
    if(e instanceof TypeError)show('err',corsHelp(prov));
    else show('err',esc(e.message)+(prov==='pcloud'&&/Herunterladen/.test(e.message)?'<br>Hochladen hat funktioniert, aber ohne Herunterladen ist keine sichere Synchronisierung zwischen zwei Geräten möglich.':''));}
};

function ferienBW(y){ /* Quelle: KMK-Ferienkalender / Kultusministerium BW, Stand 09.10.2025; Feiertage außerhalb der Ferien ergänzt */
  return({'2026/27':[['Herbstferien','2026-10-26','2026-10-31'],['Weihnachtsferien','2026-12-23','2027-01-09'],['Osterferien','2027-03-25','2027-04-03'],['Christi Himmelfahrt','2027-05-06',''],['Pfingstmontag','2027-05-17',''],['Pfingstferien','2027-05-18','2027-05-29'],['Sommerferien','2027-07-29','2027-09-11']]})[y]||null}
function ferList(){return S.events.filter(e=>e.free).sort((a,b)=>a.date.localeCompare(b.date))}
function ferDays(e){return Math.round((dateOf(e.end||e.date)-dateOf(e.date))/864e5)+1}

  return`<section class="card"><h3>Ferien &amp; unterrichtsfreie Tage</h3>
   <p class="muted" style="margin-top:0">Diese Tage erscheinen im Kalender, der Stundenplan wird dort ausgeblendet, und Stoffpläne und GFS-Schätzungen rechnen nur mit Unterrichtswochen.</p>
   ${L.length?`<div class="tblwrap"><table class="fertbl"><thead><tr><th>Bezeichnung</th><th>von</th><th>bis</th><th></th></tr></thead><tbody>${L.map(e=>`<tr><td><input value="${esc(e.title)}" onchange="A.ferSet('${e.id}','title',this.value)" aria-label="Bezeichnung"></td><td><input type="date" value="${e.date}" onchange="A.ferSet('${e.id}','date',this.value)"></td><td><input type="date" value="${e.end||''}" onchange="A.ferSet('${e.id}','end',this.value)"></td><td class="muted" style="white-space:nowrap">${ferDays(e)} ${ferDays(e)===1?'Tag':'Tage'} <button class="icon danger" title="Entfernen" onclick="A.ferDel('${e.id}')">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<p><b>Noch keine Ferien eingetragen.</b></p>'}
   <div class="row" style="margin-top:10px"><button class="btn primary" onclick="A.ferAdd()">+ Ferien / freier Tag</button>${bw?`<button class="btn" onclick="A.ferBW('${Y}')">Ferien Baden-Württemberg ${esc(Y)} übernehmen</button>`:''}</div>
   <p class="hint">${bw?`„Übernehmen“ trägt die landesweiten Ferien und die Feiertage außerhalb der Ferien ein (bereits vorhandene Einträge bleiben, doppelte werden übersprungen). `:''}<b>Bewegliche Ferientage</b> legt jede Schule selbst fest – bitte mit „+ Ferien / freier Tag“ ergänzen. Für einen einzelnen Tag „bis“ leer lassen.</p>
   ${cals.length?`<p class="hint">Zusätzlich gelten die ganztägigen Termine dieser Kalender-Abos als unterrichtsfrei: ${cals.map(c=>esc(c.name)).join(', ')}.</p>`:''}</section>`}

A.ferAdd=()=>{const d=today();S.events.push({id:uid(),title:'Ferien',date:d,end:'',allday:true,s:'',e:'',loc:'',note:'',cls:'',free:true,hol:true,color:FER_COL});ferChanged();setTimeout(()=>{const I=$$('.fertbl input[aria-label=Bezeichnung]');const x=I.find(i=>i.value==='Ferien');if(x){x.focus();x.select()}},30)};
A.ferSet=(id,k,v)=>{const e=S.events.find(x=>x.id===id);if(!e)return;v=v.trim();
  if(k==='title'){e.title=v||'Ferien'}else if(k==='date'){if(!v)return toast('Bitte ein Datum wählen');e.date=v;if(e.end&&e.end<=v)e.end=''}else if(k==='end'){if(v&&v<e.date){toast('„bis“ liegt vor dem Beginn');render();return}e.end=v&&v!==e.date?v:''}
  ferChanged()};
A.ferDel=id=>{const e=S.events.find(x=>x.id===id);if(!e)return;confirmBox(`„${e.title}“ (${fmtDate(e.date)}${e.end?' – '+fmtDate(e.end):''}) entfernen?`,()=>{S.events=S.events.filter(x=>x.id!==id);ferChanged()},'Entfernen')};
A.ferBW=y=>{const L=ferienBW(y);if(!L)return;let n=0;L.forEach(([t,a,b])=>{if(S.events.some(e=>e.free&&e.date===a&&(e.end||'')===(b||'')))return;S.events.push({id:uid(),title:t,date:a,end:b||'',allday:true,s:'',e:'',loc:'',note:'',cls:'',free:true,hol:true,color:FER_COL});n++});

};
A.feat=(k,on)=>{S.settings.feat=S.settings.feat||{};S.settings.feat[k]=on;SCHEDC.clear();save();render();toast(`${FEATS.find(f=>f[0]===k)[1]} ${on?'eingeschaltet':'ausgeschaltet'}`)};
A.goSet=k=>{S.ui.setTab=k;A.go('settings')};
A.setTab=k=>{S.ui.setTab=k;persist();render();window.scrollTo(0,0)};

/* ================= Start ================= */
document.addEventListener('keydown',e=>{
  const m=$('#modal');if(!m.classList.contains('open'))return;
  if(e.key==='Escape')closeModal();
  else if(e.key==='Enter'&&e.target.matches('.mbody input')){const p=m.querySelector('.mfoot .primary');if(p){e.preventDefault();p.click()}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(syncActive()&&SC.dirty){clearTimeout(PUSHT);syncNow()}}
  else{if(syncActive())syncNow();clockTick();autoOpen();checkUpdate();A.calRefresh(false)}
});
window.addEventListener('online',()=>{if(syncActive())syncNow()});
setInterval(()=>{if(document.visibilityState!=='visible')return;if(syncActive()&&!SC.dirty&&!SYNC.busy)syncNow();},20000);
setInterval(()=>{if(document.visibilityState==='visible')autoOpen()},30000);
/* ---- Uhr: Anzeige (heute, aktuelle Stunde) bleibt aktuell, auch wenn die App tagelang offen ist ---- */
const APPV='1.0';
/* „Was ist neu“ (ab 1.0): neuester Eintrag zuerst. Bei jedem Upload: APPV + version.json erhöhen und hier einen Eintrag ergänzen. */
const NEWS=[
 {v:'1.0',d:'18.10.2026',t:'Die erste offizielle Version',items:[
  '<b>Bühne</b> für den Beamer: Timer, Zufallsauswahl, Gruppen, Arbeitsform, Ampel, Soundboard und mehr – frei anordnen, ein- und ausschalten.',
  '<b>Sicherer Abgleich</b> zwischen Mac und iPad: Änderungen von beiden Geräten werden automatisch zusammengeführt, frühere Stände bleiben im Verlauf.',
  '<b>Cloud-Ordner</b>: iCloud, OneDrive, Google Drive oder Nextcloud – immer verschlüsselt mit deinem Sync-Passwort.',
  '<b>iPad</b>: Reiter jetzt oben nebeneinander, Erinnerung ans Speichern nach der Stunde.',
  '<b>Kalender</b>: am Wochenende wird automatisch die nächste Woche gezeigt.',
  '<b>Stundenplanung im Sitzplan</b>: Planst du an einem Tag ohne Unterricht (z. B. am Wochenende), gilt die Planung automatisch für die nächste Stunde – und erscheint mit 📝 im Stundenplan.',
  '<b>Hilfe</b>: „?“ oben rechts mit Stichwortsuche und geführten Rundgängen – dort kannst du jetzt auch <b>Wünsche und Fehler melden</b>.']}
];
const SEENK='lehrerpult.seenv';
function newsHtml(L){return L.map(e=>`<h4 style="margin:12px 0 4px">Version ${esc(e.v)} <span class="muted" style="font-weight:400">· ${esc(e.d)}</span></h4>${e.t?`<p class="muted" style="margin:0 0 4px">${esc(e.t)}</p>`:''}<ul style="margin:0;padding-left:20px;line-height:1.5">${e.items.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}
A.news=since=>{let L=NEWS;const i=since?NEWS.findIndex(e=>e.v===since):-1;if(i>0)L=NEWS.slice(0,i);else if(i!==0)L=since===undefined?NEWS:NEWS.slice(0,1);
  modal(since===undefined?'Was ist neu?':'Neu in Version '+APPV,newsHtml(L.slice(0,since===undefined?20:3)),[{label:'Alles klar',cls:'primary'}])};
function newsCheck(){let seen=null;try{seen=localStorage.getItem(SEENK)}catch(e){return}if(seen===APPV)return;
  const mark=()=>{try{localStorage.setItem(SEENK,APPV)}catch(e){}};
  if(!seen&&!S.classes.length)return mark(); /* neue Installation: kein Hinweis, dafür gibt es den Rundgang */
  if(PRIV||RG||$('#modal').classList.contains('open')||document.body.classList.contains('stfocus')){setTimeout(newsCheck,10000);return}
  mark();A.news(seen&&NEWS.some(e=>e.v===seen)?seen:'')}
setTimeout(newsCheck,1500);
/* einmalig (1.0): im Sitzplan an unterrichtsfreien Tagen gespeicherte Planungen auf die nächste Stunde verschieben */
setTimeout(()=>{try{if(S.settings.lpMig1)return;let n=0;const lim=addDays(today(),-7);
  S.classes.forEach(c=>{if(!c.lp)return;Object.keys(c.lp).forEach(d=>{if(d<lim||(c.att||{})[d])return;if(dayLessons(dateOf(d)).some(l=>l.e.g===c.id))return;const nx=nextLesson(c,d);if(!nx||c.lp[nx])return;c.lp[nx]=c.lp[d];delete c.lp[d];n++})});
  S.settings.lpMig1=true;save();if(n)render()}catch(e){console.warn(e)}},800);
let LASTACT=Date.now();['pointerdown','keydown','wheel'].forEach(t=>document.addEventListener(t,()=>LASTACT=Date.now(),{capture:true,passive:true}));
function uiIdle(ms){const ae=document.activeElement;return Date.now()-LASTACT>=ms&&!$('#modal').classList.contains('open')&&!(ae&&ae.matches&&ae.matches('input,textarea,select'))&&!(typeof TM!=='undefined'&&TM.running)}
function slotIdx(){const P=S.timetable.periods,n=new Date(),m=n.getHours()*60+n.getMinutes();let k=-1;P.forEach((p,i)=>{const a=parseTime(p.s);if(a!=null&&m>=a)k=i});return k}
let CLK={day:today(),les:'',slot:slotIdx()};
function clockTick(){const d=today(),L=currentLesson(),les=L?L.key:'',slot=slotIdx(),dayCh=d!==CLK.day;
  if(dayCh){if(LDATE===CLK.day)LDATE=d;if(CALD===CLK.day)CALD=null}
  const ch=dayCh||les!==CLK.les||slot!==CLK.slot;CLK={day:d,les,slot};
  if(ch&&uiIdle(0)&&(['dash','plan'].includes(S.ui.view)||(dayCh&&S.ui.view==='sitz')))render();
  if(NEWV)tryReload()}
/* neue App-Version (nach Netlify-Upload) automatisch laden, sobald die App gerade nicht benutzt wird */
let NEWV=null,UPCHK=0;
async function checkUpdate(){if(!/^https?:$/.test(location.protocol)||Date.now()-UPCHK<5*6e4)return;UPCHK=Date.now();
  try{const r=await fetch('version.json',{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j&&j.v&&j.v!==APPV){NEWV=j.v;tryReload()}}catch(e){}} /* nur eine winzige Datei – spart Netlify-Guthaben */
function tryReload(){if(!NEWV||SYNC.busy||RG)return;if(document.visibilityState==='hidden'||uiIdle(90000)){persist();location.reload()}}
setInterval(clockTick,15000);
setInterval(()=>{if(document.visibilityState==='visible'){checkUpdate();A.calRefresh(false)}},30*6e4);
(function startView(){ /* Start: Sitzplan der aktuellen (oder nächsten) Stunde, sonst der zuletzt genutzten Lerngruppe */
  if(!S.classes.length)return;let L=currentLesson();
  if(!L){const now=new Date(),min=now.getHours()*60+now.getMinutes();const nx=dayLessons(now).find(l=>l.e.g&&parseTime(l.s)>min&&S.classes.some(k=>k.id===l.e.g));if(nx)L={c:S.classes.find(k=>k.id===nx.e.g)}}
  if(L){S.ui.cls=L.c.id;if(L.key)AUTOKEY=L.key}S.ui.view='sitz';S.ui.exam=null;SEATMODE='lesson';LDATE=today();if(cls())autoRoom(cls());if(cls()&&isSport(cls())){S.ui.view='sport';S.ui.scls=cls().id}
})();
if(S.settings.privStart)PRIV=true;
render();setStatus('Bereit');updSyncUI();autoOpen();checkExtScreen(true);
(async()=>{if(await pcReturn())return;if(SC.prov==='icloud'&&SC.mode==='auto'&&hasFSA){try{FH=await idbGet('icloud')}catch(e){}if(!FH){setSync('error','Die iCloud-Datei ist nicht mehr verknüpft – bitte in den Einstellungen neu wählen.');return}}if(syncActive())syncNow()})();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
setTimeout(()=>{A.calRefresh(false);UPCHK=Date.now()},1500);
if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
